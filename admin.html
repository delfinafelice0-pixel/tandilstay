/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */
:root{
  --monte:#2E3521; --liquen:#63653F; --arena:#DFCCAE; --ladrillo:#2E3521;
  --crudo:#FBF7E8; --papel:#F4EEDC; --tinta:#23261A; --suave:#6A6455;
  --linea:rgba(35,38,26,.10); --punt:rgba(35,38,26,.10);
  --r:24px; --rm:18px; --rs:14px; --pill:999px;
  --sombra:0 10px 30px rgba(35,38,26,.07);
  --sombra2:0 18px 44px rgba(35,38,26,.12);
  --sans:'DM Sans',system-ui,sans-serif;
  --serif:'DM Serif Display',Georgia,serif;
  --display:'DM Serif Display',Georgia,serif;
  --mano:'DM Sans',system-ui,sans-serif;
}
/* fuera la textura de papel */
.worn::before,.worn::after,body::after,body::before,#root::after,.fondo{display:none !important}

/* ── tres tonos y nada más ── */
body{background:var(--crudo) !important;color:var(--tinta) !important;
  font-family:var(--sans) !important;font-size:16px !important;line-height:1.6 !important}
.pre{background:rgba(46,53,33,.94) !important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  color:#C6CDBD !important;position:fixed !important;top:0 !important;left:0;right:0;z-index:95 !important;
  font-size:12.5px !important;letter-spacing:0 !important;text-transform:none !important}
.pre a{color:#E2E8D8 !important}
.pdot{background:var(--arena) !important;width:6px !important;height:6px !important}
header,header.vt{background:rgba(244,238,220,.85) !important;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--linea) !important;position:sticky !important;
  top:var(--preH,40px) !important;z-index:60 !important}
body{padding-top:var(--preH,40px)}
.topbar{position:static !important}
.topbar .pre{position:fixed !important}
.sabana,.cards,.gA,.strip,.ig,.cerca,.filters,.filtros,.filtrosbar,.listwrap{background:transparent !important}
footer{background:var(--monte) !important;color:#C6CDBD !important;border-top:0 !important}
footer h5{color:#9AA48D !important}
footer a,footer button{color:#DDE3D3 !important}
footer p,.next,.fnote{color:#9AA48D !important}
footer .wm,footer .wm span{color:#EDF0E6 !important}
footer .wm span{color:#9AA48D !important}
.fnote{border-top:1px solid rgba(237,240,230,.18) !important}
footer svg{stroke:#EDF0E6 !important}
footer svg circle{fill:#EDF0E6 !important}

/* ── tipografía ── */
h1,h2,h3,h4,.disp,.titulo,.wm,.etiqueta h3,.card h3,.tile h4,.mom b,.strip b,.day h4,
.tira h3,.desde,.datos b,.precio,.ficha .precio,.aa,.big,.type,.fr,.carta h3,.ptitle h1{
  font-family:var(--serif) !important;font-weight:400 !important;letter-spacing:-.015em !important}
h1{line-height:1.02 !important}
.wm{text-transform:none !important;letter-spacing:-.02em !important;font-size:17px !important;
  font-family:var(--sans) !important;font-weight:600 !important}
.wm span,.wm .sub{font-family:var(--sans) !important;letter-spacing:.18em !important;font-size:9px !important;
  color:var(--suave) !important;font-weight:400 !important}
.mano{font-family:var(--sans) !important;color:var(--suave) !important;font-style:italic}
.rot,.kick,.meta,.epi,.aside,.cat,.k,.z,.st,.ver,.eyebrow,.idx,.num,.cuenta,.count{
  text-transform:none !important;letter-spacing:0 !important;font-size:13px !important}
.eyebrow,.kick{color:var(--ladrillo) !important;font-weight:600 !important;font-size:13px !important}
.eyebrow i,.eyebrow span,.kicker span{display:none !important}
.marco > .num,.shead .idx{display:none !important}
.marco{grid-template-columns:1fr !important;gap:0 !important}
/* el punto verde antes de cada título */
h2::before,.titulo::before{content:"" !important;display:inline-block;width:8px;height:8px;
  border-radius:50%;background:var(--monte);margin-right:12px;vertical-align:middle;position:static}

/* ── botones y campos: pastillas ── */
.solid,.ghost,.sel,.pill,.send,.mail,.wsp,.ver,.btn,.chip,.mom,.cta{
  border-radius:var(--pill) !important;text-transform:none !important;letter-spacing:0 !important;
  font-size:14px !important;font-weight:500 !important}
.solid{background:var(--ladrillo) !important;border-color:var(--ladrillo) !important;color:#fff !important;
  padding:12px 22px !important}
.ghost,.sel,.pill{background:rgba(255,255,255,.62) !important;border:1px solid var(--linea) !important;
  color:var(--tinta) !important;padding:11px 18px !important;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sel.on,.pill.on{background:var(--monte) !important;border-color:var(--monte) !important;color:#EDF0E6 !important}
.send{background:var(--monte) !important;color:#EDF0E6 !important;border-radius:var(--pill) !important}
.field input,.field select,.field textarea,input,select,textarea{
  border-radius:var(--rs) !important;border:1px solid var(--linea) !important;
  background:rgba(251,247,232,.8) !important;font-family:var(--sans) !important}

/* ── superficies de vidrio ── */
.form,.calbox,.ficha,.plan,.day,.datos,.indice ol,.momentos,.mom,.carta,.panel,.amenbox,
.modalbox,.popbox,.reservar,.aviso,.nodisp,.horarios,.bloque{
  background:rgba(255,255,255,.72) !important;border:1px solid rgba(255,255,255,.6) !important;

.carta{background:var(--monte) !important;border:0 !important;color:#DDE3D3 !important}
.carta h3{color:#EDF0E6 !important}
.carta .btn{background:var(--arena) !important;color:var(--monte) !important;border:0 !important}
.spread img,.par img,.tercias img,.galeria img,.videos iframe,.mapa,.tile,.mini .ph,
.apertura,.card figure,.unidad .ph{border-radius:var(--rm) !important;overflow:hidden}
.mapa{filter:grayscale(.25) sepia(.05) !important}

/* ── líneas: sólidas y finas ── */
.fill,.filas div,.comod div,.item,.stops li,.indice li,.horarios div,.epi,.price,.pie,
.shead,.sh,.head{border-style:solid !important;border-color:var(--linea) !important}
.shead,.marco .titulo{border-bottom:1px solid var(--linea) !important;padding-bottom:12px !important}

/* ═══════════ SÁBANA · OPCIÓN B ═══════════ */
.cards,.gA{display:grid !important;grid-template-columns:repeat(3,1fr) !important;gap:26px !important;
  padding:8px 0 10px !important;margin:0 !important;clip-path:none !important;box-shadow:none !important}
.card,.pA{background:transparent !important;border:0 !important;box-shadow:none !important;
  padding:0 0 44px 0 !important;position:relative !important;
  -webkit-backdrop-filter:none !important;backdrop-filter:none !important}
.card:hover,.pA:hover{transform:none !important;box-shadow:none !important;border-color:transparent !important}
.card .ph,.pA .ph,.card figure{aspect-ratio:4/5 !important;height:auto !important;
  border-radius:var(--r) !important;overflow:hidden;box-shadow:var(--sombra) !important;position:relative}
.card:hover .ph,.pA:hover .ph{box-shadow:var(--sombra2) !important}
.card .ph img,.pA .ph img{width:100% !important;height:100% !important;object-fit:cover !important}
/* la hojita de vidrio, montada y sobresaliendo */
.etiqueta,.card .body{
  position:absolute !important;left:16px !important;right:34px !important;bottom:0 !important;
  z-index:4;background:rgba(255,255,255,.74) !important;
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid rgba(255,255,255,.6) !important;border-radius:var(--rm) !important;
  padding:16px 18px !important;box-shadow:0 14px 34px rgba(35,38,26,.16) !important;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s}
.card:hover .body,.pA:hover .etiqueta{transform:translateY(-6px);background:rgba(255,255,255,.88) !important}
.etiqueta h3,.card .body h3{font-size:19px !important;margin:0 0 2px !important}
.etiqueta .z,.card .body .meta{font-size:12.5px !important;color:var(--suave) !important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etiqueta .pie,.card .price{margin-top:12px !important;padding-top:11px !important;
  border-top:1px solid var(--linea) !important;border-bottom:0 !important}
.card .price b,.etiqueta .pr{font-family:var(--sans) !important;font-weight:600 !important;
  font-size:18px !important;letter-spacing:-.02em !important}
.card .price em,.etiqueta .ver{color:var(--ladrillo) !important;font-weight:500 !important;font-size:13.5px !important}
/* las etiquetas blancas sobre la foto */
.chips{top:12px !important;left:12px !important;flex-direction:row !important;flex-wrap:wrap;gap:6px !important}
.chips .chip,.card .chips .chip{background:rgba(255,255,255,.8) !important;border-radius:var(--pill) !important;
  padding:6px 12px !important;font-size:11.5px !important;font-weight:500 !important;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:0 !important;margin:0 !important;
  text-transform:none !important;letter-spacing:0 !important}

/* ── filtros pegados ── */
.filters,.filtros{position:sticky !important;top:calc(var(--preH,40px) + 66px) !important;z-index:50 !important;
  background:rgba(251,247,232,.9) !important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:14px 0 12px !important;border-bottom:1px solid var(--linea) !important;
  border-top:0 !important;box-shadow:none !important;display:flex !important;gap:9px !important;
  overflow-x:auto;flex-wrap:nowrap !important;scrollbar-width:none}
.filters::-webkit-scrollbar,.filtros::-webkit-scrollbar{display:none}
.filters .sel,.filtros .sel{flex:0 0 auto !important}
.count,.cuenta{margin-left:auto !important;align-self:center;flex:0 0 auto}

/* ── portada ── */
.hero{border-radius:0 !important}
.hero .bg,.hero .bg img,.hero .bg video{border-radius:0 !important}
.hero .bg::after{background:linear-gradient(100deg,rgba(24,28,18,.40) 0%,rgba(24,28,18,.06) 55%,rgba(24,28,18,.32) 100%) !important}
.sheet{background:rgba(255,255,255,.68) !important;border:1px solid rgba(255,255,255,.55) !important;
  border-radius:var(--r) !important;-webkit-backdrop-filter:blur(22px) saturate(1.3);
  backdrop-filter:blur(22px) saturate(1.3);box-shadow:var(--sombra2) !important;
  padding:30px 32px 28px !important;max-width:480px !important}
.sheet h1{font-size:clamp(32px,4vw,46px) !important}
.sheet .lede{font-size:15.5px !important;color:var(--suave) !important}
.strip button{background:rgba(255,255,255,.7) !important;border:1px solid rgba(255,255,255,.6) !important;
  border-radius:var(--rm) !important;box-shadow:var(--sombra) !important;margin:0 !important}
.strip .in{gap:14px !important;padding-top:18px !important;padding-bottom:18px !important}
.strip{border-bottom:0 !important}

/* ── mosaico y carruseles ── */
.mosaic{gap:14px !important}
.mini{display:flex !important;gap:16px !important;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;padding-bottom:8px}
.mini::-webkit-scrollbar{display:none}
.mini > a{flex:0 0 250px;scroll-snap-align:start;background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.6);border-radius:var(--rm);padding:8px;box-shadow:var(--sombra)}
.mini > a:hover{transform:translateY(-3px);box-shadow:var(--sombra2)}
.mini h4{margin:11px 8px 0 !important;font-size:17px !important}
.mini p{margin:2px 8px 10px !important}

/* ── barra de abajo ── */
.appbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:85;
  background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  backdrop-filter:blur(20px) saturate(1.2);border:1px solid rgba(255,255,255,.7);
  border-radius:28px;box-shadow:0 14px 40px rgba(35,38,26,.18);
  display:grid;grid-template-columns:repeat(5,1fr);padding:10px 8px;
  width:calc(100% - 32px);max-width:520px}
.appbar a{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;
  font-size:11.5px;color:var(--suave);text-decoration:none;border-radius:16px}
.appbar a.on{color:var(--ladrillo);font-weight:600}
.appbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){ .appbar{display:none} }

/* ══════════ CELULAR ══════════ */
@media(max-width:900px){
  .nav{display:none !important}
  .burger{display:none !important}
  body{padding-bottom:100px}

}
@media(max-width:760px){
  .in{padding-left:20px !important;padding-right:20px !important}
  .pre{position:sticky !important}
  body{padding-top:0}
  header,header.vt{position:static !important;background:transparent !important;border-bottom:0 !important}
  .hbar{padding:14px 0 4px !important;justify-content:center}
  .acts{display:none !important}
  .pre .der,.pre .loc{display:none}
  .pre .in{justify-content:center}
  .hero{display:block !important;position:relative !important;min-height:0 !important}
  .hero .bg{position:absolute !important;inset:0 !important;height:100% !important}
  .hgrid{display:block !important;padding:64px 0 40px !important}
  .sheet{max-width:none !important;margin:0 !important;padding:24px 20px 22px !important}
  .sheet h1{font-size:31px !important}
  .heroctas{display:grid !important;grid-template-columns:1fr !important;gap:9px !important}

  .strip .in{grid-template-columns:1fr !important;gap:10px !important}
  .cards,.gA{grid-template-columns:1fr !important;gap:22px !important}
  .card .ph,.pA .ph{aspect-ratio:4/3 !important}
  .etiqueta,.card .body{left:14px !important;right:22px !important}
  .card,.pA{padding-bottom:38px !important}
  .filters,.filtros{top:0 !important;padding-left:20px !important;padding-right:20px !important;
    margin-left:-20px !important;margin-right:-20px !important}
  .mosaic{grid-template-columns:1fr 1fr !important;grid-auto-rows:auto !important;padding:0 20px !important}
  .mosaic .tile{min-height:150px}
  .momentos,.plan,.reserva,.comod,.videos,.par,.tercias,.consulta,.f2,.fgrid{grid-template-columns:1fr !important}
  .apertura{margin:0 20px !important;height:44vh !important;min-height:250px !important}
  .mini > a{flex:0 0 74%}
  section{padding-top:40px !important;padding-bottom:40px !important}
}

/* ── encabezado y filtros sin fondo propio: se ve el mismo fondo de la página ── */
header, header.vt{ background:transparent !important;
  -webkit-backdrop-filter:saturate(1.1) blur(12px); backdrop-filter:saturate(1.1) blur(12px);
  border-bottom:1px solid rgba(70,62,42,.10) !important }

  -webkit-backdrop-filter:saturate(1.1) blur(12px); backdrop-filter:saturate(1.1) blur(12px);

.flex.items-center.border > input,

</style>

    const lista = (data||[]).slice().sort((a,b)=>{
      const oa = a.orden==null ? 9999 : a.orden, ob = b.orden==null ? 9999 : b.orden;
      if(oa!==ob) return oa-ob;
      return (a.name||"").localeCompare(b.name||"");
    });
    setItems(lista); setCargando(false);
  };
  useEffect(()=>{ cargar(rubro); },[rubro]);

  const mover = (i, dir) => {
    const j = i+dir;
    if(j<0 || j>=items.length) return;
    const l = items.slice();
    const t = l[i]; l[i] = l[j]; l[j] = t;
    setItems(l); setAviso("");
  };
  const alPrincipio = (i) => {
    const l = items.slice(); const [x] = l.splice(i,1); l.unshift(x); setItems(l); setAviso("");
  };

  const guardar = async () => {
    setGuardando(true); setAviso("");
    let fallo = null;
    for(let i=0;i<items.length;i++){
      const { error } = await db.from(rubro).update({ orden: i+1 }).eq("slug", items[i].slug);
      if(error){ fallo = error.message; break; }
    }
    setGuardando(false);
    setAviso(fallo ? ("No se pudo guardar: "+fallo) : "Orden guardado. Así se ve en el sitio.");
    if(!fallo) cargar(rubro);
  };

  const foto = (x) => x.banner || (x.photos && x.photos[0]) || "";

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl border border-black/5 p-5">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h2 className="ff-display text-xl" style={{color:C.ink}}>Orden de las publicaciones</h2>
            <p className="ff-body text-sm text-stone-500 mt-1">
              El primero de la lista es el que aparece primero en el sitio. Movelo con las flechas y guardá.
            </p>
          </div>
          <div className="flex gap-2">
            {RUBROS.map(r=>(
              <button key={r.clave} onClick={()=>setRubro(r.clave)}
                className={"px-3.5 py-2 rounded-full ff-body text-sm "+(rubro===r.clave?"text-white":"text-stone-600 border border-stone-300")}
                style={rubro===r.clave?{background:C.moss}:{}}>{r.titulo}</button>
            ))}
          </div>
        </div>
      </div>

      {aviso && (
        <div className="rounded-xl px-4 py-3 ff-body text-sm"
          style={{background: aviso.startsWith("No") ? "#fdecec" : "rgba(46,53,33,.08)",
                  color: aviso.startsWith("No") ? "#a33" : C.ink}}>{aviso}</div>
      )}

      <div className="bg-white rounded-2xl border border-black/5 divide-y divide-black/5">
        {cargando ? (
          <p className="ff-body text-stone-500 p-6">Cargando…</p>
        ) : items.length===0 ? (
          <p className="ff-body text-stone-500 p-6">No hay publicaciones en este rubro.</p>
        ) : items.map((x,i)=>(
          <div key={x.slug} className="flex items-center gap-3 p-3">
            <span className="ff-display text-lg w-7 text-center shrink-0" style={{color:C.clay}}>{i+1}</span>
            {foto(x)
              ? <img src={foto(x)} alt="" className="w-12 h-12 rounded-lg object-cover shrink-0" />
              : <div className="w-12 h-12 rounded-lg shrink-0" style={{background:"#EDE9DD"}}></div>}
            <div className="flex-1 min-w-0">
              <p className="ff-body text-sm font-semibold truncate" style={{color:C.ink}}>{x.name}</p>
              <p className="ff-body text-xs text-stone-400 truncate">{x.slug}</p>
            </div>
            <div className="flex gap-1.5 shrink-0">
              <button onClick={()=>alPrincipio(i)} disabled={i===0} title="Poner primero"
                className="w-9 h-9 rounded-lg border border-stone-300 ff-body disabled:opacity-30">↑↑</button>
              <button onClick={()=>mover(i,-1)} disabled={i===0} title="Subir"
                className="w-9 h-9 rounded-lg border border-stone-300 ff-body disabled:opacity-30">↑</button>
              <button onClick={()=>mover(i,1)} disabled={i===items.length-1} title="Bajar"
                className="w-9 h-9 rounded-lg border border-stone-300 ff-body disabled:opacity-30">↓</button>
            </div>
          </div>
        ))}
      </div>

      {items.length>0 && (
        <div className="flex items-center gap-3">
          <button onClick={guardar} disabled={guardando}
            className="text-white rounded-xl px-5 py-3 ff-body font-semibold disabled:opacity-50"
            style={{background:C.moss}}>{guardando ? "Guardando…" : "Guardar este orden"}</button>
          <button onClick={()=>cargar(rubro)} className="rounded-xl px-4 py-3 ff-body text-sm border border-stone-300">
            Descartar cambios
          </button>
        </div>
      )}
    </div>
  );
}

function Newsletter(){
  const [list,setList]=useState(null);
  const [q,setQ]=useState("");
  const [stats,setStats]=useState(null);
  const [msg,setMsg]=useState("");
  const cargar=async()=>{
    const [r,st]=await Promise.all([
      db.from("subscribers").select("*").order("created_at",{ascending:false}),
      db.rpc("subscribers_stats"),
    ]);
    setList(r.data||[]);
    setStats((st.data&&st.data[0])||null);
  };
  useEffect(()=>{ cargar(); },[]);
  const activos=(list||[]).filter(x=>!x.unsubscribed);
  const show=(list||[]).filter(x=>!q || (x.email||"").toLowerCase().includes(q.toLowerCase()));
  const fecha=(s)=>{ try{ const d=new Date(s); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }catch(e){ return ""; } };

  const copiar=async()=>{
    const txt=activos.map(x=>x.email).join(", ");
    try{ await navigator.clipboard.writeText(txt); setMsg("Copiados "+activos.length+" correos"); }
    catch(e){ setMsg("No se pudo copiar"); }
    setTimeout(()=>setMsg(""),2500);
  };
  const exportar=()=>{
    const filas=[["email","alta","origen","baja"]].concat(
      (list||[]).map(x=>[x.email, x.created_at||"", x.source||"", x.unsubscribed?"si":"no"]));
    const csv=filas.map(f=>f.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
    a.download="suscriptores-visitando-tandil.csv";
    a.click();
  };
  const baja=async(x)=>{
    await db.from("subscribers").update({unsubscribed:!x.unsubscribed}).eq("id",x.id);
    cargar();
  };

  if(list===null) return <p className="ff-body text-stone-500">Cargando la lista…</p>;

  return (
    <div className="space-y-5">
      <div className="grid sm:grid-cols-3 gap-4">
        <div className="bg-white border border-black/5 p-5">
          <div className="ff-body text-[11px] uppercase tracking-widest text-stone-500 mb-1">Anotados</div>
          <div className="ff-display text-3xl" style={{color:C.ink}}>{stats?stats.total:activos.length}</div>
        </div>
        <div className="bg-white border border-black/5 p-5">
          <div className="ff-body text-[11px] uppercase tracking-widest text-stone-500 mb-1">Últimos 30 días</div>
          <div className="ff-display text-3xl" style={{color:C.ink}}>{stats?stats.last30:"—"}</div>
        </div>
        <div className="bg-white border border-black/5 p-5">
          <div className="ff-body text-[11px] uppercase tracking-widest text-stone-500 mb-1">Últimos 7 días</div>
          <div className="ff-display text-3xl" style={{color:C.ink}}>{stats?stats.last7:"—"}</div>
        </div>
      </div>

      <div className="bg-white border border-black/5 p-5">
        <div className="flex flex-wrap items-center gap-2 mb-4">
          <h3 className="ff-display text-lg" style={{color:C.ink}}>Suscriptores</h3>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar un correo"
            className="border border-stone-300 px-3 py-2 ff-body text-sm" />
          <button onClick={exportar} className="px-3.5 py-2 ff-body text-sm text-white ml-auto" style={{background:C.moss}}>Descargar CSV</button>
          <button onClick={copiar} className="px-3.5 py-2 ff-body text-sm border border-stone-300 text-stone-600">Copiar correos</button>
          <button onClick={cargar} className="px-3.5 py-2 ff-body text-sm border border-stone-300 text-stone-600">Actualizar</button>
        </div>
        {msg && <div className="ff-body text-sm mb-3" style={{color:C.moss}}>{msg}</div>}

        {show.length===0 ? (
          <p className="ff-body text-stone-500 py-6">Todavía no hay nadie anotado.</p>
        ) : (
          <div>
            {show.map(x=>(
              <div key={x.id} className="flex flex-wrap items-center gap-3 py-2.5 border-b border-black/5">
                <span className="ff-body text-sm" style={{color:x.unsubscribed?"#9a958a":C.ink, textDecoration:x.unsubscribed?"line-through":"none"}}>{x.email}</span>
                <span className="ff-body text-[11px] uppercase tracking-widest text-stone-500">{fecha(x.created_at)}</span>
                {x.source && <span className="ff-body text-[11px] uppercase tracking-widest text-stone-500">{x.source}</span>}
                <button onClick={()=>baja(x)} className="ml-auto px-3 py-1.5 ff-body text-xs border border-stone-300 text-stone-600">
                  {x.unsubscribed?"Volver a anotar":"Dar de baja"}
                </button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="bg-white border border-black/5 p-5">
        <h3 className="ff-display text-lg mb-2" style={{color:C.ink}}>Cómo mandar el mail</h3>
        <p className="ff-body text-sm text-stone-600" style={{maxWidth:"62ch"}}>
          Desde acá se guardan y se administran los correos, pero el envío se hace desde un servicio de mails.
          Descargá el CSV, importalo en Brevo o Mailchimp y armá el envío ahí. Es gratis hasta unos cuantos
          cientos de mails por día y te evita terminar en la carpeta de correo no deseado.
        </p>
      </div>
    </div>
  );
}

                      <input defaultValue={p.operator||""} onBlur={e=>updateProfile(p.id,{operator:e.target.value})} placeholder="operador" className="flex-1 min-w-0 border border-stone-300 rounded-lg px-2 py-1.5 ff-body text-sm" />
                      <div className="flex items-center gap-1.5 shrink-0">
                        <span className="ff-body text-xs text-stone-500">Pub.</span>
                        <input defaultValue={p.max_listings??""} onBlur={e=>updateProfile(p.id,{max_listings:e.target.value===""?null:parseInt(e.target.value,10)})} placeholder="∞" className="w-12 border border-stone-300 rounded-lg px-2 py-1.5 ff-body text-sm" />
                      </div>
                    </div>

                    {landing && (
                      <div className="flex items-center gap-1.5 mt-2.5 bg-stone-50 rounded-lg px-2 py-1.5">
                        <span className="ff-body text-xs text-stone-500 shrink-0">🔗</span>
                        <span className="ff-body text-xs truncate flex-1" style={{color:C.ink}}>{landing}</span>
                        <button onClick={()=>copyUrl(landing)} className="rounded-md px-2 py-1 ff-body text-xs border border-stone-300 text-stone-600 shrink-0">Copiar</button>
                        <a href={landing} target="_blank" rel="noreferrer" className="rounded-md px-2 py-1 ff-body text-xs text-white shrink-0" style={{background:C.clay}}>Abrir front</a>
                      </div>
                    )}

                    <div className="flex flex-wrap items-end gap-x-3 gap-y-2 mt-2.5">
                      <div>
                        <div className="ff-body text-[11px] text-stone-500 mb-0.5">Último pago</div>
                        <input key={"lp"+(p.last_paid||"")} type="date" defaultValue={p.last_paid||""} onBlur={e=>updateProfile(p.id,{last_paid:e.target.value||null})} className="border border-stone-300 rounded-lg px-2 py-1.5 ff-body text-sm" />
                      </div>
                      <div>
                        <div className="ff-body text-[11px] text-stone-500 mb-0.5">Próximo pago</div>
                        <input key={"nd"+(p.next_due||"")} type="date" defaultValue={p.next_due||""} onBlur={e=>updateProfile(p.id,{next_due:e.target.value||null})} className="border border-stone-300 rounded-lg px-2 py-1.5 ff-body text-sm" />
                      </div>
                      <button onClick={()=>markPaid(p)} className="rounded-lg px-3 py-1.5 ff-body text-xs font-semibold text-white" style={{background:C.moss}}>✓ Pagó hoy</button>
                    </div>

                    <div className="flex items-center gap-3 mt-3">
                      {panelHref && <a href={panelHref} target="_blank" rel="noreferrer" className="ff-body text-xs" style={{color:C.clay}}>Abrir su panel →</a>}
                      {!isMe && <button onClick={()=>delUser(p)} disabled={busy} className="ml-auto rounded-lg px-3 py-1.5 ff-body text-sm border border-rose-200 text-rose-600 disabled:opacity-50">🗑️ Borrar</button>}
                    </div>
                  </div>
                  );
                })}
              </div>
            </div>
          </div>
        ) : tab==="orden" ? (
          <Orden />
        ) : tab==="newsletter" ? (
          <Newsletter />
        ) : (
          <div className="space-y-6">
            <div className="grid sm:grid-cols-3 gap-4">
              {[["Hospedajes",counts.cabins,"panel.html"],["Gastronomía",counts.restaurants,"gastro-panel.html"],["Actividades",counts.activities,"act-panel.html"]].map(([l,n,href],i)=>(
                <a key={i} href={href} className="bg-white rounded-2xl border border-black/5 p-6 block">
                  <div className="ff-display text-3xl" style={{color:C.ink}}>{n??"…"}</div>
                  <div className="ff-body text-stone-500">{l}</div>
                  <div className="ff-body text-sm mt-3" style={{color:C.clay}}>Abrir panel →</div>
                </a>
              ))}
            </div>

            {(()=>{
              const sortedByDue=[...profiles].filter(p=>p.role!=="admin").sort((a,b)=>{
                if(!a.next_due&&!b.next_due) return 0;
                if(!a.next_due) return 1;
                if(!b.next_due) return -1;
                return a.next_due<b.next_due?-1:a.next_due>b.next_due?1:0;
              });
              return (
              <div className="bg-white rounded-2xl border border-black/5 p-5">
                <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
                  <h3 className="ff-display text-lg" style={{color:C.ink}}>Cobros · vencimientos</h3>
                  <span className="ff-body text-xs text-stone-500">{sortedByDue.length} operadores · el próximo a vencer va primero</span>
                </div>
                <div className="overflow-x-auto -mx-2 px-2">
                  <table className="w-full ff-body text-sm border-collapse">
                    <thead>
                      <tr className="text-left text-stone-400 ff-body text-[11px] uppercase tracking-wide">
                        <th className="py-2 pr-3 font-semibold">Operador</th>
                        <th className="py-2 px-3 font-semibold">Rubro</th>
                        <th className="py-2 px-3 font-semibold whitespace-nowrap">Último pago</th>
                        <th className="py-2 px-3 font-semibold">Vence</th>
                        <th className="py-2 px-3 font-semibold">Estado</th>
                        <th className="py-2 pl-3 font-semibold text-right">Acción</th>
                      </tr>
                    </thead>
                    <tbody>
                      {sortedByDue.length===0 && <tr><td colSpan="6" className="py-6 text-center text-stone-400">Todavía no hay operadores cargados.</td></tr>}
                      {sortedByDue.map((p,idx)=>{
                        const st=billingStatus(p.next_due);
                        const rubroLabel=(ROLES.find(r=>r[0]===p.role)||[null,"—"])[1];
                        const initial=(p.operator||p.email||"?").trim().charAt(0).toUpperCase();
                        const top=idx===0 && !!p.next_due;
                        return (
                        <tr key={p.id} className="border-t border-stone-100" style={top?{background:"#fbf6ec"}:{}}>
                          <td className="py-2.5 pr-3">
                            <div className="flex items-center gap-2">
                              {p.logo ? <img src={p.logo} className="w-7 h-7 rounded-full object-cover shrink-0" /> : <div className="w-7 h-7 rounded-full grid place-items-center text-white ff-display text-xs shrink-0" style={{background:C.moss}}>{initial}</div>}
                              <div className="min-w-0">
                                <div className="font-semibold truncate" style={{color:C.ink}}>{p.operator||"(sin operador)"}{top && <span className="ml-1.5 text-[10px] font-semibold" style={{color:C.clay}}>⏰ próximo</span>}</div>
                                <div className="text-[11px] text-stone-400 truncate">{p.email}</div>
                              </div>
                            </div>
                          </td>
                          <td className="py-2.5 px-3 text-stone-600 whitespace-nowrap">{rubroLabel}</td>
                          <td className="py-2.5 px-3 text-stone-600 whitespace-nowrap">{fmtDate(p.last_paid)}</td>
                          <td className="py-2.5 px-3 whitespace-nowrap font-semibold" style={{color:C.ink}}>{fmtDate(p.next_due)}</td>
                          <td className="py-2.5 px-3 whitespace-nowrap"><span className="ff-body text-[11px] rounded-full px-2 py-0.5" style={{background:st.bg,color:st.fg}}>{st.label}</span></td>
                          <td className="py-2.5 pl-3 text-right whitespace-nowrap"><button onClick={()=>markPaid(p)} className="rounded-lg px-2.5 py-1 ff-body text-xs font-semibold text-white" style={{background:C.moss}}>✓ Pagó hoy</button></td>
                        </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
              );
            })()}

            {(()=>{
              const totalVisits = views.reduce((s,r)=>s+(r.total||0),0);
              const RL={hospedaje:"Hospedaje",gastronomia:"Gastronomía",actividad:"Actividad"};
              return (
              <div className="bg-white rounded-2xl border border-black/5 p-5">
                <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
                  <h3 className="ff-display text-lg" style={{color:C.ink}}>Visitas por publicación</h3>
                  <span className="ff-body text-xs text-stone-500">{totalVisits.toLocaleString("es-AR")} visitas en total · de más a menos</span>
                </div>
                <div className="overflow-x-auto -mx-2 px-2">
                  <table className="w-full ff-body text-sm border-collapse">
                    <thead>
                      <tr className="text-left text-stone-400 ff-body text-[11px] uppercase tracking-wide">
                        <th className="py-2 pr-3 font-semibold">Publicación</th>
                        <th className="py-2 px-3 font-semibold">Rubro</th>
                        <th className="py-2 px-3 font-semibold text-right">Últimos 30 días</th>
                        <th className="py-2 pl-3 font-semibold text-right">Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      {views.length===0 && <tr><td colSpan="4" className="py-6 text-center text-stone-400">Todavía no hay visitas registradas.</td></tr>}
                      {views.map((r,idx)=>(
                        <tr key={r.rubro+r.slug} className="border-t border-stone-100" style={(idx===0&&r.total>0)?{background:"#fbf6ec"}:{}}>
                          <td className="py-2.5 pr-3 font-semibold" style={{color:C.ink}}>{r.name}{(idx===0&&r.total>0) && <span className="ml-1.5 text-[10px] font-semibold" style={{color:C.clay}}>★ la más vista</span>}</td>
                          <td className="py-2.5 px-3 text-stone-600 whitespace-nowrap">{RL[r.rubro]||r.rubro}</td>
                          <td className="py-2.5 px-3 text-right text-stone-600">{(r.last30||0).toLocaleString("es-AR")}</td>
                          <td className="py-2.5 pl-3 text-right font-bold" style={{color:C.ink}}>{(r.total||0).toLocaleString("es-AR")}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              );
            })()}
          </div>
        )}
      </div>
      <footer className="py-8 text-center ff-body text-sm" style={{background:C.moss,color:"rgba(255,255,255,0.7)"}}>Admin · Visitando Tandil · Creado por <a href="https://www.instagram.com/co.makers_/" target="_blank" rel="noopener noreferrer" style={{color:"inherit",textDecoration:"underline"}}>Comakers</a></footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
(function(){
  function medir(){var p=document.querySelector('.pre');
    /* si la página no tiene la franja de arriba, no hay que dejar lugar para ella */
    document.documentElement.style.setProperty('--preH', (p ? p.offsetHeight : 0)+'px');}
  window.addEventListener('load',medir);window.addEventListener('resize',medir);
  document.addEventListener('DOMContentLoaded',medir);setInterval(medir,1200);
})();
</script>
<style>
/* ── páginas sin la franja verde de arriba: el encabezado va pegado al borde ── */
body{ padding-top:0 !important }
header, header.vt{ position:sticky !important; top:0 !important;
  background:transparent !important; box-shadow:none !important;
  -webkit-backdrop-filter:saturate(1.1) blur(12px); backdrop-filter:saturate(1.1) blur(12px);
  border-bottom:1px solid rgba(70,62,42,.10) !important }
.filters, .filtros{ top:66px !important; background:transparent !important }
</style>
</body>
</html>
