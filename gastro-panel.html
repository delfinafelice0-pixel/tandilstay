<html lang="es">
<head>

<title>Panel Gastronomía · Visitando Tandil</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap');
.ff-display{font-family:'DM Serif Display',Georgia,serif;font-weight:400}.ff-body{font-family:'DM Sans',system-ui,sans-serif}body{margin:0}

button, button b, button small, button em, button span{ color:inherit }

/* ── encabezado y filtros sin fondo propio: se ve el mismo fondo de la página ── */
header, header.vt{ background:transparent !important;
  -webkit-backdrop-filter:saturate(1.1) blur(12px); backdrop-filter:saturate(1.1) blur(12px);
  border-bottom:1px solid rgba(70,62,42,.10) !important }
.filtrosbar, .filters, .filtros{ background:transparent !important;
  -webkit-backdrop-filter:saturate(1.1) blur(12px); backdrop-filter:saturate(1.1) blur(12px);
  border-bottom:1px solid rgba(70,62,42,.10) !important }

/* ── campos de precio: un solo recuadro, con el ARS$ adentro ── */
.flex.items-center.border > input,
.flex.items-center.border > span + input{
  border:0 !important; background:transparent !important; box-shadow:none !important;
  border-radius:0 !important; padding-left:8px !important; outline:none !important }
.flex.items-center.border:focus-within{
  border-color:#2E3521 !important; box-shadow:0 0 0 3px rgba(46,53,33,.10) }
/* la flechita de los números molesta más de lo que ayuda */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0 }
input[type=number]{ -moz-appearance:textfield }
</style>
<style>
/* ═══════════════════════════════════════════════════════════
   ESTILO DEFINITIVO · versión 3 + sábana B
   Va último: manda sobre todo lo anterior.
   ═══════════════════════════════════════════════════════════ */
:root{
  --monte:#2E3521; --liquen:#63653F; --arena:#DFCCAE; --ladrillo:#2E3521;
  --crudo:#FBF7E8; --papel:#F4EEDC; --tinta:#23261A; --suave:#6A6455;
  --linea:rgba(35,38,26,.10); --punt:rgba(35,38,26,.10);
  --r:24px; --rm:18px; --rs:14px; --pill:999px;
  --sombra:0 10px 30px rgba(35,38,26,.07);
  --sombra2:0 18px 44px rgba(35,38,26,.12);
  --sans:'DM Sans',system-ui,sans-serif;
  --serif:'DM Serif Display',Georgia,serif;
  --display:'DM Serif Display',Georgia,serif;
  --mano:'DM Sans',system-ui,sans-serif;
}
/* fuera la textura de papel */
.worn::before,.worn::after,body::after,body::before,#root::after,.fondo{display:none !important}

/* ── tres tonos y nada más ── */
body{background:var(--crudo) !important;color:var(--tinta) !important;
  font-family:var(--sans) !important;font-size:16px !important;line-height:1.6 !important}
.pre{background:rgba(46,53,33,.94) !important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  color:#C6CDBD !important;position:fixed !important;top:0 !important;left:0;right:0;z-index:95 !important;
  font-size:12.5px !important;letter-spacing:0 !important;text-transform:none !important}
.pre a{color:#E2E8D8 !important}
.pdot{background:var(--arena) !important;width:6px !important;height:6px !important}
header,header.vt{background:rgba(244,238,220,.85) !important;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--linea) !important;position:sticky !important;
  top:var(--preH,40px) !important;z-index:60 !important}
body{padding-top:var(--preH,40px)}
.topbar{position:static !important}
.topbar .pre{position:fixed !important}
.sabana,.cards,.gA,.strip,.ig,.cerca,.filters,.filtros,.filtrosbar,.listwrap{background:transparent !important}
footer{background:var(--monte) !important;color:#C6CDBD !important;border-top:0 !important}
footer h5{color:#9AA48D !important}
footer a,footer button{color:#DDE3D3 !important}
footer p,.next,.fnote{color:#9AA48D !important}
footer .wm,footer .wm span{color:#EDF0E6 !important}
footer .wm span{color:#9AA48D !important}
.fnote{border-top:1px solid rgba(237,240,230,.18) !important}
footer svg{stroke:#EDF0E6 !important}
footer svg circle{fill:#EDF0E6 !important}

/* ── tipografía ── */
h1,h2,h3,h4,.disp,.titulo,.wm,.etiqueta h3,.card h3,.tile h4,.mom b,.strip b,.day h4,
.tira h3,.desde,.datos b,.precio,.ficha .precio,.aa,.big,.type,.fr,.carta h3,.ptitle h1{
  font-family:var(--serif) !important;font-weight:400 !important;letter-spacing:-.015em !important}
h1{line-height:1.02 !important}
.wm{text-transform:none !important;letter-spacing:-.02em !important;font-size:17px !important;
  font-family:var(--sans) !important;font-weight:600 !important}
.wm span,.wm .sub{font-family:var(--sans) !important;letter-spacing:.18em !important;font-size:9px !important;
  color:var(--suave) !important;font-weight:400 !important}
.mano{font-family:var(--sans) !important;color:var(--suave) !important;font-style:italic}
.rot,.kick,.meta,.epi,.aside,.cat,.k,.z,.st,.ver,.eyebrow,.idx,.num,.cuenta,.count{
  text-transform:none !important;letter-spacing:0 !important;font-size:13px !important}
.eyebrow,.kick{color:var(--ladrillo) !important;font-weight:600 !important;font-size:13px !important}
.eyebrow i,.eyebrow span,.kicker span{display:none !important}
.marco > .num,.shead .idx{display:none !important}
.marco{grid-template-columns:1fr !important;gap:0 !important}
/* el punto verde antes de cada título */
h2::before,.titulo::before{content:"" !important;display:inline-block;width:8px;height:8px;
  border-radius:50%;background:var(--monte);margin-right:12px;vertical-align:middle;position:static}

/* ── botones y campos: pastillas ── */
.solid,.ghost,.sel,.pill,.send,.mail,.wsp,.ver,.btn,.chip,.mom,.cta{
  border-radius:var(--pill) !important;text-transform:none !important;letter-spacing:0 !important;
  font-size:14px !important;font-weight:500 !important}
.solid{background:var(--ladrillo) !important;border-color:var(--ladrillo) !important;color:#fff !important;
  padding:12px 22px !important}
.ghost,.sel,.pill{background:rgba(255,255,255,.62) !important;border:1px solid var(--linea) !important;
  color:var(--tinta) !important;padding:11px 18px !important;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sel.on,.pill.on{background:var(--monte) !important;border-color:var(--monte) !important;color:#EDF0E6 !important}
.send{background:var(--monte) !important;color:#EDF0E6 !important;border-radius:var(--pill) !important}
.field input,.field select,.field textarea,input,select,textarea{
  border-radius:var(--rs) !important;border:1px solid var(--linea) !important;
  background:rgba(251,247,232,.8) !important;font-family:var(--sans) !important}

/* ── superficies de vidrio ── */
.form,.calbox,.ficha,.plan,.day,.datos,.indice ol,.momentos,.mom,.carta,.panel,.amenbox,
.modalbox,.popbox,.reservar,.aviso,.nodisp,.horarios,.bloque{
  background:rgba(255,255,255,.72) !important;border:1px solid rgba(255,255,255,.6) !important;
  border-radius:var(--r) !important;box-shadow:var(--sombra) !important;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.carta{background:var(--monte) !important;border:0 !important;color:#DDE3D3 !important}
.carta h3{color:#EDF0E6 !important}
.carta .btn{background:var(--arena) !important;color:var(--monte) !important;border:0 !important}
.spread img,.par img,.tercias img,.galeria img,.videos iframe,.mapa,.tile,.mini .ph,
.apertura,.card figure,.unidad .ph{border-radius:var(--rm) !important;overflow:hidden}
.mapa{filter:grayscale(.25) sepia(.05) !important}

/* ── líneas: sólidas y finas ── */
.fill,.filas div,.comod div,.item,.stops li,.indice li,.horarios div,.epi,.price,.pie,
.shead,.sh,.head{border-style:solid !important;border-color:var(--linea) !important}
.shead,.marco .titulo{border-bottom:1px solid var(--linea) !important;padding-bottom:12px !important}

/* ═══════════ SÁBANA · OPCIÓN B ═══════════ */
.cards,.gA{display:grid !important;grid-template-columns:repeat(3,1fr) !important;gap:26px !important;
  padding:8px 0 10px !important;margin:0 !important;clip-path:none !important;box-shadow:none !important}
.card,.pA{background:transparent !important;border:0 !important;box-shadow:none !important;
  padding:0 0 44px 0 !important;position:relative !important;
  -webkit-backdrop-filter:none !important;backdrop-filter:none !important}
.card:hover,.pA:hover{transform:none !important;box-shadow:none !important;border-color:transparent !important}
.card .ph,.pA .ph,.card figure{aspect-ratio:4/5 !important;height:auto !important;
  border-radius:var(--r) !important;overflow:hidden;box-shadow:var(--sombra) !important;position:relative}
.card:hover .ph,.pA:hover .ph{box-shadow:var(--sombra2) !important}
.card .ph img,.pA .ph img{width:100% !important;height:100% !important;object-fit:cover !important}
/* la hojita de vidrio, montada y sobresaliendo */
.etiqueta,.card .body{
  position:absolute !important;left:16px !important;right:34px !important;bottom:0 !important;
  z-index:4;background:rgba(255,255,255,.74) !important;
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid rgba(255,255,255,.6) !important;border-radius:var(--rm) !important;
  padding:16px 18px !important;box-shadow:0 14px 34px rgba(35,38,26,.16) !important;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s}
.card:hover .body,.pA:hover .etiqueta{transform:translateY(-6px);background:rgba(255,255,255,.88) !important}
.etiqueta h3,.card .body h3{font-size:19px !important;margin:0 0 2px !important}
.etiqueta .z,.card .body .meta{font-size:12.5px !important;color:var(--suave) !important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etiqueta .pie,.card .price{margin-top:12px !important;padding-top:11px !important;
  border-top:1px solid var(--linea) !important;border-bottom:0 !important}
.card .price b,.etiqueta .pr{font-family:var(--sans) !important;font-weight:600 !important;
  font-size:18px !important;letter-spacing:-.02em !important}
.card .price em,.etiqueta .ver{color:var(--ladrillo) !important;font-weight:500 !important;font-size:13.5px !important}
/* las etiquetas blancas sobre la foto */
.chips{top:12px !important;left:12px !important;flex-direction:row !important;flex-wrap:wrap;gap:6px !important}
.chips .chip,.card .chips .chip{background:rgba(255,255,255,.8) !important;border-radius:var(--pill) !important;
  padding:6px 12px !important;font-size:11.5px !important;font-weight:500 !important;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:0 !important;margin:0 !important;
  text-transform:none !important;letter-spacing:0 !important}

/* ── filtros pegados ── */
.filters,.filtros{position:sticky !important;top:calc(var(--preH,40px) + 66px) !important;z-index:50 !important;
  background:rgba(251,247,232,.9) !important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:14px 0 12px !important;border-bottom:1px solid var(--linea) !important;
  border-top:0 !important;box-shadow:none !important;display:flex !important;gap:9px !important;
  overflow-x:auto;flex-wrap:nowrap !important;scrollbar-width:none}
.filters::-webkit-scrollbar,.filtros::-webkit-scrollbar{display:none}
.filters .sel,.filtros .sel{flex:0 0 auto !important}
.count,.cuenta{margin-left:auto !important;align-self:center;flex:0 0 auto}

/* ── portada ── */
.hero{border-radius:0 !important}
.hero .bg,.hero .bg img,.hero .bg video{border-radius:0 !important}
.hero .bg::after{background:linear-gradient(100deg,rgba(24,28,18,.40) 0%,rgba(24,28,18,.06) 55%,rgba(24,28,18,.32) 100%) !important}
.sheet{background:rgba(255,255,255,.68) !important;border:1px solid rgba(255,255,255,.55) !important;
  border-radius:var(--r) !important;-webkit-backdrop-filter:blur(22px) saturate(1.3);
  backdrop-filter:blur(22px) saturate(1.3);box-shadow:var(--sombra2) !important;
  padding:30px 32px 28px !important;max-width:480px !important}
.sheet h1{font-size:clamp(32px,4vw,46px) !important}
.sheet .lede{font-size:15.5px !important;color:var(--suave) !important}
.strip button{background:rgba(255,255,255,.7) !important;border:1px solid rgba(255,255,255,.6) !important;
  border-radius:var(--rm) !important;box-shadow:var(--sombra) !important;margin:0 !important}
.strip .in{gap:14px !important;padding-top:18px !important;padding-bottom:18px !important}
.strip{border-bottom:0 !important}

/* ── mosaico y carruseles ── */
.mosaic{gap:14px !important}
.mini{display:flex !important;gap:16px !important;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;padding-bottom:8px}
.mini::-webkit-scrollbar{display:none}
.mini > a{flex:0 0 250px;scroll-snap-align:start;background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.6);border-radius:var(--rm);padding:8px;box-shadow:var(--sombra)}
.mini > a:hover{transform:translateY(-3px);box-shadow:var(--sombra2)}
.mini h4{margin:11px 8px 0 !important;font-size:17px !important}
.mini p{margin:2px 8px 10px !important}

/* ── barra de abajo ── */
.appbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:85;
  background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  backdrop-filter:blur(20px) saturate(1.2);border:1px solid rgba(255,255,255,.7);
  border-radius:28px;box-shadow:0 14px 40px rgba(35,38,26,.18);
  display:grid;grid-template-columns:repeat(5,1fr);padding:10px 8px;
  width:calc(100% - 32px);max-width:520px}
.appbar a{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;
  font-size:11.5px;color:var(--suave);text-decoration:none;border-radius:16px}
.appbar a.on{color:var(--ladrillo);font-weight:600}
.appbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){ .appbar{display:none} }

/* ══════════ CELULAR ══════════ */
@media(max-width:900px){
  .nav{display:none !important}
  .burger{display:none !important}
  body{padding-bottom:100px}
  .acts .ghost{display:none !important}
}
@media(max-width:760px){
  .in{padding-left:20px !important;padding-right:20px !important}
  .pre{position:sticky !important}
  body{padding-top:0}
  header,header.vt{position:static !important;background:transparent !important;border-bottom:0 !important}
  .hbar{padding:14px 0 4px !important;justify-content:center}
  .acts{display:none !important}
  .pre .der,.pre .loc{display:none}
  .pre .in{justify-content:center}
  .hero{display:block !important;position:relative !important;min-height:0 !important}
  .hero .bg{position:absolute !important;inset:0 !important;height:100% !important}
  .hgrid{display:block !important;padding:64px 0 40px !important}
  .sheet{max-width:none !important;margin:0 !important;padding:24px 20px 22px !important}
  .sheet h1{font-size:31px !important}
  .heroctas{display:grid !important;grid-template-columns:1fr !important;gap:9px !important}
  .heroctas .solid,.heroctas .ghost{text-align:center;padding:14px !important}
  .strip .in{grid-template-columns:1fr !important;gap:10px !important}
  .cards,.gA{grid-template-columns:1fr !important;gap:22px !important}
  .card .ph,.pA .ph{aspect-ratio:4/3 !important}
  .etiqueta,.card .body{left:14px !important;right:22px !important}
  .card,.pA{padding-bottom:38px !important}
  .filters,.filtros{top:0 !important;padding-left:20px !important;padding-right:20px !important;
    margin-left:-20px !important;margin-right:-20px !important}
  .mosaic{grid-template-columns:1fr 1fr !important;grid-auto-rows:auto !important;padding:0 20px !important}
  .mosaic .tile{min-height:150px}
  .momentos,.plan,.reserva,.comod,.videos,.par,.tercias,.consulta,.f2,.fgrid{grid-template-columns:1fr !important}
  .apertura{margin:0 20px !important;height:44vh !important;min-height:250px !important}
  .mini > a{flex:0 0 74%}
  section{padding-top:40px !important;padding-bottom:40px !important}
}

/* la carta y el panel usan Tailwind: los traduzco */
[class*="rounded"]{border-radius:var(--rs) !important}
.rounded-full,[class*="rounded-full"]{border-radius:999px !important}
.bg-white,.bg-stone-50,.bg-stone-100{background:rgba(255,255,255,.74) !important;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.text-stone-400,.text-stone-500,.text-stone-600,.text-stone-700{color:var(--suave) !important}
[class*="border-black"],[class*="border-stone"]{border-color:var(--linea) !important}
h1,h2,h3,.ff-display{font-family:'DM Serif Display',Georgia,serif !important;font-weight:400 !important}
button,input,select,textarea{font-family:'DM Sans',system-ui,sans-serif}

/* ── Panel: no existe el pre-header verde, así que --preH nunca se define
      y quedan 40px de aire arriba. Lo anulo acá, al final de todo. ── */
body{padding-top:0 !important}
header,header.vt{position:sticky !important;top:0 !important;
  background:#F4EEDC !important;border-bottom:1px solid rgba(35,38,26,.06) !important;
  box-shadow:0 6px 20px rgba(35,38,26,.07) !important}
@media(max-width:760px){
  header,header.vt{position:sticky !important;top:0 !important;
    background:#F4EEDC !important;border-bottom:1px solid rgba(35,38,26,.06) !important}
}
</style>

const brillo = (hex) => { const h=String(hex).replace("#",""); const n=h.length===3?h.split("").map(x=>x+x).join(""):h;
  const r=parseInt(n.substr(0,2),16),g=parseInt(n.substr(2,2),16),b=parseInt(n.substr(4,2),16);
  if(isNaN(r)) return 1; return (0.299*r+0.587*g+0.114*b)/255; };

const compressToWebp = async (file, maxDim=1600, quality=0.82) => {
  try {
    if(!file || (file.type||"").slice(0,6)!=="image/") return file;
    let bmp=null, imgEl=null, iw=0, ih=0;
    try { bmp = await createImageBitmap(file, { imageOrientation:"from-image" }); iw=bmp.width; ih=bmp.height; }
    catch(_) {
      const url=URL.createObjectURL(file);
      imgEl = await new Promise((res)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=url; });
      URL.revokeObjectURL(url);
      if(!imgEl) return file; iw=imgEl.naturalWidth; ih=imgEl.naturalHeight;
    }
    if(!iw || !ih) return file;
    const scale=Math.min(1, maxDim/Math.max(iw,ih));
    const w=Math.round(iw*scale), h=Math.round(ih*scale);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(bmp||imgEl, 0, 0, w, h);
    if(bmp && bmp.close) bmp.close();
    const blob = await new Promise((res)=> cv.toBlob(res, "image/webp", quality));
    if(!blob || blob.size>=file.size) return file;
    return new File([blob], (file.name||"foto").replace(/\.[^.]+$/,"")+".webp", { type:"image/webp" });
  } catch(_) { return file; }
};
const delFromStorage = async (url) => { try { const m=String(url||"").match(/\/storage\/v1\/object\/public\/fotos\/(.+)$/); if(m) await db.storage.from("fotos").remove([decodeURIComponent(m[1])]); } catch(_){} };
async function up(file, prefix){ const f=await compressToWebp(file); const path=prefix+"-"+Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+f.name.replace(/[^a-zA-Z0-9.]/g,"_"); const { error }=await db.storage.from("fotos").upload(path,f); if(error) return null; return db.storage.from("fotos").getPublicUrl(path).data.publicUrl; }

/* ═══════════════════════════════════════════════════════════
   MENÚ · categorías ordenables, platos ordenables y carga masiva
   El menú sigue siendo un array plano en la columna JSONB `menu`.
   Invariante: el array queda AGRUPADO por categoría.
     · orden de las categorías = orden de los grupos
     · orden de los platos     = posición dentro del grupo
   menu.html y resto.html ya arman las categorías con
   [...new Set(c.menu.map(i=>i.category||"Menú"))], así que respetan
   este orden sin cambiarles una línea.
   ═══════════════════════════════════════════════════════════ */
const catKey = (it) => String((it && it.category) || "").trim();
const catLabel = (k) => k || "Menú";
const norm = (s) => String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();

function agrupar(menu){
  const orden = [], mapa = Object.create(null);
  (menu||[]).forEach(it=>{ const k = catKey(it); if(!mapa[k]){ mapa[k] = []; orden.push(k); } mapa[k].push(it); });
  return orden.map(k=>({ cat:k, items:mapa[k] }));
}
const aplanar = (gs) => gs.reduce((a,g)=>a.concat(g.items.map(it=>({ ...it, category:g.cat }))), []);
const PLATO_VACIO = { name:"", category:"", price:0, desc:"", photo:"", tags:[] };

/* ── CSV ─────────────────────────────────────────────────── */
const CSV_COLS = {
  category:["categoria","rubro","seccion","grupo"],
  name:["plato","nombre","producto","item"],
  desc:["descripcion","detalle","desc"],
  price:["precio","valor","importe","price"],
  tags:["etiquetas","etiqueta","tags"],
  photo:["foto","imagen","photo","foto (url)"]
};

const csvCelda = (v) => { const s = String(v==null?"":v); return /[";,\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };

function csvParse(texto){
  const cab = (texto.split(/\r?\n/)[0] || "");
  let sep = ";", mejor = -1;
  [";",",","\t"].forEach(s=>{ const n = cab.split(s).length; if(n > mejor){ mejor = n; sep = s; } });
  const filas = []; let fila = [], celda = "", entre = false;
  for(let i=0;i<texto.length;i++){
    const ch = texto[i];
    if(entre){
      if(ch === '"'){ if(texto[i+1] === '"'){ celda += '"'; i++; } else entre = false; }
      else celda += ch;
    } else if(ch === '"') entre = true;
    else if(ch === sep){ fila.push(celda); celda = ""; }
    else if(ch === "\n"){ fila.push(celda); filas.push(fila); fila = []; celda = ""; }
    else if(ch !== "\r") celda += ch;
  }
  if(celda.length || fila.length){ fila.push(celda); filas.push(fila); }
  return filas.filter(f=>f.some(x=>String(x).trim() !== ""));
}

/* "$15.000" → 15000 · "7,5" → 7.5 · "1.234.567" → 1234567 */
const parsePrecio = (v) => {
  if(typeof v === "number") return v;
  const s = String(v==null?"":v).replace(/[^\d.,-]/g,"").trim();
  if(!s) return 0;
  const ult = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
  if(ult < 0) return Number(s) || 0;
  const decimales = s.length - ult - 1;
  if(decimales === 3) return Number(s.replace(/[.,]/g,"")) || 0;   // separador de miles
  return Number(s.slice(0,ult).replace(/[.,]/g,"") + "." + s.slice(ult+1)) || 0;
};

function csvAFilas(texto){
  const filas = csvParse(String(texto||"").replace(/^\uFEFF/,""));
  if(!filas.length) return { filas:[], sinNombre:0 };
  const cab = filas[0].map(norm);
  const idx = {};
  Object.keys(CSV_COLS).forEach(k=>{ idx[k] = cab.findIndex(h => CSV_COLS[k].indexOf(h) >= 0); });
  const conCabecera = Object.keys(idx).some(k => idx[k] >= 0);
  const cuerpo = conCabecera ? filas.slice(1) : filas;
  if(!conCabecera){ idx.category=0; idx.name=1; idx.desc=2; idx.price=3; idx.tags=4; idx.photo=5; }
  const dato = (f,k) => (idx[k] >= 0 ? String(f[idx[k]] == null ? "" : f[idx[k]]).trim() : "");
  let sinNombre = 0;
  const out = [];
  cuerpo.forEach(f=>{
    const name = dato(f,"name");
    if(!name){ sinNombre++; return; }
    out.push({
      category: dato(f,"category"),
      name,
      desc: dato(f,"desc"),
      price: parsePrecio(dato(f,"price")),
      tags: dato(f,"tags").split(/[,|]/).map(x=>x.trim()).filter(Boolean).slice(0,3),
      photo: dato(f,"photo")
    });
  });
  return { filas:out, sinNombre };
}

function menuACsv(menu){
  const lin = [["Categoría","Plato","Descripción","Precio","Etiquetas","Foto (URL)"].join(";")];
  agrupar(menu).forEach(g=>{
    g.items.forEach(it=>{
      lin.push([catLabel(g.cat), it.name||"", it.desc||"", it.price||0, tagsDe(it).join(", "), it.photo||""].map(csvCelda).join(";"));
    });
  });
  return lin.join("\r\n");
}

function bajarCsv(nombre, texto){
  const blob = new Blob(["\uFEFF"+texto], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* Excel a veces guarda en Windows-1252 y las tildes se rompen: probamos los dos. */
async function leerTexto(file){
  const buf = await file.arrayBuffer();
  try { return new TextDecoder("utf-8", { fatal:true }).decode(buf); }
  catch(_) { return new TextDecoder("windows-1252").decode(buf); }
}

/* Agrega y actualiza: el CSV manda el orden, lo que no figura se conserva. */
function fusionar(actual, filas){
  const porCatNombre = Object.create(null), porNombre = Object.create(null);
  (actual||[]).forEach(it=>{
    const n = norm(it.name); if(!n) return;
    porCatNombre[norm(catKey(it))+"|"+n] = it;
    (porNombre[n] = porNombre[n] || []).push(it);
  });
  const usados = [], orden = [], grupos = Object.create(null);
  const meter = (cat, it) => { if(!grupos[cat]){ grupos[cat] = []; orden.push(cat); } grupos[cat].push(it); };
  let nuevos = 0, actualizados = 0, iguales = 0;

  filas.forEach(f=>{
    const n = norm(f.name), cat = f.category.trim();
    let prev = porCatNombre[norm(cat)+"|"+n];
    if(!prev){
      const cand = (porNombre[n] || []).filter(x => usados.indexOf(x) < 0);
      if(cand.length === 1) prev = cand[0];
    }
    if(prev && usados.indexOf(prev) >= 0) prev = null;
    if(prev){
      usados.push(prev);
      const foto = f.photo || prev.photo || "";
      const igual = String(prev.name||"") === f.name && catKey(prev) === cat
        && Number(prev.price||0) === Number(f.price||0) && String(prev.desc||"") === f.desc
        && tagsDe(prev).join("|") === f.tags.join("|") && String(prev.photo||"") === foto;
      igual ? iguales++ : actualizados++;
      meter(cat, { ...prev, name:f.name, category:cat, price:f.price, desc:f.desc, tags:f.tags, photo:foto });
    } else {
      nuevos++;
      meter(cat, { name:f.name, category:cat, price:f.price, desc:f.desc, photo:f.photo||"", tags:f.tags });
    }
  });

  let mantenidos = 0;
  (actual||[]).forEach(it=>{
    if(usados.indexOf(it) >= 0) return;
    if(norm(it.name)) mantenidos++;
    meter(catKey(it), it);
  });

  const menu = orden.reduce((a,k)=>a.concat(grupos[k].map(it=>({ ...it, category:k }))), []);
  return { menu, nuevos, actualizados, iguales, mantenidos };
}

/* ── Carga masiva ────────────────────────────────────────── */
function CargaMasiva({ c, aplicar }){
  const [abierto,setAbierto] = useState(false);
  const [prev,setPrev] = useState(null);
  const [error,setError] = useState("");

  const subir = async (e) => {
    const f = (e.target.files||[])[0]; e.target.value = "";
    if(!f) return;
    setError(""); setPrev(null);
    try {
      const { filas, sinNombre } = csvAFilas(await leerTexto(f));
      if(!filas.length){ setError("No encontramos platos en el archivo. Revisá que tenga una columna con el nombre del plato."); return; }
      setPrev({ ...fusionar(c.menu||[], filas), sinNombre, archivo:f.name, total:filas.length });
    } catch(err){ setError("No pudimos leer el archivo: "+err.message); }
  };

  const B = "rounded-xl px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600";
  return (
    <div className="rounded-xl border border-stone-200 p-3 mb-4">
      <div className="flex items-start justify-between gap-3">
        <div className="min-w-0">
          <div className="ff-body text-sm font-semibold" style={{color:C.ink}}>Carga masiva</div>
          <p className="ff-body text-xs text-stone-500">Bajá la carta como planilla, editala en Excel o Sheets y volvé a subirla.</p>
        </div>
        <button onClick={()=>setAbierto(v=>!v)} className="shrink-0 ff-body text-sm font-semibold" style={{color:C.clay}}>{abierto?"Ocultar":"Abrir"}</button>
      </div>

      {abierto && (
        <div className="mt-3">
          <div className="flex flex-wrap gap-2">
            <button onClick={()=>bajarCsv("carta-"+(c.slug||slugify(c.name)||"tandil")+".csv", menuACsv(c.menu||[]))}
              disabled={!(c.menu||[]).length} className={B+" disabled:opacity-40"}>⬇️ Bajar la carta</button>
            <button onClick={()=>bajarCsv("plantilla-carta.csv", CSV_PLANTILLA)} className={B}>📄 Bajar plantilla</button>
            <label className="cursor-pointer">
              <span className="inline-flex rounded-xl px-3 py-2 ff-body text-sm font-semibold text-white" style={{background:C.moss}}>⬆️ Subir planilla</span>
              <input type="file" accept=".csv,text/csv,text/plain" onChange={subir} className="hidden" />
            </label>
          </div>
          <p className="ff-body text-[11px] text-stone-400 mt-2">
            Columnas: categoría, plato, descripción, precio, etiquetas y foto. El orden de las filas es el orden de la carta.
            Si dejás la foto vacía en un plato que ya existe, se mantiene la que tenía.
          </p>

          {error && <p className="ff-body text-sm text-rose-600 mt-2">{error}</p>}

          {prev && (
            <div className="mt-3 rounded-xl border p-3" style={{borderColor:C.moss, background:"#F7F5EC"}}>
              <div className="ff-body text-sm" style={{color:C.ink}}>
                <b>{prev.archivo}</b> · {prev.total} fila{prev.total===1?"":"s"}
              </div>
              <div className="ff-body text-sm mt-1" style={{color:C.ink}}>
                {prev.nuevos} nuevo{prev.nuevos===1?"":"s"} · {prev.actualizados} actualizado{prev.actualizados===1?"":"s"} · {prev.iguales} sin cambios
                {prev.mantenidos > 0 && <> · {prev.mantenidos} de la carta no figuran en la planilla y se mantienen</>}
              </div>
              {prev.sinNombre > 0 && <p className="ff-body text-xs text-amber-700 mt-1">{prev.sinNombre} fila{prev.sinNombre===1?"":"s"} sin nombre de plato: se ignoran.</p>}
              <div className="mt-2 max-h-44 overflow-auto rounded-lg bg-white border border-black/5">
                {agrupar(prev.menu).map((g,gi)=>(
                  <div key={gi} className="px-2.5 py-1.5 border-b border-black/5 last:border-0">
                    <div className="ff-body text-[11px] font-semibold text-stone-500">{catLabel(g.cat)}</div>
                    {g.items.map((it,ii)=>(
                      <div key={ii} className="ff-body text-xs flex justify-between gap-3" style={{color:C.ink}}>
                        <span className="truncate">{it.name || <em className="text-stone-400">sin nombre</em>}</span>
                        <span className="text-stone-500 shrink-0">{money(it.price)}</span>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
              <div className="flex gap-2 mt-3">
                <button onClick={()=>{ aplicar(prev.menu); setPrev(null); }}
                  className="rounded-xl px-4 py-2 ff-body text-sm font-semibold text-white" style={{background:C.clay}}>Aplicar cambios</button>
                <button onClick={()=>setPrev(null)} className={B}>Cancelar</button>
              </div>
              <p className="ff-body text-[11px] text-stone-500 mt-2">Todavía no se guardó: revisá la carta y tocá <b>Guardar</b> arriba.</p>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ── Editor del menú ─────────────────────────────────────── */
function MenuEditor({ c, set }){
  const [uploading,setUploading] = useState(false);
  const [cerrado,setCerrado] = useState({});
  const [nuevaCat,setNuevaCat] = useState("");
  const [renombrando,setRenombrando] = useState(null);
  const [drag,setDrag] = useState(null);      // {tipo:"cat"|"plato", gi, ii}
  const [linea,setLinea] = useState(null);    // guía de dónde va a caer
  const cont = useRef(null);
  const d = useRef({});

  const grupos = agrupar(c.menu||[]);
  const setGrupos = (gs) => set({ ...c, menu:aplanar(gs) });
  const clonar = () => grupos.map(g=>({ cat:g.cat, items:g.items.slice() }));
  const setItem = (gi,ii,patch) => { const gs = clonar(); gs[gi].items[ii] = { ...gs[gi].items[ii], ...patch }; setGrupos(gs); };

  const subirFoto = async (e,gi,ii) => {
    const f = (e.target.files||[])[0]; e.target.value = "";
    if(!f) return;
    setUploading(true);
    const vieja = ((grupos[gi]||{items:[]}).items[ii]||{}).photo;
    const u = await up(f,"plato");
    if(u){ if(vieja) delFromStorage(vieja); setItem(gi,ii,{ photo:u }); }
    setUploading(false);
  };

  const agregarPlato = (gi) => { const gs = clonar(); gs[gi].items.push({ ...PLATO_VACIO, category:gs[gi].cat }); setGrupos(gs); };
  const borrarPlato = (gi,ii) => {
    const it = grupos[gi].items[ii];
    if(it && it.photo) delFromStorage(it.photo);
    const gs = clonar(); gs[gi].items.splice(ii,1); setGrupos(gs);
  };
  const agregarCat = () => {
    const nombre = nuevaCat.trim(); if(!nombre) return;
    const gs = clonar();
    const ya = gs.findIndex(g => norm(g.cat) === norm(nombre));
    if(ya >= 0){ gs[ya].items.push({ ...PLATO_VACIO, category:gs[ya].cat }); }
    else gs.push({ cat:nombre, items:[{ ...PLATO_VACIO, category:nombre }] });
    setGrupos(gs); setNuevaCat("");
  };
  const borrarCat = (gi) => {
    const g = grupos[gi];
    if(!confirm("¿Borrar la categoría «"+catLabel(g.cat)+"» y sus "+g.items.length+" plato(s)?")) return;
    g.items.forEach(it=>{ if(it.photo) delFromStorage(it.photo); });
    const gs = clonar(); gs.splice(gi,1); setGrupos(gs);
  };
  /* El nombre se edita en un borrador y se confirma al salir del campo:
     si se escribiera letra por letra sobre c.menu, un nombre intermedio igual
     al de otra categoría fusionaría los dos grupos sin aviso. */
  const commitCat = () => {
    const r = renombrando; if(!r) return;
    setRenombrando(null);
    const gs = clonar(); const valor = r.valor.trim();
    if(!gs[r.gi] || gs[r.gi].cat === valor) return;
    const otro = gs.findIndex((o,j)=> j !== r.gi && norm(o.cat) === norm(valor));
    if(otro >= 0 && !confirm("Ya existe la categoría «"+catLabel(gs[otro].cat)+"». ¿Unir las dos?")) return;
    gs[r.gi].cat = valor; setGrupos(gs);
  };

  /* Mover con el teclado: misma acción que arrastrar, para quien no puede. */
  const moverCat = (gi,paso) => {
    const j = gi + paso; if(j < 0 || j >= grupos.length) return;
    const gs = clonar(); const [g] = gs.splice(gi,1); gs.splice(j,0,g); setGrupos(gs);
  };
  const moverPlato = (gi,ii,paso) => {
    const gs = clonar(), g = gs[gi], j = ii + paso;
    if(j < 0){ if(gi === 0) return; const [it] = g.items.splice(ii,1); gs[gi-1].items.push({ ...it, category:gs[gi-1].cat }); }
    else if(j >= g.items.length){ if(gi === gs.length-1) return; const [it] = g.items.splice(ii,1); gs[gi+1].items.unshift({ ...it, category:gs[gi+1].cat }); }
    else { const [it] = g.items.splice(ii,1); g.items.splice(j,0,it); }
    setGrupos(gs);
  };

  /* ── arrastrar (mouse y touch, sin librerías) ── */
  const medirSlots = (tipo) => {
    const root = cont.current; if(!root) return [];
    const sy = window.scrollY, slots = [];
    if(tipo === "cat"){
      const els = Array.from(root.querySelectorAll("[data-grupo]"));
      els.forEach((el,i)=>{ const r = el.getBoundingClientRect(); slots.push({ y:r.top+sy-6, left:r.left, w:r.width, pos:i }); });
      if(els.length){ const r = els[els.length-1].getBoundingClientRect(); slots.push({ y:r.bottom+sy+6, left:r.left, w:r.width, pos:els.length }); }
    } else {
      Array.from(root.querySelectorAll("[data-lista]")).forEach(lista=>{
        const gi = +lista.getAttribute("data-lista");
        const hijos = Array.from(lista.querySelectorAll("[data-plato]"));
        const rl = lista.getBoundingClientRect();
        if(!hijos.length){ slots.push({ y:rl.top+sy+8, left:rl.left, w:rl.width||160, gi, pos:0 }); return; }
        hijos.forEach((el,i)=>{ const r = el.getBoundingClientRect(); slots.push({ y:r.top+sy-5, left:r.left, w:r.width, gi, pos:i }); });
        const r = hijos[hijos.length-1].getBoundingClientRect();
        slots.push({ y:r.bottom+sy+5, left:r.left, w:r.width, gi, pos:hijos.length });
      });
    }
    return slots;
  };

  const guia = () => {
    const s = d.current;
    if(!s.slots || !s.slots.length) return;
    const py = s.y + window.scrollY;
    let mejor = s.slots[0], dist = Infinity;
    s.slots.forEach(x=>{ const q = Math.abs(x.y - py); if(q < dist){ dist = q; mejor = x; } });
    s.destino = mejor;
    setLinea({ y:mejor.y - window.scrollY, left:mejor.left, w:mejor.w });
  };

  const tick = () => {
    const s = d.current; if(!s.tipo) return;
    const alto = window.innerHeight, borde = 90;
    let v = 0;
    if(s.y < borde) v = -Math.min(20, (borde - s.y)/3);
    else if(s.y > alto - borde) v = Math.min(20, (s.y - (alto - borde))/3);
    if(v){ window.scrollBy(0, v); guia(); }
    s.raf = requestAnimationFrame(tick);
  };

  const onDown = (tipo,gi,ii) => (e) => {
    if(e.button != null && e.button !== 0) return;
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_){}
    if(tipo === "plato") setCerrado({});          // para poder soltar en cualquier categoría
    d.current = { tipo, gi, ii, y:e.clientY, slots:medirSlots(tipo) };
    requestAnimationFrame(()=>{ if(!d.current.tipo) return; d.current.slots = medirSlots(tipo); guia(); });
    d.current.raf = requestAnimationFrame(tick);
    setDrag({ tipo, gi, ii });
  };

  const onMove = (e) => { if(!d.current.tipo) return; d.current.y = e.clientY; guia(); };

  const onUp = () => {
    const s = d.current;
    if(s.raf) cancelAnimationFrame(s.raf);
    if(s.tipo && s.destino){
      const gs = clonar();
      if(s.tipo === "cat"){
        const [g] = gs.splice(s.gi,1);
        gs.splice(s.destino.pos > s.gi ? s.destino.pos-1 : s.destino.pos, 0, g);
      } else {
        const [it] = gs[s.gi].items.splice(s.ii,1);
        const destino = gs[s.destino.gi];
        let pos = s.destino.pos;
        if(s.destino.gi === s.gi && pos > s.ii) pos--;
        destino.items.splice(pos, 0, { ...it, category:destino.cat });
      }
      setGrupos(gs);
    }
    d.current = {}; setDrag(null); setLinea(null);
  };

  const asaProps = (tipo,gi,ii) => ({
    onPointerDown:onDown(tipo,gi,ii), onPointerMove:onMove, onPointerUp:onUp, onPointerCancel:onUp,
    onKeyDown:(e)=>{
      if(e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      e.preventDefault(); const paso = e.key === "ArrowUp" ? -1 : 1;
      tipo === "cat" ? moverCat(gi,paso) : moverPlato(gi,ii,paso);
    },
    tabIndex:0, role:"button",
    "aria-label": tipo === "cat" ? "Mover la categoría" : "Mover el plato",
    style:{ touchAction:"none", cursor:drag?"grabbing":"grab", color:"#a8a29e" },
    title:"Arrastrá para mover, o usá las flechas ↑ ↓"
  });

  const platos = (c.menu||[]).length;
  const sinNombre = (c.menu||[]).filter(x=>!String(x.name||"").trim()).length;

  return (
    <div className="bg-white rounded-2xl border border-black/5 p-5 h-fit" ref={cont} style={{ userSelect:drag?"none":"auto" }}>
      <h3 className="ff-display text-lg mb-1" style={{color:C.ink}}>🍽️ Menú</h3>
      <p className="ff-body text-sm text-stone-500 mb-1">Cargá tus platos con foto, precio, categoría y etiquetas.</p>
      <p className="ff-body text-xs text-stone-400 mb-4">
        {platos} plato{platos===1?"":"s"} en {grupos.length} categoría{grupos.length===1?"":"s"} · así se ordenan en la carta.
        {sinNombre > 0 && <span className="text-amber-700"> · {sinNombre} sin nombre: no se ven en la carta.</span>}
      </p>

      <CargaMasiva c={c} aplicar={(m)=>set({ ...c, menu:m })} />

      <div className="space-y-3">
        {grupos.map((g,gi)=>{
          const abierta = !cerrado[g.cat];
          const arrastrada = drag && drag.tipo === "cat" && drag.gi === gi;
          const choca = grupos.some((o,j)=> j !== gi && norm(o.cat) === norm(g.cat) && g.cat.trim());
          return (
            <div key={gi} data-grupo={gi} className="rounded-xl border border-stone-200"
              style={arrastrada ? { opacity:.4 } : {}}>
              <div className="flex items-center gap-1.5 px-2.5 py-2 border-b border-stone-100">
                <span {...asaProps("cat",gi)} className="px-1 text-lg leading-none select-none">⠿</span>
                <button onClick={()=>setCerrado({ ...cerrado, [g.cat]:abierta })} className="ff-body text-xs text-stone-400 w-4 shrink-0">{abierta?"▾":"▸"}</button>
                <input value={renombrando && renombrando.gi === gi ? renombrando.valor : g.cat} placeholder="Menú"
                  onChange={e=>setRenombrando({ gi, valor:e.target.value })}
                  onBlur={commitCat}
                  onKeyDown={e=>{ if(e.key === "Enter"){ e.preventDefault(); e.target.blur(); } if(e.key === "Escape") setRenombrando(null); }}
                  className="flex-1 min-w-0 ff-body text-sm font-semibold bg-transparent outline-none border-b border-transparent focus:border-stone-300 py-0.5"
                  style={{color:C.ink}} />
                <span className="ff-body text-xs text-stone-400 shrink-0">{g.items.length}</span>
                <button onClick={()=>borrarCat(gi)} className="text-rose-400 px-1 shrink-0" title="Borrar categoría">🗑️</button>
              </div>
              {choca && <p className="ff-body text-[11px] text-amber-700 px-3 pt-1.5">Hay otra categoría con este nombre: se van a unir.</p>}

              <div data-lista={gi} className={"px-2.5 "+(abierta ? "py-2.5 space-y-2.5" : "py-1")}>
                {!abierta
                  ? <p className="ff-body text-xs text-stone-400 px-1">{g.items.length} plato{g.items.length===1?"":"s"} · tocá ▸ para abrir</p>
                  : g.items.map((it,ii)=>{
                      const dim = drag && drag.tipo === "plato" && drag.gi === gi && drag.ii === ii;
                      return (
                        <div key={ii} data-plato={ii} className="border border-stone-200 rounded-xl p-2.5" style={dim ? { opacity:.4 } : {}}>
                          <div className="flex gap-2.5">
                            <div className="flex flex-col items-center gap-1 shrink-0">
                              <span {...asaProps("plato",gi,ii)} className="text-lg leading-none select-none">⠿</span>
                              <label className="cursor-pointer">
                                {it.photo ? <img src={IMG(it.photo)} className="w-16 h-16 rounded-lg object-cover bg-stone-200" />
                                          : <span className="w-16 h-16 rounded-lg bg-stone-100 grid place-items-center text-xl">📷</span>}
                                <input type="file" accept="image/*" onChange={e=>subirFoto(e,gi,ii)} disabled={uploading} className="hidden" />
                              </label>
                            </div>
                            <div className="flex-1 min-w-0 space-y-2">
                              <input value={it.name||""} onChange={e=>setItem(gi,ii,{ name:e.target.value })} placeholder="Nombre del plato" className="w-full border border-stone-300 rounded-lg px-2 py-1.5 ff-body text-sm" />
                              <div className="flex items-center border border-stone-300 rounded-lg px-2 w-32"><span className="ff-body text-sm shrink-0" style={{color:"#8a836f",letterSpacing:".02em"}}>ARS$</span><input type="number" value={it.price||""} onChange={e=>setItem(gi,ii,{ price:+e.target.value })} className="w-full py-1.5 ff-body text-sm outline-none" /></div>
                              <input value={it.desc||""} onChange={e=>setItem(gi,ii,{ desc:e.target.value })} placeholder="Descripción corta" className="w-full border border-stone-300 rounded-lg px-2 py-1.5 ff-body text-sm" />
                              <Etiquetas it={it} onChange={(t)=>setItem(gi,ii,{ tags:t })} />
                            </div>
                            <button onClick={()=>borrarPlato(gi,ii)} className="text-rose-500 self-start shrink-0">🗑️</button>
                          </div>
                        </div>
                      );
                    })}
                {abierta && <button onClick={()=>agregarPlato(gi)} className="ff-body text-sm font-semibold" style={{color:C.clay}}>+ Agregar plato</button>}
              </div>
            </div>
          );
        })}
      </div>

      {!grupos.length && (
        <div className="py-6 text-center">
          <p className="ff-body text-sm text-stone-400">Todavía no cargaste ningún plato.</p>
          <button onClick={()=>setGrupos([{ cat:"", items:[{ ...PLATO_VACIO }] }])} className="mt-2 ff-body text-sm font-semibold" style={{color:C.clay}}>+ Agregar el primer plato</button>
          <p className="ff-body text-xs text-stone-400 mt-1">o creá una categoría, o subí una planilla</p>
        </div>
      )}

      <div className="flex gap-2 mt-4">
        <input value={nuevaCat} onChange={e=>setNuevaCat(e.target.value)}
          onKeyDown={e=>{ if(e.key === "Enter"){ e.preventDefault(); agregarCat(); } }}
          placeholder="Nueva categoría (Entradas, Postres…)"
          className="flex-1 min-w-0 border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm" />
        <button onClick={agregarCat} className="rounded-xl px-3 py-2 ff-body text-sm font-semibold text-white shrink-0" style={{ background:C.moss, opacity:nuevaCat.trim()?1:.4 }}>Agregar</button>
      </div>

      {linea && <div style={{ position:"fixed", left:linea.left, width:linea.w, top:linea.y-1.5, height:3, background:C.moss, borderRadius:2, zIndex:60, pointerEvents:"none" }} />}
      {uploading && <p className="ff-body text-xs text-stone-500 mt-2">Subiendo foto…</p>}
    </div>
  );
}

function Editor({ c, set }) {
  const [uploading,setUploading]=useState(false);
  const uploadBanner = async (e)=>{ const f=(e.target.files||[])[0]; if(!f)return; setUploading(true); const old=c.banner; const u=await up(f,"resto-banner"); if(u){ if(old) delFromStorage(old); set({...c,banner:u}); } setUploading(false); e.target.value=""; };
  const uploadGallery = async (e)=>{ const fs=Array.from(e.target.files||[]); if(!fs.length)return; const MAXP=15; const room=MAXP-(c.photos||[]).length; if(room<=0){ alert("Llegaste al máximo de "+MAXP+" fotos. Borrá alguna para subir otra."); e.target.value=""; return; } if(fs.length>room) alert("Solo se agregan "+room+" foto(s): el máximo es "+MAXP+"."); const toUp=fs.slice(0,room); setUploading(true); const urls=[]; for(const f of toUp){ const u=await up(f,"resto"); if(u) urls.push(u);} set({...c,photos:[...c.photos,...urls]}); setUploading(false); e.target.value=""; };

          <div className="grid grid-cols-2 gap-3">
            <Field label="WhatsApp"><input value={c.whatsapp} onChange={e=>set({...c,whatsapp:e.target.value})} placeholder="54920..." className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm" /></Field>
          <div className="rounded-xl border border-stone-200 p-3 mt-3">

              </span>
            </label>
          </div>
            <Field label="Teléfono"><input value={c.phone} onChange={e=>set({...c,phone:e.target.value})} className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm" /></Field>
          </div>
          <Field label="Descripción"><textarea value={c.blurb} onChange={e=>set({...c,blurb:e.target.value})} rows={2} className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm resize-none" /></Field>

const SUGERIDAS = ["Lo más pedido","Recomendado","Vegetariano","Vegano","Sin TACC","Picante","Para compartir","Novedad"];
const tagsDe = (it) => Array.isArray(it.tags) ? it.tags : String(it.tags||"").split(",").map(x=>x.trim()).filter(Boolean);

function Etiquetas({ it, onChange }){
  const [libre,setLibre] = useState("");
  const tags = tagsDe(it);
  const MAX = 3;
  const lleno = tags.length >= MAX;
  const tiene = (t) => tags.some(x=>x.toLowerCase()===t.toLowerCase());
  const toggle = (t) => {
    if(tiene(t)) onChange(tags.filter(x=>x.toLowerCase()!==t.toLowerCase()));
    else if(!lleno) onChange(tags.concat([t]));
  };
  const agregar = () => { const t=libre.trim(); if(!t||lleno||tiene(t)) { setLibre(""); return; } onChange(tags.concat([t])); setLibre(""); };
  const propias = tags.filter(t=>!SUGERIDAS.some(s=>s.toLowerCase()===t.toLowerCase()));
  return (
    <div className="pt-1">
      <div className="flex flex-wrap gap-1.5">
        {SUGERIDAS.map(t=>{ const on=tiene(t); return (
          <button key={t} type="button" onClick={()=>toggle(t)}
            className={"rounded-full px-2.5 py-1 ff-body text-xs border "+(on?"text-white":"text-stone-500")}
            style={on ? {background:C.moss,borderColor:C.moss}
                      : {borderColor:"#d6d3d1",opacity:lleno?0.35:1,cursor:lleno?"not-allowed":"pointer"}}>{t}</button>
        ); })}
        {propias.map(t=>(
          <button key={t} type="button" onClick={()=>toggle(t)} title="Quitar"
            className="rounded-full px-2.5 py-1 ff-body text-xs text-white" style={{background:C.clay}}>{t} ✕</button>
        ))}
      </div>
      <div className="flex gap-2 mt-1.5 items-center">
        <input value={libre} onChange={e=>setLibre(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); agregar(); } }}
          placeholder="Otra etiqueta (ej: 400 g)" maxLength={18}
          className="flex-1 border border-stone-300 rounded-lg px-2 py-1.5 ff-body text-xs" />
        <button type="button" onClick={agregar} className="ff-body text-xs font-semibold px-1"
          style={{color:C.clay,opacity:lleno?0.35:1}}>Agregar</button>
      </div>
      <p className="ff-body text-[11px] text-stone-400 mt-1">
        {tags.length}/{MAX} etiquetas · en la carta se ven las dos primeras sobre la foto del plato
      </p>
    </div>
  );
}

function printQR(c){
  if(!c.slug){ alert("Primero guardá el restaurante para generar el QR."); return; }
  const url = new URL("menu.html?slug="+c.slug, location.href).href;
  const qr = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=12&data="+encodeURIComponent(url);
  const w = window.open("", "_blank");
  if(!w){ alert("Permití las ventanas emergentes para imprimir el QR."); return; }
  w.document.write("<!doctype html><html><head><meta charset='utf-8'><title>QR - "+c.name+"</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;600&display=swap');body{font-family:'DM Sans',system-ui,sans-serif;text-align:center;color:#23261A;padding:48px 24px;margin:0}h1{font-family:'DM Serif Display',Georgia,serif;font-size:30px;margin:0 0 6px}p{color:#6b6b60;margin:4px 0}img{width:340px;height:340px;margin:22px auto;display:block}.u{font-size:12px;color:#aaa;word-break:break-all}button{font-family:inherit;font-weight:600;font-size:15px;color:#fff;background:#2E3521;border:none;border-radius:12px;padding:12px 22px;margin-top:16px;cursor:pointer}@media print{button{display:none}}</style></head><body><h1>"+c.name+"</h1><p>Escaneá para ver nuestra carta &#127860;</p><img src='"+qr+"' alt='QR'/><p class='u'>"+url+"</p><button onclick='window.print()'>Imprimir</button></body></html>");
  w.document.close();
}

function ProfileBar({ profile }) {
  const [logo, setLogo] = useState("");
  const [upLogo, setUpLogo] = useState(false);
  if(!profile) return null;
  const shown = logo || profile.logo || "";
  const onLogo = async (e) => {
    const f0=(e.target.files||[])[0]; if(!f0) return; setUpLogo(true);
    const f=await compressToWebp(f0, 512, 0.85);
    const path="logo-"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9.]/g,"_");
    const { error } = await db.storage.from("fotos").upload(path, f);
    if(!error){ const { data } = db.storage.from("fotos").getPublicUrl(path); const url=data.publicUrl; const oldL=logo||profile.logo; if(profile._id) await db.from("profiles").update({logo:url}).eq("id", profile._id); if(oldL) delFromStorage(oldL); setLogo(url); } else { alert("No se pudo subir el logo."); }
    setUpLogo(false); e.target.value="";
  };
  const RUBRO = { hospedaje:"Hospedaje", gastronomia:"Gastronomía", actividad:"Actividad", admin:"Admin" }[profile.role] || profile.role || "";
  const fmt = (s) => s ? s.split("-").reverse().join("/") : "—";
  let st = { label:"Pago sin registrar", bg:"#ececec", fg:"#777" };
  if(profile.next_due){ const t=new Date(); t.setHours(0,0,0,0); const d=new Date(profile.next_due+"T00:00:00"); const days=Math.round((d-t)/86400000);
    st = days<0 ? {label:"Pago vencido", bg:"#fde8e8", fg:"#b23b3b"} : days<=7 ? {label:"Vence en "+days+" días", bg:"#fdf0d8", fg:"#9a6b1e"} : {label:"Al día", bg:"#e7efe3", fg:C.moss}; }
  const initial = (profile.operator||profile._email||"?").trim().charAt(0).toUpperCase();
  const lim = profile.max_listings;
  return (
    <div className="bg-white rounded-2xl border border-black/5 p-4 mb-5 flex flex-wrap items-center gap-4">
      <label className="relative shrink-0 cursor-pointer" title="Subir / cambiar logo">
        <div className="w-12 h-12 rounded-full grid place-items-center text-white ff-display text-lg overflow-hidden" style={{background:C.moss}}>{shown ? <img src={shown} className="w-full h-full object-cover" /> : initial}</div>
        <span className="absolute -bottom-1 -right-1 w-5 h-5 rounded-full grid place-items-center text-[10px] text-white border-2 border-white" style={{background:C.clay}}>{upLogo?"…":"✎"}</span>
        <input type="file" accept="image/*" onChange={onLogo} disabled={upLogo} className="hidden" />
      </label>
      <div className="min-w-0">
        <div className="ff-display text-lg leading-tight" style={{color:C.ink}}>{profile.operator||"Tu cuenta"}</div>
        <div className="ff-body text-xs text-stone-500">{profile._email} · {RUBRO} · {lim!=null?(lim+" publicación"+(lim===1?"":"es")):"sin tope"}</div>
      </div>
      <div className="sm:ml-auto flex items-center gap-4 flex-wrap">
        <div><div className="ff-body text-[11px] text-stone-500">Último pago</div><div className="ff-body text-sm" style={{color:C.ink}}>{fmt(profile.last_paid)}</div></div>
        <div><div className="ff-body text-[11px] text-stone-500">Próximo pago</div><div className="ff-body text-sm" style={{color:C.ink}}>{fmt(profile.next_due)}</div></div>
        <span className="ff-body text-xs rounded-full px-2.5 py-1" style={{background:st.bg,color:st.fg}}>{st.label}</span>
      </div>
    </div>
  );
}

/* ═══ Videos tutoriales ═══
   Se cargan desde admin.html (tabla `tutoriales` en Supabase).
   Si no hay ninguno para este rubro, el botón directamente no se dibuja:
   un botón que abre una lista vacía es peor que no tener botón. */
const ytIdDe = (url) => { const m = String(url||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/); return m ? m[1] : null; };
const ytMiniatura = (url) => { const id = ytIdDe(url); return id ? "https://img.youtube.com/vi/"+id+"/mqdefault.jpg" : null; };

function Tutoriales({ rubro }){
  const [videos,setVideos] = useState([]);
  const [abierto,setAbierto] = useState(false);
  const [activo,setActivo] = useState(null);

  useEffect(()=>{ (async()=>{
    try{
      const { data } = await db.from("tutoriales").select("*")
        .eq("visible", true).in("rubro", [rubro, "todos"])
        .order("orden", { ascending:true });
      setVideos((data||[]).filter(v=>ytIdDe(v.url)));
    }catch(_){}
  })(); },[]);

  useEffect(()=>{
    if(!abierto) return;
    const esc = (e)=>{ if(e.key==="Escape") setAbierto(false); };
    window.addEventListener("keydown", esc);
    return ()=>window.removeEventListener("keydown", esc);
  },[abierto]);

  if(!videos.length) return null;

  return (
    <>
      <button onClick={()=>{ setAbierto(true); setActivo(null); }} title="Videos tutoriales"
        className="rounded-full px-3 py-2 ff-body text-sm font-semibold text-white shrink-0" style={{background:C.moss}}>
        🎬<span className="hidden sm:inline"> Videos</span>
      </button>

      {abierto && ReactDOM.createPortal(
        <div onClick={()=>setAbierto(false)} role="dialog" aria-modal="true" aria-label="Videos tutoriales"
          className="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto" style={{background:"rgba(28,32,20,.55)"}}>
          <div onClick={e=>e.stopPropagation()} className="w-full max-w-lg rounded-2xl overflow-hidden flex flex-col my-auto"
            style={{background:C.cream, maxHeight:"88vh"}}>

            <div className="flex items-center justify-between px-4 py-3 border-b border-black/10 shrink-0">
              <h3 className="ff-display text-lg" style={{color:C.ink}}>Videos tutoriales</h3>
              <button onClick={()=>setAbierto(false)} aria-label="Cerrar" className="text-2xl leading-none px-1" style={{color:C.sage}}>×</button>
            </div>

            <div className="overflow-auto p-3">
              {activo && (
                <div className="mb-3">
                  <div style={{position:"relative",width:"100%",paddingTop:"56.25%",borderRadius:"12px",overflow:"hidden",background:"#000"}}>
                    <iframe src={"https://www.youtube.com/embed/"+ytIdDe(activo.url)+"?rel=0&autoplay=1"}
                      title={activo.titulo||"Video"} allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen"
                      allowFullScreen frameBorder="0"
                      style={{position:"absolute",inset:0,width:"100%",height:"100%",border:0}} />
                  </div>
                  <p className="ff-body text-sm font-semibold mt-2" style={{color:C.ink}}>{activo.titulo}</p>
                  {activo.descripcion && <p className="ff-body text-xs text-stone-500">{activo.descripcion}</p>}
                </div>
              )}

              <div className="space-y-2">
                {videos.map(v=>{
                  const esActivo = activo && activo.id===v.id;
                  const mini = ytMiniatura(v.url);
                  return (
                    <button key={v.id} onClick={()=>setActivo(v)}
                      className="w-full flex items-center gap-3 p-2 rounded-xl border text-left"
                      style={{background:"#fff", borderColor: esActivo ? C.moss : "rgba(46,53,33,.14)"}}>
                      <span className="shrink-0 rounded-lg overflow-hidden grid place-items-center"
                        style={{width:"72px",height:"46px",background:C.moss}}>
                        {mini
                          ? <img src={mini} alt="" className="w-full h-full object-cover" onError={e=>e.target.remove()} />
                          : <span style={{color:C.cream}}>▶</span>}
                      </span>
                      <span className="min-w-0">
                        <span className="block ff-body text-sm font-semibold truncate" style={{color:C.ink}}>{v.titulo}</span>
                        <span className="block ff-body text-xs text-stone-500 truncate">
                          {[v.duracion, v.rubro==="todos" ? "Para todos" : null].filter(Boolean).join(" · ")}
                        </span>
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="px-4 py-3 border-t border-black/10 shrink-0">
              <a href={"ayuda.html?rubro="+rubro} target="_blank" rel="noreferrer" className="ff-body text-sm" style={{color:C.sage}}>
                ¿Necesitás más? Mirá la guía escrita →
              </a>
            </div>

          </div>
        </div>,
        document.body
      )}
    </>
  );
}

            {(editing||soloEditor) ? (<>
              {verSitio && <a href={verSitio} target="_blank" rel="noreferrer" className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">👁️ Ver sitio</a>}
              {!soloEditor && <button onClick={()=>setEditing(null)} className="rounded-full px-4 py-2 ff-body text-sm border border-stone-300 text-stone-600">Cancelar</button>}
              <button onClick={save} disabled={saving} className="rounded-full px-4 py-2 ff-body text-sm font-semibold text-white disabled:opacity-50" style={{background:C.clay}}>{saving?"Guardando…":"Guardar"}</button>
              {soloEditor && <button onClick={()=>db.auth.signOut()} className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">Salir</button>}
            </>) : (<>
              {!atLimit && <button onClick={()=>setEditing({...EMPTY, operator:(profile&&profile.operator)||""})} className="rounded-full px-4 py-2 ff-body text-sm font-semibold text-white" style={{background:C.clay}}>+ Nuevo</button>}
              <button onClick={()=>db.auth.signOut()} className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">Salir</button>
            </>)}
          </div>
        </div>
        {toast && <div className="text-center ff-body text-xs py-1" style={{background:"#e7efe3",color:C.moss}}>{toast}</div>}
      </header>
      <div className="max-w-5xl mx-auto px-5 py-6">
        <ProfileBar profile={profile} />
        {(editing||soloEditor) ? (editing ? <Editor c={editing} set={setEditing} /> : <p className="ff-body text-stone-500 text-center py-16">Cargando…</p>)
        : list.length===0 ? <div className="text-center py-16"><p className="ff-display text-xl mb-1" style={{color:C.ink}}>Sin lugares todavía</p><p className="ff-body text-stone-500">Cargá el primero con “+ Nuevo”.</p></div>
        : <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">{list.map(c=>(
            <div key={c.id} className="bg-white rounded-2xl border border-black/5 overflow-hidden">
              <div className="aspect-[16/10] bg-stone-200">{(c.banner||c.photos[0]) && <img src={IMG(c.banner||c.photos[0])} className="w-full h-full object-cover" />}</div>
              <div className="p-4"><h3 className="ff-display text-lg" style={{color:C.ink}}>{c.name}</h3><p className="ff-body text-sm text-stone-500">{c.zone}</p><p className="ff-body text-xs text-stone-400 mt-1">👁 {views[c.slug]||0} visitas</p>
                <div className="flex gap-2 mt-3"><button onClick={()=>setEditing(c)} className="flex-1 rounded-lg py-2 ff-body text-sm font-semibold text-white" style={{background:C.moss}}>Editar</button><button onClick={()=>printQR(c)} title="QR de la carta para imprimir" className="rounded-lg px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">🔳 QR</button><a href={c.operator ? "operador.html?op="+encodeURIComponent(c.operator)+"&rubro=gastronomia" : "resto.html?slug="+c.slug} target="_blank" rel="noreferrer" className="rounded-lg px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">👁️ Ver</a><button onClick={()=>remove(c.id)} className="rounded-lg px-3 py-2 ff-body text-sm border border-stone-300 text-rose-500">🗑️</button></div>
              </div>
            </div>
          ))}</div>}
      </div>
      <footer className="py-8 text-center ff-body text-sm" style={{background:C.moss,color:"rgba(255,255,255,0.7)"}}>Gastronomía · Visitando Tandil · Creado por <a href="https://www.instagram.com/co.makers_/" target="_blank" rel="noopener noreferrer" style={{color:"inherit",textDecoration:"underline"}}>Comakers</a></footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
(function(){
  function medir(){var q=document.querySelector('.pre');
    if(q) document.documentElement.style.setProperty('--preH', q.offsetHeight+'px');}
  window.addEventListener('load',medir);window.addEventListener('resize',medir);
  document.addEventListener('DOMContentLoaded',medir);setInterval(medir,1200);
})();
</script>

header, header.vt{ position:sticky !important; top:0 !important;
  background:transparent !important; box-shadow:none !important;
  -webkit-backdrop-filter:saturate(1.1) blur(12px); backdrop-filter:saturate(1.1) blur(12px);
  border-bottom:1px solid rgba(70,62,42,.10) !important }
.filters, .filtros{ top:66px !important; background:transparent !important }
</style>
</body>
</html>
