/* ══════════════ CARTA · Visitando Tandil ══════════════
   Un solo template. El local cambia color y tipografía
   por variables; la estructura y el movimiento no cambian.
   ══════════════════════════════════════════════════════ */
:root{
  --bg:#FBF7E8; --surf:#FFFFFF; --ink:#23261A; --soft:#6A6455;
  --acc:#2E3521; --acc-ink:#FBF7E8; --acc2:#2E3521;
  --line:rgba(35,38,26,.08); --veil:rgba(35,38,26,.5);
  --disp:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --r:26px; --rm:18px; --rs:14px;
  --sombra:0 8px 26px rgba(35,38,26,.08);
  --sombra2:0 -14px 44px rgba(35,38,26,.20);
  --curva:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:-.015em;line-height:1.08}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.hide-sb{scrollbar-width:none;-ms-overflow-style:none}
.hide-sb::-webkit-scrollbar{display:none}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── portada ── */
.hero{position:relative;height:46vh;min-height:280px;max-height:420px;overflow:hidden;background:var(--acc)}
.hero .ph{position:absolute;inset:-8% 0;width:100%;height:116%;object-fit:cover;
  transform:translate3d(0,var(--py,0px),0) scale(1.04);will-change:transform}
.hero .veil{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(24,26,18,.42) 0%,rgba(24,26,18,.10) 38%,rgba(24,26,18,.78) 100%)}
.hero .top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 16px 0;z-index:3}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#23261A;box-shadow:0 4px 14px rgba(0,0,0,.16);transition:transform .18s var(--curva)}
.round:active{transform:scale(.9)}
.hero .name{position:absolute;left:0;right:0;bottom:0;padding:0 20px 52px;z-index:2;color:#fff}
.hero h1{margin:0;font-size:clamp(34px,10vw,46px);color:#fff}
.hero .meta{margin:8px 0 0;font-size:13.5px;color:rgba(255,255,255,.86)}
.hero .marca{font-size:11.5px;letter-spacing:.02em;color:rgba(255,255,255,.72);margin:0 0 10px}

/* ── la hoja que sube por encima de la foto ── */
.hoja{position:relative;z-index:4;margin-top:-34px;border-radius:30px 30px 0 0;background:var(--bg);
  padding-top:22px;min-height:60vh}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
.tag{font-size:12.5px;padding:5px 12px;border-radius:999px;background:var(--surf);color:var(--soft);
  border:1px solid var(--line)}
.consulta{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;
  color:var(--acc2);text-decoration:none}

/* ── riel de categorías ── */
.riel{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 9px;
  border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s}
.riel.stuck{border-bottom-color:var(--line);box-shadow:0 6px 18px rgba(35,38,26,.05)}
.riel .pista{position:relative;display:flex;gap:6px;overflow-x:auto;padding:0 18px;scroll-behavior:smooth}
.riel .marcador{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--acc);
  transition:transform .42s var(--curva),width .42s var(--curva);z-index:0;left:0}
.riel button{position:relative;z-index:1;flex:0 0 auto;padding:8px 15px;border-radius:999px;
  font-size:14px;font-weight:500;color:var(--soft);white-space:nowrap;transition:color .28s}
.riel button.on{color:var(--acc-ink)}

/* ── carrusel de destacados ── */
.carrusel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:4px 18px 20px;scroll-padding-left:18px}
.dest{flex:0 0 72%;scroll-snap-align:start;background:var(--surf);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--sombra);transition:transform .5s var(--curva),opacity .5s;
  transform:scale(.94);opacity:.62;text-align:left;width:100%}
.dest.foco{transform:scale(1);opacity:1}
.dest .im{aspect-ratio:4/3;background:var(--line);position:relative}
.dest .im img{width:100%;height:100%;object-fit:cover}
.dest .txt{padding:13px 15px 15px}
.dest h3{margin:0;font-size:19px}
.dest .pr{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ── secciones ── */
.car-sec{margin-left:-18px;margin-right:-18px;padding:2px 18px 12px}
.car-sec .dest{flex:0 0 66%}
.sec{padding:6px 0 10px}
.stit{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.stit i{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}

.grilla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plato{background:var(--surf);border-radius:var(--rm);overflow:hidden;text-align:left;width:100%;

.plato .txt{padding:11px 12px 12px;flex:1;display:flex;flex-direction:column}
.plato h3{margin:0;font-size:16.5px}
.plato .d{font-size:12.5px;color:var(--soft);margin:3px 0 0;line-height:1.35}
.plato .pr{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:6px}

.fila{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surf);border-radius:var(--rm);padding:13px 14px;margin-bottom:9px;
  box-shadow:var(--sombra);transition:transform .22s var(--curva)}
.fila:active{transform:scale(.985)}
.fila .c{flex:1;min-width:0}
.fila h3{margin:0;font-size:17px}
.fila .d{font-size:13px;color:var(--soft);margin:3px 0 0;line-height:1.4}
.fila .pr{margin-top:9px;display:flex;align-items:center;gap:10px}
.fila .im{flex:0 0 82px;height:82px;border-radius:var(--rs);overflow:hidden;background:var(--line)}
.fila .im img{width:100%;height:100%;object-fit:cover}

.precio{font-family:var(--disp);font-size:18px}

.mas{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--acc-ink);

.cont button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:17px;line-height:0;background:rgba(255,255,255,.16);color:inherit}
.ini{width:100%;height:100%;display:grid;place-items:center;font-family:var(--disp);
  font-size:34px;color:var(--soft);opacity:.45}
.chips{position:absolute;top:9px;left:9px;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 56px);z-index:2}
.chips span{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#23261A;font-size:11.5px;font-weight:500;padding:5px 11px;border-radius:999px;line-height:1.2;
  box-shadow:0 2px 8px rgba(35,38,26,.10)}
.chips-lin{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips-lin span{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:999px;
  background:var(--bg);color:var(--soft);border:1px solid var(--line);line-height:1.2}
.glob{position:absolute;top:8px;right:8px;min-width:24px;height:24px;padding:0 7px;border-radius:999px;
  background:var(--acc2);color:#fff;font-size:12.5px;font-weight:600;display:grid;place-items:center}

/* ── aparición al hacer scroll ── */
.rev{opacity:0;transform:translateY(14px)}
.rev.in{opacity:1;transform:none;transition:opacity .55s ease,transform .55s var(--curva)}

/* ── barra del pedido ── */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 18px calc(14px + env(safe-area-inset-bottom));
  transform:translateY(130%);transition:transform .44s var(--curva);pointer-events:none}
.barra.on{transform:none;pointer-events:auto}
.barra .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:12px;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:13px 16px 13px 14px;
  box-shadow:0 14px 34px rgba(35,38,26,.28);width:100%}
.barra .n{min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--acc-ink);color:var(--acc);
  font-size:13.5px;font-weight:600;display:grid;place-items:center}
.pop{animation:pop .34s var(--curva)}

.velo{position:fixed;inset:0;z-index:70;background:var(--veil);opacity:0;transition:opacity .32s ease}

.foto{width:100%;aspect-ratio:16/11;object-fit:cover;background:var(--line)}

.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  border-radius:999px;padding:15px;font-size:15.5px;font-weight:600;text-decoration:none;
  background:var(--acc);color:var(--acc-ink);transition:transform .2s var(--curva)}
.cta:active{transform:scale(.98)}
.cta.wsp{background:var(--acc2);color:#fff}
.linea{border-bottom:1px solid var(--line)}

footer{background:#2E3521;color:#9AA48D;text-align:center;font-size:13px;padding:26px 20px}
footer b{color:#EDF0E6;font-weight:500}
.centro{min-height:100vh;display:grid;place-items:center;text-align:center;padding:26px;color:var(--soft)}

  .barra .in{max-width:440px}
  footer{margin-top:8px}
}

}

  return "#"+m.map(v=>v.toString(16).padStart(2,"0")).join(""); };

function aplicarTema(t){
  const k = qs.get("tema") || (t && t.preset) || "serrano";
  const base = TEMAS[k] || TEMAS.serrano;
  const acc = qs.get("acento") || (t && t.acento) || base.acc;
  const s = document.documentElement.style;
  s.setProperty("--bg",base.bg); s.setProperty("--surf",base.surf); s.setProperty("--ink",base.ink);
  s.setProperty("--soft",base.soft); s.setProperty("--acc",acc); s.setProperty("--acc-ink",base.accInk);
  s.setProperty("--acc2",(t&&t.acento2)||base.acc2); s.setProperty("--line",base.line);
  s.setProperty("--disp",base.disp);
  const fondo = qs.get("fondo") || (t && t.fondo);
  if(fondo){
    const claro = lum(fondo) > 0.55;
    s.setProperty("--bg", fondo);
    s.setProperty("--surf", claro ? mezcla(fondo,"#FFFFFF",.74) : mezcla(fondo,"#FFFFFF",.09));
    s.setProperty("--ink",  claro ? "#23261A" : "#F7F3E6");
    s.setProperty("--soft", claro ? mezcla(fondo,"#000000",.52) : mezcla(fondo,"#FFFFFF",.58));
    s.setProperty("--line", claro ? "rgba(35,38,26,.10)" : "rgba(255,255,255,.14)");
  }
  const tc = document.getElementById("tcolor"); if(tc) tc.setAttribute("content", fondo || base.bg);
  if(base.fuente && !document.getElementById("fuente-tema")){
    const l=document.createElement("link"); l.id="fuente-tema"; l.rel="stylesheet";
    l.href="https://fonts.googleapis.com/css2?family="+base.fuente+"&display=swap";
    document.head.appendChild(l);
  }
  return base;
}

/* ─────────── guardados (semilla para la pantalla de Guardados) ─────────── */
const FAVK = "vt:favoritos:platos";
const leerFavs = () => { try { return JSON.parse(localStorage.getItem(FAVK)||"[]"); } catch(e){ return []; } };
function useFavs(slug){
  const [favs,setFavs] = useState(leerFavs);
  const clave = (n) => slug+"::"+n;
  const es = (n) => favs.indexOf(clave(n))>=0;
  const toggle = (n) => setFavs(p => {
    const k=clave(n); const s = p.indexOf(k)>=0 ? p.filter(x=>x!==k) : p.concat([k]);
    try{ localStorage.setItem(FAVK, JSON.stringify(s)); }catch(e){}
    return s;
  });
  return { es, toggle };
}

/* ─────────── íconos ─────────── */
const Ico = ({d,fill}) => (
  <svg width="19" height="19" viewBox="0 0 24 24" fill={fill||"none"} stroke="currentColor"
    strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d={d} /></svg>
);
const P_ATRAS = "M15 18l-6-6 6-6";
const P_CORAZON = "M12 20.5s-7.5-4.6-7.5-9.6A4.4 4.4 0 0 1 12 8.2a4.4 4.4 0 0 1 7.5 2.7c0 5-7.5 9.6-7.5 9.6z";
const P_CERRAR = "M18 6L6 18M6 6l12 12";

/* ─────────── hoja arrastrable ─────────── */
function Hoja({ abierta, cerrar, children, alto }){
  const [montada,setMontada] = useState(abierta);
  const [on,setOn] = useState(false);
  const caja = useRef(null);
  const drag = useRef({y0:0,dy:0,activo:false});

  useEffect(()=>{
    let t;
    if(abierta){ setMontada(true); t=setTimeout(()=>setOn(true),20); }
    else { setOn(false); t=setTimeout(()=>setMontada(false),440); }
    return ()=>clearTimeout(t);
  },[abierta]);

  useEffect(()=>{
    if(!montada) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const esc = (e)=>{ if(e.key==="Escape") cerrar(); };
    window.addEventListener("keydown",esc);
    return ()=>{ document.body.style.overflow=prev; window.removeEventListener("keydown",esc); };
  },[montada,cerrar]);

  const down = (e)=>{ drag.current={y0:e.clientY,dy:0,activo:true};
    if(caja.current){ caja.current.style.transition="none"; caja.current.setPointerCapture(e.pointerId); } };
  const move = (e)=>{ if(!drag.current.activo||!caja.current) return;
    const dy = Math.max(0, e.clientY - drag.current.y0); drag.current.dy = dy;
    caja.current.style.setProperty("--dy", dy+"px"); };
  const up = ()=>{ if(!drag.current.activo||!caja.current) return;
    drag.current.activo=false;
    caja.current.style.transition="";
    caja.current.style.removeProperty("--dy");
    if(drag.current.dy > 96) cerrar(); };

  if(!montada) return null;
  return (
    <React.Fragment>
      <div className={"velo"+(on?" on":"")} onClick={cerrar} />
      <div ref={caja} className={"sheet"+(on?" on":"")} style={alto?{height:alto}:null} role="dialog" aria-modal="true">
        <div className="asa" onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}><span /></div>
        {children}
      </div>
    </React.Fragment>
  );
}

/* ─────────── controles de cantidad ─────────── */
function Contador({ qty, add, dec, chico }){
  if(!add) return null;
  if(!qty) return <button className="mas" onClick={(e)=>{e.stopPropagation(); add();}} aria-label="Agregar">+</button>;
  return (

      <button onClick={dec} aria-label="Quitar uno">−</button>
      <b>{qty}</b>

  );
}

};
function Chips({ it, max }){

  return <span className="chips">{e.slice(0,max||2).map((t,i)=><span key={i}>{t}</span>)}</span>;
}
function ChipsLinea({ it }){
  const e = etiquetasDe(it); if(!e.length) return null;
  return <span className="chips-lin">{e.map((t,i)=><span key={i}>{t}</span>)}</span>;

function Foto({ it }){

/* ─────────── ficha del plato ─────────── */

/* ─────────── carta ─────────── */
function Menu({ c }){
  const cats = useMemo(()=>[...new Set(c.menu.map(i=>i.category||"Menú"))],[c]);
  const [activa,setActiva] = useState(cats[0]||"");
  const [cart,setCart] = useState({});
  const [notes,setNotes] = useState({});
  const [name,setName] = useState("");
  const [addr,setAddr] = useState("");
  const [sheet,setSheet] = useState(false);
  const [ficha,setFicha] = useState(null);
  const [stuck,setStuck] = useState(false);
  const [late,setLate] = useState(false);
  const heroRef = useRef(null), rielRef = useRef(null), marcaRef = useRef(null), main = useRef(null);
  const favs = useFavs(c.slug);

  const cartOn = !!c.whatsapp;
  const wa = c.whatsapp ? `https://wa.me/${c.whatsapp}?text=`+encodeURIComponent(`Hola! Quiero hacer una consulta sobre ${c.name}.`) : null;
  const tags = [c.zone, c.sinTacc && "Sin TACC", c.vegetariano && "Opciones veggie"].filter(Boolean);

  const add = (idx) => { setCart(p => ({ ...p, [idx]: (p[idx]||0)+1 })); setLate(true); setTimeout(()=>setLate(false),360); };
  const dec = (idx) => setCart(p => { const q=(p[idx]||0)-1; const n={...p}; if(q<=0) delete n[idx]; else n[idx]=q; return n; });
  const setNote = (idx,v) => setNotes(p => ({ ...p, [idx]: v }));

  const entries = Object.entries(cart).map(([k,q]) => [Number(k), q]).filter(([i,q]) => q>0 && c.menu[i]);
  const count = entries.reduce((s,[,q]) => s+q, 0);
  const total = entries.reduce((s,[i,q]) => s + ((c.menu[i].price>0 ? c.menu[i].price : 0) * q), 0);

  const orderUrl = (() => {
    if (!c.whatsapp || count===0) return null;
    const lines = entries.map(([i,q]) => { const it=c.menu[i]; const nt=(notes[i]||"").trim(); return `• ${q}x ${it.name}` + (it.price>0 ? ` — ${money(it.price*q)}` : " — (a confirmar)") + (nt ? `\n   ↳ ${nt}` : ""); });
    let msg = `Hola!`;
    if (name.trim()) msg += ` Soy ${name.trim()}.`;
    msg += ` Quiero hacer este pedido en ${c.name}:\n\n${lines.join("\n")}\n\nTotal estimado: ${money(total)}`;
    if (addr.trim()) msg += `\n\nDirección de entrega: ${addr.trim()}`;
    return `https://wa.me/${c.whatsapp}?text=`+encodeURIComponent(msg);
  })();

  /* portada con parallax + riel que se pega */
  useEffect(()=>{
    let tick=false;
    const on = ()=>{ if(tick) return; tick=true; requestAnimationFrame(()=>{
      const y = window.scrollY;
      if(heroRef.current) heroRef.current.style.setProperty("--py", Math.min(y*0.28,120)+"px");
      if(rielRef.current){ const t = rielRef.current.getBoundingClientRect().top; setStuck(t<=1); }
      tick=false;
    }); };
    window.addEventListener("scroll",on,{passive:true}); on();
    return ()=>window.removeEventListener("scroll",on);
  },[]);

  /* qué sección estoy mirando */
  useEffect(()=>{
    if(!cats.length) return;
    const obs = new IntersectionObserver((es)=>{
      es.forEach(e=>{ if(e.isIntersecting){ const cat = e.target.getAttribute("data-cat"); if(cat) setActiva(cat); } });
    },{ rootMargin:"-42% 0px -52% 0px" });
    cats.forEach(cat=>{ const el=document.getElementById(slugId(cat)); if(el) obs.observe(el); });
    return ()=>obs.disconnect();
  },[cats]);

  /* marcador del riel */
  useEffect(()=>{
    const pista = rielRef.current && rielRef.current.querySelector(".pista");
    if(!pista) return;
    const b = pista.querySelector("button.on");
    if(b && marcaRef.current){
      marcaRef.current.style.width = b.offsetWidth+"px";
      marcaRef.current.style.transform = "translateX("+b.offsetLeft+"px)";
      const izq = b.offsetLeft - pista.clientWidth/2 + b.offsetWidth/2;
      pista.scrollTo({ left: Math.max(0,izq), behavior:"smooth" });
    }
  },[activa,cats]);

  /* aparición escalonada */
  useEffect(()=>{
    const nodos = document.querySelectorAll(".rev:not(.in)");
    const obs = new IntersectionObserver((es)=>{
      let i=0;
      es.forEach(e=>{ if(e.isIntersecting){ const el=e.target; setTimeout(()=>el.classList.add("in"), i*45); i++; obs.unobserve(el); } });
    },{ rootMargin:"0px 0px -8% 0px" });
    nodos.forEach(n=>obs.observe(n));
    return ()=>obs.disconnect();
  },[cats,c]);

  /* tarjeta enfocada del carrusel */
  useEffect(()=>{
    const obs = [];
    document.querySelectorAll(".carrusel").forEach(car=>{
      const o = new IntersectionObserver((es)=>{
        es.forEach(e=> e.target.classList.toggle("foco", e.intersectionRatio>0.82));
      },{ root:car, threshold:[0,.82,1] });
      Array.from(car.children).forEach(ch=>o.observe(ch));
      obs.push(o);
    });
    return ()=>obs.forEach(o=>o.disconnect());
  },[c,cats]);

  const ir = (cat) => { setActiva(cat); const el=document.getElementById(slugId(cat));
    if(el) window.scrollTo({ top: el.getBoundingClientRect().top+window.scrollY-64, behavior:"smooth" }); };

  const conFoto = c.menu.filter(i=>i.photo);
  const destacados = conFoto.slice(0,6).map(it => ({ it, idx: c.menu.indexOf(it) }));
  const conf = c.tema || {};

  return (

          {wa && <a className="round" href={wa} target="_blank" rel="noreferrer" aria-label="Consultar por WhatsApp"

        </div>
        <div className="name">
          <p className="marca">Carta del lugar</p>

        {verDest && destacados.length>1 && (
          <section>
            <div className="wrap"><div className="stit"><i /><h2 className="disp">{tituloDest}</h2></div></div>

                <Destacado key={idx} it={it} qty={cart[idx]||0}
                  add={cartOn?(()=>add(idx)):null} dec={cartOn?(()=>dec(idx)):null}

              ))}

        {cats.length>1 && (
          <div className="riel" ref={rielRef}>
            <div className="pista hide-sb">
              <span className="marcador" ref={marcaRef} />

                const items = c.menu.map((it,idx)=>({it,idx})).filter(x=>(x.it.category||"Menú")===cat);
                const modo = modoDe(cat, items);
                return (
                  <section key={ci} id={slugId(cat)} data-cat={cat} className="sec" style={{scrollMarginTop:"70px"}}>

                      ? <div className="carrusel car-sec hide-sb">

        <div className="scroll" style={{padding:"0 20px"}}>
          {entries.length===0
            ? <p style={{textAlign:"center",color:"var(--soft)",padding:"40px 0"}}>Todavía no agregaste nada.</p>
            : entries.map(([i,q])=>{ const it=c.menu[i]; return (
                <div key={i} className="linea" style={{padding:"12px 0"}}>
                  <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
                    <div style={{width:"48px",height:"48px",borderRadius:"12px",overflow:"hidden",flex:"none",background:"var(--line)"}}>
                      <Foto it={it} />
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:500,fontSize:"15px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.name}</div>
                      <div style={{fontSize:"13px",color:"var(--soft)"}}>{it.price>0 ? money(it.price)+" c/u" : "A confirmar"}</div>
                    </div>
                    <Contador qty={q} add={()=>add(i)} dec={()=>dec(i)} />
                    {it.price>0 && <span className="precio" style={{minWidth:"74px",textAlign:"right"}}>{money(it.price*q)}</span>}
                  </div>
                  <input className="campo" style={{marginTop:"8px",fontSize:"13.5px",padding:"9px 12px"}}
                    value={notes[i]||""} onChange={e=>setNote(i,e.target.value)}
                    placeholder="Aclaración (ej: sin sal, para llevar)" />
                </div>
              ); })}
        </div>
        <div className="pie">
          {entries.length>0 && (
            <div style={{display:"grid",gap:"8px",marginBottom:"14px"}}>
              <input className="campo" value={name} onChange={e=>setName(e.target.value)} placeholder="Tu nombre" />
              <input className="campo" value={addr} onChange={e=>setAddr(e.target.value)} placeholder="Dirección de entrega (o 'retiro en el local')" />
            </div>
          )}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:"14px"}}>
            <span style={{fontWeight:500}}>Total estimado</span>
            <span className="disp" style={{fontSize:"27px"}}>{money(total)}</span>
          </div>
          {orderUrl
            ? <a className="cta wsp" href={orderUrl} target="_blank" rel="noreferrer">Enviar pedido por WhatsApp</a>
            : <p style={{textAlign:"center",color:"var(--soft)",fontSize:"14px",margin:"6px 0"}}>Agregá algún plato para enviar el pedido.</p>}
          {entries.length>0 && <button onClick={()=>{ setCart({}); setNotes({}); }}
            style={{display:"block",width:"100%",textAlign:"center",marginTop:"12px",color:"var(--soft)",fontSize:"14px"}}>Vaciar pedido</button>}
          <p style={{fontSize:"12px",color:"var(--soft)",textAlign:"center",margin:"12px 0 0",lineHeight:1.4}}>
            El total es estimado. El local confirma disponibilidad, pago y envío por WhatsApp.</p>
        </div>
      </Hoja>
    </div>
  );
}

const DEMOS = { sushi:DEMO_SUSHI, cafe:DEMO_CAFE, cafeteria:DEMO_CAFE, cerveceria:DEMO_CERVE, cerve:DEMO_CERVE };

function App(){
  const [state,setState] = useState({loading:true});
  useEffect(()=>{ (async()=>{
    const slug = qs.get("slug");
    const d = qs.get("demo");
    if(d){
      const elegido = DEMOS[String(d).toLowerCase()] || DEMO;
      const c = fromRow(elegido);
      aplicarTema(c.tema);
      document.title = "Carta · " + c.name;
      setState({c});
      return;
    }
    if(!slug){ setState({notfound:true}); return; }
    const {data,error} = await db.from("restaurants").select("*").eq("slug",slug).limit(1);
    if(error){ setState({error:true}); return; }
    if(data && data[0]){
      const c = fromRow(data[0]);
      aplicarTema(c.tema);
      document.title = "Carta · " + c.name;
      setState({c});
    } else setState({notfound:true});
  })(); },[]);
  if(state.loading) return <div className="centro">Cargando carta…</div>;
  if(state.notfound || state.error) return <div className="centro">No encontramos esta carta.</div>;
  return <Menu c={state.c} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
