:root{

}
/* fuera la textura de papel */
.worn::before,.worn::after,body::after,body::before,#root::after,.fondo{display:none !important}

.cards,.gA{display:grid !important;grid-template-columns:repeat(3,1fr) !important;gap:26px !important;

.etiqueta,.card .body{

.etiqueta h3,.card .body h3{font-size:19px !important;margin:0 0 2px !important}
.etiqueta .z,.card .body .meta{font-size:12.5px !important;color:var(--suave) !important;

.etiqueta .pie,.card .price{margin-top:12px !important;padding-top:11px !important;

.card .price em,.etiqueta .ver{color:var(--ladrillo) !important;font-weight:500 !important;font-size:13.5px !important}

.chips{top:12px !important;left:12px !important;flex-direction:row !important;flex-wrap:wrap;gap:6px !important}

.filters,.filtros{position:sticky !important;top:calc(var(--preH,40px) + 66px) !important;z-index:50 !important;

  const cats = [...new Set(acts.map(a=>a.category).filter(Boolean))].sort();
  const show = acts.filter(a => (!zona || a.zone===zona) && (!cat || a.category===cat));
  const active = (zona?1:0)+(cat?1:0);
  const clear = () => { setZona(""); setCat(""); };
  const selCls = "ff-body text-[13px] rounded-full border bg-transparent px-4 py-2 cursor-pointer";
  const selStyle = { borderColor:"rgba(36,34,28,0.18)", color:C.moss };

    <div style={{ background: C.paper }}>
      <PageTitle kicker="Paseos & aventura" title="Qué hacer en Tandil" sub="Cerros, agua, historia y aire puro. Estos son los imperdibles para tu estadía." />

          </div>

function App() {
  const params = new URLSearchParams(location.search);
  const op = (params.get("op") || "").trim();
  const rubroParam = (params.get("rubro") || "").trim().toLowerCase();
  const viewParam = (params.get("view") || "").trim();
  const VALID_VIEWS = ["home","qhacer","gastro","conoce","owners","contacto"];
  const TAB = { hospedaje: "home", actividad: "qhacer", gastronomia: "gastro" };
  const navedRef = React.useRef(false);
  const [menu, setMenu] = useState(false);
  const [view, setView] = useState(VALID_VIEWS.includes(viewParam) ? viewParam : (TAB[rubroParam] || "home"));
  const [scrolled, setScrolled] = useState(false);
  const [data, setData] = useState({ loading: true, missing: !op, cabins: [], acts: [], food: [] });
  useEffect(() => {
    if (op) document.title = op + " · Visitando Tandil";
    if (!op) { setData(d => ({ ...d, loading: false, missing: true })); return; }
    (async () => {
      const [a, b, c] = await Promise.all([
        db.from("cabins").select("*").order("created_at", { ascending: false }),
        db.from("activities").select("*").order("created_at", { ascending: false }),
        db.from("restaurants").select("*").order("created_at", { ascending: false }),
      ]);
      const allCabins = a.data || [], allActs = b.data || [], allFood = c.data || [];
      const mine = (x) => String(x.operator || "").trim().toLowerCase() === op.toLowerCase();
      const ownCabins = allCabins.filter(mine), ownActs = allActs.filter(mine), ownFood = allFood.filter(mine);
      let rubro = rubroParam;
      if (!["hospedaje", "actividad", "gastronomia"].includes(rubro)) {
        if (ownCabins.length) rubro = "hospedaje";
        else if (ownActs.length) rubro = "actividad";
        else if (ownFood.length) rubro = "gastronomia";
        else rubro = "hospedaje";
      }
      setData({
        loading: false, missing: false,
        cabins: rubro === "hospedaje" ? ownCabins : allCabins,
        acts:   rubro === "actividad" ? ownActs   : allActs,
        food:   rubro === "gastronomia" ? ownFood : allFood,
      });
      if (!navedRef.current && !rubroParam && !viewParam) setView(TAB[rubro] || "home");
    })();
  }, []);
  const go = (v) => { navedRef.current = true; setView(v); setMenu(false); window.scrollTo({ top: 0 }); };
  useEffect(() => { window.scrollTo({ top: 0 }); }, [view]);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > window.innerHeight * 0.7);
    onScroll(); window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  useEffect(() => {
    const els = Array.from(document.querySelectorAll(".reveal:not(.in)"));
    if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
    const io = new IntersectionObserver((ents) => { ents.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }); }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
    els.forEach(e => io.observe(e));
    return () => io.disconnect();
  }, [view, data]);
  const solid = view !== "home" || scrolled;
  if (data.missing) return (
    <div className="min-h-screen grid place-items-center ff-body p-6 text-center" style={{ background: C.paper, color: C.ink }}>
      Falta indicar el operador en la dirección (?op=...).
    </div>
  );
  return (
    <div className="min-h-screen ff-body" style={{ background: C.paper }}>
      <Header view={view} go={go} onOpen={() => setMenu(true)} solid={solid} />
      <MobileMenu open={menu} go={go} onClose={() => setMenu(false)} />
      {view === "home" && <Home cabins={data.cabins} loading={data.loading} go={go} />}
      {view === "qhacer" && <ActivitiesPage acts={data.acts} loading={data.loading} />}
      {view === "gastro" && <FoodPage food={data.food} loading={data.loading} />}
      {view === "conoce" && <AboutPage />}
      {view === "owners" && <OwnersPage />}
      {view === "contacto" && <ContactPage />}
      <Footer go={go} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
