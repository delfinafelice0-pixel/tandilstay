<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visitando Tandil</title>
<meta name="robots" content="noindex" />
<style>
body{margin:0;background:#FBF7E8;font-family:system-ui,sans-serif;color:#5F5945;display:grid;place-items:center;min-height:100vh}
a{color:#2E3521}
</style>
<script>
/* Esta dirección vieja se sigue usando en links ya compartidos.
   La página de cada operador ahora vive en la guía nueva: la reenvío ahí. */
(function(){
  var q = new URLSearchParams(location.search);
  var op = (q.get("op") || "").trim();
  var r  = (q.get("rubro") || "").trim();
  var ruta = r === "gastronomia" ? "/para-comer" : r === "actividad" ? "/para-pasear" : r === "hospedaje" ? "/para-dormir" : "/";
  location.replace(ruta + (op ? "?op=" + encodeURIComponent(op) : ""));
})();
</script>
</head>
<body>
<p>Te llevamos a la guía… <a href="/">Si no carga, tocá acá.</a></p>
</body>
</html>
