/* ═══════════════════════════════════════════════════════════
   ESTILO DEFINITIVO · versión 3 + sábana B
   Va último: manda sobre todo lo anterior.
   ═══════════════════════════════════════════════════════════ */
:root{
  --monte:#2E3521; --liquen:#63653F; --arena:#DFCCAE; --ladrillo:#2E3521;
  --crudo:#FBF7E8; --papel:#F4EEDC; --tinta:#23261A; --suave:#6A6455;
  --linea:rgba(35,38,26,.10); --punt:rgba(35,38,26,.10);
  --r:24px; --rm:18px; --rs:14px; --pill:999px;
  --sombra:0 10px 30px rgba(35,38,26,.07);
  --sombra2:0 18px 44px rgba(35,38,26,.12);
  --sans:'DM Sans',system-ui,sans-serif;
  --serif:'DM Serif Display',Georgia,serif;
  --display:'DM Serif Display',Georgia,serif;
  --mano:'DM Sans',system-ui,sans-serif;
}
/* fuera la textura de papel */
.worn::before,.worn::after,body::after,body::before,#root::after,.fondo{display:none !important}

/* ── tres tonos y nada más ── */
body{background:var(--crudo) !important;color:var(--tinta) !important;
  font-family:var(--sans) !important;font-size:16px !important;line-height:1.6 !important}
.pre{background:rgba(46,53,33,.94) !important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  color:#C6CDBD !important;position:fixed !important;top:0 !important;left:0;right:0;z-index:95 !important;
  font-size:12.5px !important;letter-spacing:0 !important;text-transform:none !important}
.pre a{color:#E2E8D8 !important}
.pdot{background:var(--arena) !important;width:6px !important;height:6px !important}
header,header.vt{background:rgba(244,238,220,.85) !important;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--linea) !important;position:sticky !important;
  top:var(--preH,40px) !important;z-index:60 !important}
body{padding-top:var(--preH,40px)}
.topbar{position:static !important}
.topbar .pre{position:fixed !important}
.sabana,.cards,.gA,.strip,.ig,.cerca,.filters,.filtros,.filtrosbar,.listwrap{background:transparent !important}
footer{background:var(--monte) !important;color:#C6CDBD !important;border-top:0 !important}
footer h5{color:#9AA48D !important}
footer a,footer button{color:#DDE3D3 !important}
footer p,.next,.fnote{color:#9AA48D !important}
footer .wm,footer .wm span{color:#EDF0E6 !important}
footer .wm span{color:#9AA48D !important}
.fnote{border-top:1px solid rgba(237,240,230,.18) !important}
footer svg{stroke:#EDF0E6 !important}
footer svg circle{fill:#EDF0E6 !important}

/* ── tipografía ── */
h1,h2,h3,h4,.disp,.titulo,.wm,.etiqueta h3,.card h3,.tile h4,.mom b,.strip b,.day h4,
.tira h3,.desde,.datos b,.precio,.ficha .precio,.aa,.big,.type,.fr,.carta h3,.ptitle h1{
  font-family:var(--serif) !important;font-weight:400 !important;letter-spacing:-.015em !important}
h1{line-height:1.02 !important}
.wm{text-transform:none !important;letter-spacing:-.02em !important;font-size:17px !important;
  font-family:var(--sans) !important;font-weight:600 !important}
.wm span,.wm .sub{font-family:var(--sans) !important;letter-spacing:.18em !important;font-size:9px !important;
  color:var(--suave) !important;font-weight:400 !important}
.mano{font-family:var(--sans) !important;color:var(--suave) !important;font-style:italic}
.rot,.kick,.meta,.epi,.aside,.cat,.k,.z,.st,.ver,.eyebrow,.idx,.num,.cuenta,.count{
  text-transform:none !important;letter-spacing:0 !important;font-size:13px !important}
.eyebrow,.kick{color:var(--ladrillo) !important;font-weight:600 !important;font-size:13px !important}
.eyebrow i,.eyebrow span,.kicker span{display:none !important}
.marco > .num,.shead .idx{display:none !important}
.marco{grid-template-columns:1fr !important;gap:0 !important}
/* el punto verde antes de cada título */
h2::before,.titulo::before{content:"" !important;display:inline-block;width:8px;height:8px;
  border-radius:50%;background:var(--monte);margin-right:12px;vertical-align:middle;position:static}

/* ── botones y campos: pastillas ── */
.solid,.ghost,.sel,.pill,.send,.mail,.wsp,.ver,.btn,.chip,.mom,.cta{
  border-radius:var(--pill) !important;text-transform:none !important;letter-spacing:0 !important;
  font-size:14px !important;font-weight:500 !important}
.solid{background:var(--ladrillo) !important;border-color:var(--ladrillo) !important;color:#fff !important;
  padding:12px 22px !important}
.ghost,.sel,.pill{background:rgba(255,255,255,.62) !important;border:1px solid var(--linea) !important;
  color:var(--tinta) !important;padding:11px 18px !important;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sel.on,.pill.on{background:var(--monte) !important;border-color:var(--monte) !important;color:#EDF0E6 !important}
.send{background:var(--monte) !important;color:#EDF0E6 !important;border-radius:var(--pill) !important}
.field input,.field select,.field textarea,input,select,textarea{
  border-radius:var(--rs) !important;border:1px solid var(--linea) !important;
  background:rgba(251,247,232,.8) !important;font-family:var(--sans) !important}

/* ── superficies de vidrio ── */
.form,.calbox,.ficha,.plan,.day,.datos,.indice ol,.momentos,.mom,.carta,.panel,.amenbox,
.modalbox,.popbox,.reservar,.aviso,.nodisp,.horarios,.bloque{
  background:rgba(255,255,255,.72) !important;border:1px solid rgba(255,255,255,.6) !important;
  border-radius:var(--r) !important;box-shadow:var(--sombra) !important;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.carta{background:var(--monte) !important;border:0 !important;color:#DDE3D3 !important}
.carta h3{color:#EDF0E6 !important}
.carta .btn{background:var(--arena) !important;color:var(--monte) !important;border:0 !important}
.spread img,.par img,.tercias img,.galeria img,.videos iframe,.mapa,.tile,.mini .ph,
.apertura,.card figure,.unidad .ph{border-radius:var(--rm) !important;overflow:hidden}
.mapa{filter:grayscale(.25) sepia(.05) !important}

/* ── líneas: sólidas y finas ── */
.fill,.filas div,.comod div,.item,.stops li,.indice li,.horarios div,.epi,.price,.pie,
.shead,.sh,.head{border-style:solid !important;border-color:var(--linea) !important}
.shead,.marco .titulo{border-bottom:1px solid var(--linea) !important;padding-bottom:12px !important}

/* ═══════════ SÁBANA · OPCIÓN B ═══════════ */
.cards,.gA{display:grid !important;grid-template-columns:repeat(3,1fr) !important;gap:26px !important;
  padding:8px 0 10px !important;margin:0 !important;clip-path:none !important;box-shadow:none !important}
.card,.pA{background:transparent !important;border:0 !important;box-shadow:none !important;
  padding:0 0 44px 0 !important;position:relative !important;
  -webkit-backdrop-filter:none !important;backdrop-filter:none !important}
.card:hover,.pA:hover{transform:none !important;box-shadow:none !important;border-color:transparent !important}
.card .ph,.pA .ph,.card figure{aspect-ratio:4/5 !important;height:auto !important;
  border-radius:var(--r) !important;overflow:hidden;box-shadow:var(--sombra) !important;position:relative}
.card:hover .ph,.pA:hover .ph{box-shadow:var(--sombra2) !important}
.card .ph img,.pA .ph img{width:100% !important;height:100% !important;object-fit:cover !important}
/* la hojita de vidrio, montada y sobresaliendo */
.etiqueta,.card .body{
  position:absolute !important;left:16px !important;right:34px !important;bottom:0 !important;
  z-index:4;background:rgba(255,255,255,.74) !important;
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid rgba(255,255,255,.6) !important;border-radius:var(--rm) !important;
  padding:16px 18px !important;box-shadow:0 14px 34px rgba(35,38,26,.16) !important;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s}
.card:hover .body,.pA:hover .etiqueta{transform:translateY(-6px);background:rgba(255,255,255,.88) !important}
.etiqueta h3,.card .body h3{font-size:19px !important;margin:0 0 2px !important}
.etiqueta .z,.card .body .meta{font-size:12.5px !important;color:var(--suave) !important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etiqueta .pie,.card .price{margin-top:12px !important;padding-top:11px !important;
  border-top:1px solid var(--linea) !important;border-bottom:0 !important}
.card .price b,.etiqueta .pr{font-family:var(--sans) !important;font-weight:600 !important;
  font-size:18px !important;letter-spacing:-.02em !important}
.card .price em,.etiqueta .ver{color:var(--ladrillo) !important;font-weight:500 !important;font-size:13.5px !important}
/* las etiquetas blancas sobre la foto */
.chips{top:12px !important;left:12px !important;flex-direction:row !important;flex-wrap:wrap;gap:6px !important}
.chips .chip,.card .chips .chip{background:rgba(255,255,255,.8) !important;border-radius:var(--pill) !important;
  padding:6px 12px !important;font-size:11.5px !important;font-weight:500 !important;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:0 !important;margin:0 !important;
  text-transform:none !important;letter-spacing:0 !important}

/* ── filtros pegados ── */
.filters,.filtros{position:sticky !important;top:calc(var(--preH,40px) + 66px) !important;z-index:50 !important;
  background:rgba(251,247,232,.9) !important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:14px 0 12px !important;border-bottom:1px solid var(--linea) !important;
  border-top:0 !important;box-shadow:none !important;display:flex !important;gap:9px !important;
  overflow-x:auto;flex-wrap:nowrap !important;scrollbar-width:none}
.filters::-webkit-scrollbar,.filtros::-webkit-scrollbar{display:none}
.filters .sel,.filtros .sel{flex:0 0 auto !important}
.count,.cuenta{margin-left:auto !important;align-self:center;flex:0 0 auto}

/* ── portada ── */
.hero{border-radius:0 !important}
.hero .bg,.hero .bg img,.hero .bg video{border-radius:0 !important}
.hero .bg::after{background:linear-gradient(100deg,rgba(24,28,18,.40) 0%,rgba(24,28,18,.06) 55%,rgba(24,28,18,.32) 100%) !important}
.sheet{background:rgba(255,255,255,.68) !important;border:1px solid rgba(255,255,255,.55) !important;
  border-radius:var(--r) !important;-webkit-backdrop-filter:blur(22px) saturate(1.3);
  backdrop-filter:blur(22px) saturate(1.3);box-shadow:var(--sombra2) !important;
  padding:30px 32px 28px !important;max-width:480px !important}
.sheet h1{font-size:clamp(32px,4vw,46px) !important}
.sheet .lede{font-size:15.5px !important;color:var(--suave) !important}
.strip button{background:rgba(255,255,255,.7) !important;border:1px solid rgba(255,255,255,.6) !important;
  border-radius:var(--rm) !important;box-shadow:var(--sombra) !important;margin:0 !important}
.strip .in{gap:14px !important;padding-top:18px !important;padding-bottom:18px !important}
.strip{border-bottom:0 !important}

/* ── mosaico y carruseles ── */
.mosaic{gap:14px !important}
.mini{display:flex !important;gap:16px !important;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;padding-bottom:8px}
.mini::-webkit-scrollbar{display:none}
.mini > a{flex:0 0 250px;scroll-snap-align:start;background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.6);border-radius:var(--rm);padding:8px;box-shadow:var(--sombra)}
.mini > a:hover{transform:translateY(-3px);box-shadow:var(--sombra2)}
.mini h4{margin:11px 8px 0 !important;font-size:17px !important}
.mini p{margin:2px 8px 10px !important}

/* ── barra de abajo ── */
.appbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:85;
  background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  backdrop-filter:blur(20px) saturate(1.2);border:1px solid rgba(255,255,255,.7);
  border-radius:28px;box-shadow:0 14px 40px rgba(35,38,26,.18);
  display:grid;grid-template-columns:repeat(5,1fr);padding:10px 8px;
  width:calc(100% - 32px);max-width:520px}
.appbar a{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;
  font-size:11.5px;color:var(--suave);text-decoration:none;border-radius:16px}
.appbar a.on{color:var(--ladrillo);font-weight:600}
.appbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){ .appbar{display:none} }

/* ══════════ CELULAR ══════════ */
@media(max-width:900px){
  .nav{display:none !important}
  .burger{display:none !important}
  body{padding-bottom:100px}
  .acts .ghost{display:none !important}
}
@media(max-width:760px){
  .in{padding-left:20px !important;padding-right:20px !important}
  .pre{position:sticky !important}
  body{padding-top:0}
  header,header.vt{position:static !important;background:transparent !important;border-bottom:0 !important}
  .hbar{padding:14px 0 4px !important;justify-content:center}
  .acts{display:none !important}
  .pre .der,.pre .loc{display:none}
  .pre .in{justify-content:center}
  .hero{display:block !important;position:relative !important;min-height:0 !important}
  .hero .bg{position:absolute !important;inset:0 !important;height:100% !important}
  .hgrid{display:block !important;padding:64px 0 40px !important}
  .sheet{max-width:none !important;margin:0 !important;padding:24px 20px 22px !important}
  .sheet h1{font-size:31px !important}
  .heroctas{display:grid !important;grid-template-columns:1fr !important;gap:9px !important}
  .heroctas .solid,.heroctas .ghost{text-align:center;padding:14px !important}
  .strip .in{grid-template-columns:1fr !important;gap:10px !important}
  .cards,.gA{grid-template-columns:1fr !important;gap:22px !important}
  .card .ph,.pA .ph{aspect-ratio:4/3 !important}
  .etiqueta,.card .body{left:14px !important;right:22px !important}
  .card,.pA{padding-bottom:38px !important}
  .filters,.filtros{top:0 !important;padding-left:20px !important;padding-right:20px !important;
    margin-left:-20px !important;margin-right:-20px !important}
  .mosaic{grid-template-columns:1fr 1fr !important;grid-auto-rows:auto !important;padding:0 20px !important}
  .mosaic .tile{min-height:150px}
  .momentos,.plan,.reserva,.comod,.videos,.par,.tercias,.consulta,.f2,.fgrid{grid-template-columns:1fr !important}
  .apertura{margin:0 20px !important;height:44vh !important;min-height:250px !important}
  .mini > a{flex:0 0 74%}
  section{padding-top:40px !important;padding-bottom:40px !important}
}
</style>

};
const delFromStorage = async (url) => { try { const m=String(url||"").match(/\/storage\/v1\/object\/public\/fotos\/(.+)$/); if(m) await db.storage.from("fotos").remove([decodeURIComponent(m[1])]); } catch(_){} };
async function up(file, prefix){ const f=await compressToWebp(file); const path=prefix+"-"+Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+f.name.replace(/[^a-zA-Z0-9.]/g,"_"); const { error }=await db.storage.from("fotos").upload(path,f); if(error) return null; return db.storage.from("fotos").getPublicUrl(path).data.publicUrl; }

function Editor({ c, set }) {
  const [uploading,setUploading]=useState(false);
  const uploadBanner = async (e)=>{ const f=(e.target.files||[])[0]; if(!f)return; setUploading(true); const old=c.banner; const u=await up(f,"act-banner"); if(u){ if(old) delFromStorage(old); set({...c,banner:u}); } setUploading(false); e.target.value=""; };
  const uploadGallery = async (e)=>{ const fs=Array.from(e.target.files||[]); if(!fs.length)return; const MAXP=15; const room=MAXP-(c.photos||[]).length; if(room<=0){ alert("Llegaste al máximo de "+MAXP+" fotos. Borrá alguna para subir otra."); e.target.value=""; return; } if(fs.length>room) alert("Solo se agregan "+room+" foto(s): el máximo es "+MAXP+"."); const toUp=fs.slice(0,room); setUploading(true); const urls=[]; for(const f of toUp){ const u=await up(f,"act"); if(u) urls.push(u);} set({...c,photos:[...c.photos,...urls]}); setUploading(false); e.target.value=""; };
  return (
    <div className="grid md:grid-cols-2 gap-6">
      <div className="space-y-5">
        <div className="bg-white rounded-2xl border border-black/5 p-5">
          <h3 className="ff-display text-lg mb-3" style={{color:C.ink}}>Datos</h3>
          <Field label="Nombre"><input value={c.name} onChange={e=>set({...c,name:e.target.value})} className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm" /></Field>
          <Field label="Operador / cuenta (opcional)"><input value={c.operator} onChange={e=>set({...c,operator:e.target.value})} placeholder="Ej: aventuratandil" className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm" /></Field>
          <Field label="Dirección / punto de encuentro (como en Google Maps)"><input value={c.zone} onChange={e=>set({...c,zone:e.target.value})} placeholder="Ej: Cerro El Centinela, Tandil" className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm" /></Field>
          {c.zone && <iframe title="mapa" loading="lazy" className="w-full h-40 rounded-xl border border-black/5 mb-3" src={"https://www.google.com/maps?q="+encodeURIComponent(c.zone)+"&output=embed"}></iframe>}
          <div className="grid grid-cols-2 gap-3">
            <Field label="WhatsApp"><input value={c.whatsapp} onChange={e=>set({...c,whatsapp:e.target.value})} placeholder="54920..." className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm" /></Field>
            <Field label="Teléfono"><input value={c.phone} onChange={e=>set({...c,phone:e.target.value})} className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm" /></Field>
          </div>
          <Field label="Descripción"><textarea value={c.blurb} onChange={e=>set({...c,blurb:e.target.value})} rows={3} className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm resize-none" /></Field>
        </div>

        <div className="bg-white rounded-2xl border border-black/5 p-5">
          <h3 className="ff-display text-lg mb-3" style={{color:C.ink}}>Detalle</h3>
          <Field label="Categoría">
            <div className="flex flex-wrap gap-2">{CATS.map(k=><button key={k} onClick={()=>set({...c,category:k})} className={"rounded-full px-3 py-1.5 ff-body text-sm border "+(c.category===k?"text-white":"text-stone-600 border-stone-300")} style={c.category===k?{background:C.moss,borderColor:C.moss}:{}}>{k}</button>)}</div>
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Precio (0 = consultar)"><div className="flex items-center border border-stone-300 rounded-xl px-2"><span className="text-stone-400 text-sm">$</span><input type="number" value={c.price} onChange={e=>set({...c,price:+e.target.value})} className="w-full py-2 ff-body text-sm outline-none" /></div></Field>
            <Field label="Duración"><input value={c.duration} onChange={e=>set({...c,duration:e.target.value})} placeholder="Ej: 2 horas" className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm" /></Field>
          </div>
          <Field label="Horarios"><textarea value={c.schedule} onChange={e=>set({...c,schedule:e.target.value})} rows={2} placeholder="Ej: Todos los días de 9 a 18 hs" className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm resize-none" /></Field>
          <button onClick={()=>set({...c,reserva:!c.reserva})} className={"rounded-xl px-4 py-2.5 ff-body text-sm border w-full text-left mb-2 "+(c.reserva?"border-amber-300 text-amber-700 bg-amber-50":"border-stone-300 text-stone-600")}>{c.reserva?"📅 Con reserva":"🚶 Sin reserva (llegás y listo)"}</button>
          {c.reserva && <Field label="Cómo reservar"><textarea value={c.comoReservar} onChange={e=>set({...c,comoReservar:e.target.value})} rows={2} className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm resize-none" /></Field>}
        </div>

        <div className="bg-white rounded-2xl border border-black/5 p-5">
          <h3 className="ff-display text-lg mb-2" style={{color:C.ink}}>✓ Qué incluye</h3>
          <div className="space-y-2">
            {c.incluye.map((v,i)=>(
              <div key={i} className="flex items-center gap-2"><input value={v} onChange={e=>set({...c,incluye:c.incluye.map((x,j)=>j===i?e.target.value:x)})} placeholder="Ej: Guía, equipo, refrigerio" className="flex-1 border border-stone-300 rounded-lg px-2 py-1.5 ff-body text-sm" /><button onClick={()=>set({...c,incluye:c.incluye.filter((_,j)=>j!==i)})} className="text-rose-500">🗑️</button></div>
            ))}
          </div>
          <button onClick={()=>set({...c,incluye:[...c.incluye,""]})} className="mt-3 ff-body text-sm font-semibold" style={{color:C.clay}}>+ Agregar ítem</button>
        </div>

        <div className="bg-white rounded-2xl border border-black/5 p-5">
          <h3 className="ff-display text-lg mb-2" style={{color:C.ink}}>🎬 Videos</h3>
          <div className="space-y-2">
            {c.videos.map((v,i)=>(<div key={i} className="flex items-center gap-2"><input value={v} onChange={e=>set({...c,videos:c.videos.map((x,j)=>j===i?e.target.value:x)})} placeholder="Link de YouTube/Instagram" className="flex-1 border border-stone-300 rounded-lg px-2 py-1.5 ff-body text-sm" /><button onClick={()=>set({...c,videos:c.videos.filter((_,j)=>j!==i)})} className="text-rose-500">🗑️</button></div>))}
          </div>
          <button onClick={()=>set({...c,videos:[...c.videos,""]})} className="mt-3 ff-body text-sm font-semibold" style={{color:C.clay}}>+ Agregar video</button>
        </div>

        <div className="bg-white rounded-2xl border border-black/5 p-5">
          <h3 className="ff-display text-lg mb-3" style={{color:C.ink}}>Fotos</h3>
          <span className="ff-body text-xs font-semibold text-stone-500 uppercase tracking-wide">Banner</span>
          <div className="mt-1 mb-3">{c.banner ? <div className="relative inline-block w-full"><img src={IMG(c.banner)} className="w-full h-28 rounded-xl object-cover bg-stone-200" /><button onClick={()=>{ delFromStorage(c.banner); set({...c,banner:""}); }} className="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-rose-500 text-white text-xs grid place-items-center">✕</button></div> : <label className="block"><span className="inline-flex cursor-pointer rounded-xl px-4 py-2.5 ff-body text-sm font-semibold text-white" style={{background:C.clay,opacity:uploading?0.6:1}}>{uploading?"Subiendo…":"🖼️ Subir banner"}</span><input type="file" accept="image/*" onChange={uploadBanner} disabled={uploading} className="hidden" /></label>}</div>
          <span className="ff-body text-xs font-semibold text-stone-500 uppercase tracking-wide">Galería</span>
          {c.photos.length>0 && <div className="grid grid-cols-3 gap-2 my-2">{c.photos.map((p,i)=><div key={i} className="relative"><img src={IMG(p)} className="w-full h-20 rounded-lg object-cover bg-stone-200" /><button onClick={()=>{ delFromStorage(p); set({...c,photos:c.photos.filter((_,j)=>j!==i)}); }} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-rose-500 text-white text-xs grid place-items-center">✕</button></div>)}</div>}
          {c.photos.length>=15
            ? <p className="ff-body text-sm text-stone-500 mt-2">Llegaste al máximo de 15 fotos. Borrá alguna para subir otra.</p>
            : <label className="block mt-2"><span className="inline-flex cursor-pointer rounded-xl px-4 py-2.5 ff-body text-sm font-semibold text-white" style={{background:C.moss,opacity:uploading?0.6:1}}>{uploading?"Subiendo…":"📷 Subir fotos ("+c.photos.length+"/15)"}</span><input type="file" accept="image/*" multiple onChange={uploadGallery} disabled={uploading} className="hidden" /></label>}
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-black/5 p-5 h-fit">
        <h3 className="ff-display text-lg mb-3" style={{color:C.ink}}>Vista previa</h3>
        <div className="rounded-2xl overflow-hidden border border-black/5">
          <div className="aspect-[16/10] bg-stone-200">{c.banner && <img src={IMG(c.banner)} className="w-full h-full object-cover" />}</div>
          <div className="p-4">
            {c.category && <span className="ff-body text-[11px] uppercase tracking-widest font-semibold" style={{color:C.clay}}>{c.category}</span>}
            <h4 className="ff-display text-xl" style={{color:C.ink}}>{c.name||"Nombre de la actividad"}</h4>
            <p className="ff-body text-sm text-stone-500 mt-1">{c.duration && "⏱ "+c.duration+" · "}{c.price>0?"desde $"+c.price.toLocaleString("es-AR"):"Consultar precio"}</p>
            <p className="ff-body text-sm text-stone-500 mt-2">{c.blurb}</p>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProfileBar({ profile }) {
  const [logo, setLogo] = useState("");
  const [upLogo, setUpLogo] = useState(false);
  if(!profile) return null;
  const shown = logo || profile.logo || "";
  const onLogo = async (e) => {
    const f0=(e.target.files||[])[0]; if(!f0) return; setUpLogo(true);
    const f=await compressToWebp(f0, 512, 0.85);
    const path="logo-"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9.]/g,"_");
    const { error } = await db.storage.from("fotos").upload(path, f);
    if(!error){ const { data } = db.storage.from("fotos").getPublicUrl(path); const url=data.publicUrl; const oldL=logo||profile.logo; if(profile._id) await db.from("profiles").update({logo:url}).eq("id", profile._id); if(oldL) delFromStorage(oldL); setLogo(url); } else { alert("No se pudo subir el logo."); }
    setUpLogo(false); e.target.value="";
  };
  const RUBRO = { hospedaje:"Hospedaje", gastronomia:"Gastronomía", actividad:"Actividad", admin:"Admin" }[profile.role] || profile.role || "";
  const fmt = (s) => s ? s.split("-").reverse().join("/") : "—";
  let st = { label:"Pago sin registrar", bg:"#ececec", fg:"#777" };
  if(profile.next_due){ const t=new Date(); t.setHours(0,0,0,0); const d=new Date(profile.next_due+"T00:00:00"); const days=Math.round((d-t)/86400000);
    st = days<0 ? {label:"Pago vencido", bg:"#fde8e8", fg:"#b23b3b"} : days<=7 ? {label:"Vence en "+days+" días", bg:"#fdf0d8", fg:"#9a6b1e"} : {label:"Al día", bg:"#e7efe3", fg:C.moss}; }
  const initial = (profile.operator||profile._email||"?").trim().charAt(0).toUpperCase();
  const lim = profile.max_listings;
  return (
    <div className="bg-white rounded-2xl border border-black/5 p-4 mb-5 flex flex-wrap items-center gap-4">
      <label className="relative shrink-0 cursor-pointer" title="Subir / cambiar logo">
        <div className="w-12 h-12 rounded-full grid place-items-center text-white ff-display text-lg overflow-hidden" style={{background:C.moss}}>{shown ? <img src={shown} className="w-full h-full object-cover" /> : initial}</div>
        <span className="absolute -bottom-1 -right-1 w-5 h-5 rounded-full grid place-items-center text-[10px] text-white border-2 border-white" style={{background:C.clay}}>{upLogo?"…":"✎"}</span>
        <input type="file" accept="image/*" onChange={onLogo} disabled={upLogo} className="hidden" />
      </label>
      <div className="min-w-0">
        <div className="ff-display text-lg leading-tight" style={{color:C.ink}}>{profile.operator||"Tu cuenta"}</div>
        <div className="ff-body text-xs text-stone-500">{profile._email} · {RUBRO} · {lim!=null?(lim+" publicación"+(lim===1?"":"es")):"sin tope"}</div>
      </div>
      <div className="sm:ml-auto flex items-center gap-4 flex-wrap">
        <div><div className="ff-body text-[11px] text-stone-500">Último pago</div><div className="ff-body text-sm" style={{color:C.ink}}>{fmt(profile.last_paid)}</div></div>
        <div><div className="ff-body text-[11px] text-stone-500">Próximo pago</div><div className="ff-body text-sm" style={{color:C.ink}}>{fmt(profile.next_due)}</div></div>
        <span className="ff-body text-xs rounded-full px-2.5 py-1" style={{background:st.bg,color:st.fg}}>{st.label}</span>
      </div>
    </div>
  );
}

function App() {
  const [session,setSession]=useState(null), [ready,setReady]=useState(false);
  const [email,setEmail]=useState(""), [pass,setPass]=useState(""), [authErr,setAuthErr]=useState("");
  const [list,setList]=useState([]), [editing,setEditing]=useState(null), [saving,setSaving]=useState(false), [toast,setToast]=useState(""), [profile,setProfile]=useState(null), [soloEditor,setSoloEditor]=useState(false), [views,setViews]=useState({});
  useEffect(()=>{ db.auth.getSession().then(({data})=>{setSession(data.session);setReady(true);}); const {data:sub}=db.auth.onAuthStateChange((_e,s)=>setSession(s)); return ()=>sub.subscription.unsubscribe(); },[]);
  const load=async()=>{ const {data:{user}}=await db.auth.getUser(); const {data:prof}=await db.from("profiles").select("role,operator,max_listings,last_paid,next_due,logo").eq("id",user.id).maybeSingle(); setProfile(prof ? {...prof, _email:user.email, _id:user.id} : null); const isAdmin=prof&&prof.role==="admin"; if(prof&&!isAdmin){ const dest={hospedaje:"panel.html",gastronomia:"gastro-panel.html",actividad:"act-panel.html"}[prof.role]; if(dest&&dest!=="act-panel.html"){ window.location.replace(dest); return; } } const res=isAdmin?await db.from("activities").select("*").order("created_at",{ascending:false}):await db.from("activities").select("*").eq("operator",(prof&&prof.operator)||"___none___").order("created_at",{ascending:false}); const rows=res.data?res.data.map(fromRow):[]; setList(rows); db.rpc("my_views").then(({data})=>{ const vm={}; (data||[]).forEach(r=>{ if(r.rubro==="actividad") vm[r.slug]=r.total; }); setViews(vm); }); const lim=prof?prof.max_listings:null; if(lim===1&&!isAdmin){ setSoloEditor(true); setEditing(rows[0]?rows[0]:{...EMPTY,operator:(prof&&prof.operator)||""}); } else setSoloEditor(false); };
  useEffect(()=>{ if(session) load(); },[session]);
  const flash=(m)=>{ setToast(m); setTimeout(()=>setToast(""),2500); };
  const login=async()=>{ setAuthErr(""); const {error}=await db.auth.signInWithPassword({email,password:pass}); if(error) setAuthErr("No pudimos entrar. Revisá email y contraseña."); };
  const save=async()=>{ if(!editing.name){flash("Poné un nombre");return;} setSaving(true); const {data,error}=await db.from("activities").upsert(toRow(editing)).select(); setSaving(false); if(error){flash("Error al guardar");return;} flash("Guardado ✓"); if(soloEditor){ if(data&&data[0]) setEditing(fromRow(data[0])); } else { setEditing(null); load(); } };
  const remove=async(id)=>{ if(!confirm("¿Borrar esta actividad?"))return; await db.from("activities").delete().eq("id",id); load(); };
  if(!ready) return <div className="min-h-screen grid place-items-center ff-body" style={{background:C.paper,color:C.moss}}>Cargando…</div>;
  if(!session) return (
    <div className="min-h-screen grid place-items-center ff-body px-5" style={{background:C.paper}}>
      <div className="w-full max-w-sm bg-white rounded-2xl border border-black/5 p-7">
        <div className="text-center mb-5"><div className="text-3xl">🧭</div><h1 className="ff-display text-2xl mt-1" style={{color:C.ink}}>Panel Actividades</h1></div>
        <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" className="w-full border border-stone-300 rounded-xl px-3 py-2.5 ff-body text-sm mb-2" />
        <input value={pass} onChange={e=>setPass(e.target.value)} type="password" placeholder="Contraseña" onKeyDown={e=>{if(e.key==="Enter")login();}} className="w-full border border-stone-300 rounded-xl px-3 py-2.5 ff-body text-sm mb-3" />
        {authErr && <p className="ff-body text-sm text-rose-600 mb-3">{authErr}</p>}
        <button onClick={login} className="w-full text-white rounded-xl py-3 ff-body font-semibold" style={{background:C.moss}}>Entrar</button>
      </div>
    </div>
  );
  const lim=profile?profile.max_listings:null; const atLimit=lim!=null&&list.length>=lim&&!(profile&&profile.role==="admin"); const verSitio=editing&&editing.slug?"actividad.html?slug="+editing.slug:null;
  return (
    <div className="min-h-screen ff-body" style={{background:C.paper}}>
      <header className="sticky top-0 z-30 border-b border-black/5" style={{background:C.paper}}>
        <div className="max-w-5xl mx-auto px-5 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2.5"><div className="w-9 h-9 rounded-xl grid place-items-center text-xl" style={{background:C.moss}}>🧭</div><div><div className="ff-display text-lg leading-none" style={{color:C.ink}}>Actividades</div><div className="ff-body text-[11px] text-stone-500">Visitando Tandil</div></div></div>
          <div className="flex items-center gap-2">
            <a href="ayuda.html?rubro=actividad" target="_blank" rel="noreferrer" title="¿Cómo cargar? Ayuda" className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">❓ Ayuda</a>
            {(editing||soloEditor) ? (<>
              {verSitio && <a href={verSitio} target="_blank" rel="noreferrer" className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">👁️ Ver sitio</a>}
              {!soloEditor && <button onClick={()=>setEditing(null)} className="rounded-full px-4 py-2 ff-body text-sm border border-stone-300 text-stone-600">Cancelar</button>}
              <button onClick={save} disabled={saving} className="rounded-full px-4 py-2 ff-body text-sm font-semibold text-white disabled:opacity-50" style={{background:C.clay}}>{saving?"Guardando…":"Guardar"}</button>
              {soloEditor && <button onClick={()=>db.auth.signOut()} className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">Salir</button>}
            </>) : (<>
              {!atLimit && <button onClick={()=>setEditing({...EMPTY, operator:(profile&&profile.operator)||""})} className="rounded-full px-4 py-2 ff-body text-sm font-semibold text-white" style={{background:C.clay}}>+ Nueva</button>}
              <button onClick={()=>db.auth.signOut()} className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">Salir</button>
            </>)}
          </div>
        </div>
        {toast && <div className="text-center ff-body text-xs py-1" style={{background:"#e7efe3",color:C.moss}}>{toast}</div>}
      </header>
      <div className="max-w-5xl mx-auto px-5 py-6">
        <ProfileBar profile={profile} />
        {(editing||soloEditor) ? (editing ? <Editor c={editing} set={setEditing} /> : <p className="ff-body text-stone-500 text-center py-16">Cargando…</p>)
        : list.length===0 ? <div className="text-center py-16"><p className="ff-display text-xl mb-1" style={{color:C.ink}}>Sin actividades todavía</p><p className="ff-body text-stone-500">Cargá la primera con “+ Nueva”.</p></div>
        : <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">{list.map(c=>(
            <div key={c.id} className="bg-white rounded-2xl border border-black/5 overflow-hidden">
              <div className="aspect-[16/10] bg-stone-200">{(c.banner||c.photos[0]) && <img src={IMG(c.banner||c.photos[0])} className="w-full h-full object-cover" />}</div>
              <div className="p-4"><h3 className="ff-display text-lg" style={{color:C.ink}}>{c.name}</h3><p className="ff-body text-sm text-stone-500">{c.category}{c.duration?" · "+c.duration:""}</p><p className="ff-body text-xs text-stone-400 mt-1">👁 {views[c.slug]||0} visitas</p>
                <div className="flex gap-2 mt-3"><button onClick={()=>setEditing(c)} className="flex-1 rounded-lg py-2 ff-body text-sm font-semibold text-white" style={{background:C.moss}}>Editar</button><a href={c.operator ? "operador.html?op="+encodeURIComponent(c.operator)+"&rubro=actividad" : "actividad.html?slug="+c.slug} target="_blank" rel="noreferrer" className="rounded-lg px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">👁️ Ver</a><button onClick={()=>remove(c.id)} className="rounded-lg px-3 py-2 ff-body text-sm border border-stone-300 text-rose-500">🗑️</button></div>
              </div>
            </div>
          ))}</div>}
      </div>
      <footer className="py-8 text-center ff-body text-sm" style={{background:C.moss,color:"rgba(255,255,255,0.7)"}}>Actividades · Visitando Tandil · Creado por Brote 🌱</footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
