body{margin:0}

/* ═══════════════════════════════════════════════════════════
   ESTILO DEFINITIVO · versión 3 + sábana B
   Va último: manda sobre todo lo anterior.
   ═══════════════════════════════════════════════════════════ */
:root{
  --monte:#2E3521; --liquen:#63653F; --arena:#DFCCAE; --ladrillo:#9C5634;
  --crudo:#FBF7E8; --papel:#F4EEDC; --tinta:#23261A; --suave:#6A6455;
  --linea:rgba(35,38,26,.10); --punt:rgba(35,38,26,.10);
  --r:24px; --rm:18px; --rs:14px; --pill:999px;
  --sombra:0 10px 30px rgba(35,38,26,.07);
  --sombra2:0 18px 44px rgba(35,38,26,.12);
  --sans:'Familjen Grotesk',system-ui,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  --display:'Instrument Serif',Georgia,serif;
  --mano:'Familjen Grotesk',system-ui,sans-serif;
}
/* fuera la textura de papel */
.worn::before,.worn::after,body::after,body::before,#root::after,.fondo{display:none !important}

/* ── tres tonos y nada más ── */
body{background:var(--crudo) !important;color:var(--tinta) !important;
  font-family:var(--sans) !important;font-size:16px !important;line-height:1.6 !important}
.pre{background:rgba(46,53,33,.94) !important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  color:#C6CDBD !important;position:fixed !important;top:0 !important;left:0;right:0;z-index:95 !important;
  font-size:12.5px !important;letter-spacing:0 !important;text-transform:none !important}
.pre a{color:#E2E8D8 !important}
.pdot{background:var(--arena) !important;width:6px !important;height:6px !important}
header,header.vt{background:rgba(244,238,220,.85) !important;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--linea) !important;position:sticky !important;
  top:var(--preH,40px) !important;z-index:60 !important}
body{padding-top:var(--preH,40px)}
.topbar{position:static !important}
.topbar .pre{position:fixed !important}
.sabana,.cards,.gA,.strip,.ig,.cerca,.filters,.filtros,.filtrosbar,.listwrap{background:transparent !important}
footer{background:var(--monte) !important;color:#C6CDBD !important;border-top:0 !important}
footer h5{color:#9AA48D !important}
footer a,footer button{color:#DDE3D3 !important}
footer p,.next,.fnote{color:#9AA48D !important}
footer .wm,footer .wm span{color:#EDF0E6 !important}
footer .wm span{color:#9AA48D !important}
.fnote{border-top:1px solid rgba(237,240,230,.18) !important}
footer svg{stroke:#EDF0E6 !important}
footer svg circle{fill:#EDF0E6 !important}

/* ── tipografía ── */
h1,h2,h3,h4,.disp,.titulo,.wm,.etiqueta h3,.card h3,.tile h4,.mom b,.strip b,.day h4,
.tira h3,.desde,.datos b,.precio,.ficha .precio,.aa,.big,.type,.fr,.carta h3,.ptitle h1{
  font-family:var(--serif) !important;font-weight:400 !important;letter-spacing:-.015em !important}
h1{line-height:1.02 !important}
.wm{text-transform:none !important;letter-spacing:-.02em !important;font-size:17px !important;
  font-family:var(--sans) !important;font-weight:600 !important}
.wm span,.wm .sub{font-family:var(--sans) !important;letter-spacing:.18em !important;font-size:9px !important;
  color:var(--suave) !important;font-weight:400 !important}
.mano{font-family:var(--sans) !important;color:var(--suave) !important;font-style:italic}
.rot,.kick,.meta,.epi,.aside,.cat,.k,.z,.st,.ver,.eyebrow,.idx,.num,.cuenta,.count{
  text-transform:none !important;letter-spacing:0 !important;font-size:13px !important}
.eyebrow,.kick{color:var(--ladrillo) !important;font-weight:600 !important;font-size:13px !important}
.eyebrow i,.eyebrow span,.kicker span{display:none !important}
.marco > .num,.shead .idx{display:none !important}
.marco{grid-template-columns:1fr !important;gap:0 !important}
/* el punto verde antes de cada título */
h2::before,.titulo::before{content:"" !important;display:inline-block;width:8px;height:8px;
  border-radius:50%;background:var(--monte);margin-right:12px;vertical-align:middle;position:static}

/* ── botones y campos: pastillas ── */
.solid,.ghost,.sel,.pill,.send,.mail,.wsp,.ver,.btn,.chip,.mom,.cta{
  border-radius:var(--pill) !important;text-transform:none !important;letter-spacing:0 !important;
  font-size:14px !important;font-weight:500 !important}
.solid{background:var(--ladrillo) !important;border-color:var(--ladrillo) !important;color:#fff !important;
  padding:12px 22px !important}
.ghost,.sel,.pill{background:rgba(255,255,255,.62) !important;border:1px solid var(--linea) !important;
  color:var(--tinta) !important;padding:11px 18px !important;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sel.on,.pill.on{background:var(--monte) !important;border-color:var(--monte) !important;color:#EDF0E6 !important}
.send{background:var(--monte) !important;color:#EDF0E6 !important;border-radius:var(--pill) !important}
.field input,.field select,.field textarea,input,select,textarea{
  border-radius:var(--rs) !important;border:1px solid var(--linea) !important;
  background:rgba(251,247,232,.8) !important;font-family:var(--sans) !important}

/* ── superficies de vidrio ── */
.form,.calbox,.ficha,.plan,.day,.datos,.indice ol,.momentos,.mom,.carta,.panel,.amenbox,
.modalbox,.popbox,.reservar,.aviso,.nodisp,.horarios,.bloque{
  background:rgba(255,255,255,.72) !important;border:1px solid rgba(255,255,255,.6) !important;
  border-radius:var(--r) !important;box-shadow:var(--sombra) !important;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.carta{background:var(--monte) !important;border:0 !important;color:#DDE3D3 !important}
.carta h3{color:#EDF0E6 !important}
.carta .btn{background:var(--arena) !important;color:var(--monte) !important;border:0 !important}
.spread img,.par img,.tercias img,.galeria img,.videos iframe,.mapa,.tile,.mini .ph,
.apertura,.card figure,.unidad .ph{border-radius:var(--rm) !important;overflow:hidden}
.mapa{filter:grayscale(.25) sepia(.05) !important}

/* ── líneas: sólidas y finas ── */
.fill,.filas div,.comod div,.item,.stops li,.indice li,.horarios div,.epi,.price,.pie,
.shead,.sh,.head{border-style:solid !important;border-color:var(--linea) !important}
.shead,.marco .titulo{border-bottom:1px solid var(--linea) !important;padding-bottom:12px !important}

/* ═══════════ SÁBANA · OPCIÓN B ═══════════ */
.cards,.gA{display:grid !important;grid-template-columns:repeat(3,1fr) !important;gap:26px !important;
  padding:8px 0 10px !important;margin:0 !important;clip-path:none !important;box-shadow:none !important}
.card,.pA{background:transparent !important;border:0 !important;box-shadow:none !important;
  padding:0 0 44px 0 !important;position:relative !important;
  -webkit-backdrop-filter:none !important;backdrop-filter:none !important}
.card:hover,.pA:hover{transform:none !important;box-shadow:none !important;border-color:transparent !important}
.card .ph,.pA .ph,.card figure{aspect-ratio:4/5 !important;height:auto !important;
  border-radius:var(--r) !important;overflow:hidden;box-shadow:var(--sombra) !important;position:relative}
.card:hover .ph,.pA:hover .ph{box-shadow:var(--sombra2) !important}
.card .ph img,.pA .ph img{width:100% !important;height:100% !important;object-fit:cover !important}
/* la hojita de vidrio, montada y sobresaliendo */
.etiqueta,.card .body{
  position:absolute !important;left:16px !important;right:34px !important;bottom:0 !important;
  z-index:4;background:rgba(255,255,255,.74) !important;
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid rgba(255,255,255,.6) !important;border-radius:var(--rm) !important;
  padding:16px 18px !important;box-shadow:0 14px 34px rgba(35,38,26,.16) !important;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s}
.card:hover .body,.pA:hover .etiqueta{transform:translateY(-6px);background:rgba(255,255,255,.88) !important}
.etiqueta h3,.card .body h3{font-size:19px !important;margin:0 0 2px !important}
.etiqueta .z,.card .body .meta{font-size:12.5px !important;color:var(--suave) !important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etiqueta .pie,.card .price{margin-top:12px !important;padding-top:11px !important;
  border-top:1px solid var(--linea) !important;border-bottom:0 !important}
.card .price b,.etiqueta .pr{font-family:var(--sans) !important;font-weight:600 !important;
  font-size:18px !important;letter-spacing:-.02em !important}
.card .price em,.etiqueta .ver{color:var(--ladrillo) !important;font-weight:500 !important;font-size:13.5px !important}
/* las etiquetas blancas sobre la foto */
.chips{top:12px !important;left:12px !important;flex-direction:row !important;flex-wrap:wrap;gap:6px !important}
.chips .chip,.card .chips .chip{background:rgba(255,255,255,.8) !important;border-radius:var(--pill) !important;
  padding:6px 12px !important;font-size:11.5px !important;font-weight:500 !important;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:0 !important;margin:0 !important;
  text-transform:none !important;letter-spacing:0 !important}

/* ── filtros pegados ── */
.filters,.filtros{position:sticky !important;top:calc(var(--preH,40px) + 66px) !important;z-index:50 !important;
  background:rgba(251,247,232,.9) !important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:14px 0 12px !important;border-bottom:1px solid var(--linea) !important;
  border-top:0 !important;box-shadow:none !important;display:flex !important;gap:9px !important;
  overflow-x:auto;flex-wrap:nowrap !important;scrollbar-width:none}
.filters::-webkit-scrollbar,.filtros::-webkit-scrollbar{display:none}
.filters .sel,.filtros .sel{flex:0 0 auto !important}
.count,.cuenta{margin-left:auto !important;align-self:center;flex:0 0 auto}

/* ── portada ── */
.hero{border-radius:0 !important}
.hero .bg,.hero .bg img,.hero .bg video{border-radius:0 !important}
.hero .bg::after{background:linear-gradient(100deg,rgba(24,28,18,.40) 0%,rgba(24,28,18,.06) 55%,rgba(24,28,18,.32) 100%) !important}
.sheet{background:rgba(255,255,255,.68) !important;border:1px solid rgba(255,255,255,.55) !important;
  border-radius:var(--r) !important;-webkit-backdrop-filter:blur(22px) saturate(1.3);
  backdrop-filter:blur(22px) saturate(1.3);box-shadow:var(--sombra2) !important;
  padding:30px 32px 28px !important;max-width:480px !important}
.sheet h1{font-size:clamp(32px,4vw,46px) !important}
.sheet .lede{font-size:15.5px !important;color:var(--suave) !important}
.strip button{background:rgba(255,255,255,.7) !important;border:1px solid rgba(255,255,255,.6) !important;
  border-radius:var(--rm) !important;box-shadow:var(--sombra) !important;margin:0 !important}
.strip .in{gap:14px !important;padding-top:18px !important;padding-bottom:18px !important}
.strip{border-bottom:0 !important}

/* ── mosaico y carruseles ── */
.mosaic{gap:14px !important}
.mini{display:flex !important;gap:16px !important;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;padding-bottom:8px}
.mini::-webkit-scrollbar{display:none}
.mini > a{flex:0 0 250px;scroll-snap-align:start;background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.6);border-radius:var(--rm);padding:8px;box-shadow:var(--sombra)}
.mini > a:hover{transform:translateY(-3px);box-shadow:var(--sombra2)}
.mini h4{margin:11px 8px 0 !important;font-size:17px !important}
.mini p{margin:2px 8px 10px !important}

/* ── barra de abajo ── */
.appbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:85;
  background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  backdrop-filter:blur(20px) saturate(1.2);border:1px solid rgba(255,255,255,.7);
  border-radius:28px;box-shadow:0 14px 40px rgba(35,38,26,.18);
  display:grid;grid-template-columns:repeat(5,1fr);padding:10px 8px;
  width:calc(100% - 32px);max-width:520px}
.appbar a{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;
  font-size:11.5px;color:var(--suave);text-decoration:none;border-radius:16px}
.appbar a.on{color:var(--ladrillo);font-weight:600}
.appbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){ .appbar{display:none} }

/* ══════════ CELULAR ══════════ */
@media(max-width:900px){
  .nav{display:none !important}
  .burger{display:none !important}
  body{padding-bottom:100px}
  .acts .ghost{display:none !important}
}
@media(max-width:760px){
  .in{padding-left:20px !important;padding-right:20px !important}
  .pre{position:sticky !important}
  body{padding-top:0}
  header,header.vt{position:static !important;background:transparent !important;border-bottom:0 !important}
  .hbar{padding:14px 0 4px !important;justify-content:center}
  .acts{display:none !important}
  .pre .der,.pre .loc{display:none}
  .pre .in{justify-content:center}
  .hero{display:block !important;position:relative !important;min-height:0 !important}
  .hero .bg{position:absolute !important;inset:0 !important;height:100% !important}
  .hgrid{display:block !important;padding:64px 0 40px !important}
  .sheet{max-width:none !important;margin:0 !important;padding:24px 20px 22px !important}
  .sheet h1{font-size:31px !important}
  .heroctas{display:grid !important;grid-template-columns:1fr !important;gap:9px !important}
  .heroctas .solid,.heroctas .ghost{text-align:center;padding:14px !important}
  .strip .in{grid-template-columns:1fr !important;gap:10px !important}
  .cards,.gA{grid-template-columns:1fr !important;gap:22px !important}
  .card .ph,.pA .ph{aspect-ratio:4/3 !important}
  .etiqueta,.card .body{left:14px !important;right:22px !important}
  .card,.pA{padding-bottom:38px !important}
  .filters,.filtros{top:0 !important;padding-left:20px !important;padding-right:20px !important;
    margin-left:-20px !important;margin-right:-20px !important}
  .mosaic{grid-template-columns:1fr 1fr !important;grid-auto-rows:auto !important;padding:0 20px !important}
  .mosaic .tile{min-height:150px}
  .momentos,.plan,.reserva,.comod,.videos,.par,.tercias,.consulta,.f2,.fgrid{grid-template-columns:1fr !important}
  .apertura{margin:0 20px !important;height:44vh !important;min-height:250px !important}
  .mini > a{flex:0 0 74%}
  section{padding-top:40px !important;padding-bottom:40px !important}
}
</style>

// Comprime y convierte a WebP en el navegador, ANTES de subir. Si algo falla, sube el original.
const compressToWebp = async (file, maxDim=1600, quality=0.82) => {
  try {
    if(!file || (file.type||"").slice(0,6)!=="image/") return file;
    let bmp=null, imgEl=null, iw=0, ih=0;
    try { bmp = await createImageBitmap(file, { imageOrientation:"from-image" }); iw=bmp.width; ih=bmp.height; }
    catch(_) {
      const url=URL.createObjectURL(file);
      imgEl = await new Promise((res)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=url; });
      URL.revokeObjectURL(url);
      if(!imgEl) return file; iw=imgEl.naturalWidth; ih=imgEl.naturalHeight;
    }
    if(!iw || !ih) return file;
    const scale=Math.min(1, maxDim/Math.max(iw,ih));
    const w=Math.round(iw*scale), h=Math.round(ih*scale);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(bmp||imgEl, 0, 0, w, h);
    if(bmp && bmp.close) bmp.close();
    const blob = await new Promise((res)=> cv.toBlob(res, "image/webp", quality));
    if(!blob || blob.size>=file.size) return file;
    return new File([blob], (file.name||"foto").replace(/\.[^.]+$/,"")+".webp", { type:"image/webp" });
  } catch(_) { return file; }
};

// Los datos generales de huéspedes/dormitorios/baños ya no se cargan a mano:
// se calculan como el máximo de las unidades, para que el buscador y las fichas públicas sigan filtrando bien.
const maxDeUnidades = (units, k, fallback) => {
  const vals = (units||[]).map(u=>Number(u&&u[k])||0).filter(n=>n>0);
  return vals.length ? Math.max(...vals) : (Number(fallback)||1);
};
const toRow = (c) => { const r = { slug: c.slug || slugify(c.name), name:c.name, operator:c.operator, zone:c.zone, whatsapp:c.whatsapp, blurb:c.blurb, capacity:maxDeUnidades(c.units,"capacity",c.capacity), bedrooms:maxDeUnidades(c.units,"bedrooms",c.bedrooms), bathrooms:maxDeUnidades(c.units,"bathrooms",c.bathrooms), price:c.price, weekend_price:c.weekendPrice, amenities:c.amenities, pet_friendly:c.petFriendly, promo_text:c.promoText, promos:c.promos, blocked:c.blocked, overrides:c.overrides, units:c.units, videos:c.videos, banner:c.banner, photos:c.photos, ical_urls:c.ical_urls||[], email:c.email, min_nights:c.minNights||1, type:c.type||null }; if (c.id) r.id = c.id; return r; };

// ── Reservas ────────────────────────────────────────────────
// Las noches de una estadía: incluye la entrada, NO incluye el día de salida.
const nightsBetween = (a,b) => {
  const out=[]; if(!a) return out;
  const end = b ? parseD(b) : addDay(parseD(a),1);
  let d = parseD(a);
  let guard = 0;
  while(d < end && guard < 400){ out.push(iso(d)); d = addDay(d,1); guard++; }
  return out;
};
const nightsCount = (a,b) => nightsBetween(a,b).length;
const dmy = (s) => s ? s.split("-").reverse().slice(0,2).join("/") : "—";
const dmyLong = (s) => { if(!s) return "—"; const d=parseD(s); return DOW[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3).toLowerCase(); };
const RES_EMPTY = { slug:"", unit:"", guest_name:"", guest_phone:"", guest_email:"", people:2, start_date:"", end_date:"", status:"confirmada", total:0, deposit:0, channel:"Directo", notes:"" };

const uKey = (s) => s || "*";
// Vuelve a armar los días ocupados de cada unidad: los que bloqueó el operador a mano + los de las reservas.
const recalcUnidades = (cab, reservasDelSlug) => (cab.units||[]).map((u,i)=>{
  const manual = u.blockedManual || u.blocked || [];
  const nombre = u.name || ("Cabaña "+(i+1));
  const porReserva = [];
  reservasDelSlug.forEach(r=>{
    if(r.status==="cancelada") return;
    if(!r.unit || r.unit===nombre || r.unit===u.name) porReserva.push(...nightsBetween(r.start_date, r.end_date));
  });
  const res = [...new Set(porReserva)];
  return { ...u, blockedManual:manual, resBlocked:res, blocked:[...new Set([...manual, ...res])] };
});

function Calendar({ cursor, setCursor, blocked, locked, selectedDay, onDay, priceOf }) {
  const lock = locked||[];
  const y=cursor.getFullYear(), m=cursor.getMonth();
  const startDow=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const cells=[]; for(let i=0;i<startDow;i++) cells.push(null); for(let d=1;d<=dim;d++) cells.push(d);
  const canPrev = new Date(y,m,1) > new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  return (
    <div className="select-none">
      <div className="flex items-center justify-between mb-3">
        <button disabled={!canPrev} onClick={()=>setCursor(new Date(y,m-1,1))} className="px-2 py-1 rounded-lg hover:bg-black/5 disabled:opacity-30">‹</button>
        <span className="ff-display text-lg" style={{color:C.ink}}>{MONTHS[m]} {y}</span>
        <button onClick={()=>setCursor(new Date(y,m+1,1))} className="px-2 py-1 rounded-lg hover:bg-black/5">›</button>
      </div>
      <div className="grid grid-cols-7 gap-1 text-center mb-1">{DOW.map(d=><div key={d} className="ff-body text-[11px] font-semibold text-stone-400">{d}</div>)}</div>
      <div className="grid grid-cols-7 gap-1">
        {cells.map((d,i)=>{
          if(!d) return <div key={i} />;
          const day=`${y}-${pad(m+1)}-${pad(d)}`;
          const past=parseD(day)<TODAY;
          const isRes=lock.includes(day);
          const isBlocked=blocked.includes(day);
          const isSel=day===selectedDay;
          let cls="ff-body rounded-lg flex flex-col items-center justify-center transition text-sm "+(priceOf?"h-12":"h-9")+" ";
          let style={};
          if(past) cls+="text-stone-300 line-through cursor-not-allowed";
          else if(isRes){ cls+="cursor-pointer"; style.background="#e7efe3"; style.color=C.moss; style.fontWeight=600; }
          else if(isBlocked) cls+="bg-rose-100 text-rose-500 cursor-pointer";
          else cls+="text-stone-700 cursor-pointer hover:bg-black/5";
          if(isSel) style.boxShadow=`0 0 0 2px ${C.clay}`;
          return (
            <button key={i} className={cls} style={style} disabled={past} title={isRes?"Reservado":""} onClick={()=>onDay(day,{past,isBlocked,isRes})}>
              <span>{d}</span>
              {priceOf && !past && <span className="text-[9px] leading-none mt-0.5 opacity-70">{kFmt(priceOf(day))}</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

          <button onClick={()=>set({...c,petFriendly:!c.petFriendly})} className={"rounded-xl px-4 py-2.5 ff-body text-sm border w-full text-left "+(c.petFriendly?"border-emerald-300 text-emerald-800 bg-emerald-50":"border-stone-300 text-stone-600")}>🐾 Pet friendly {c.petFriendly?"activado ✓":"desactivado"}</button>

        <div className="bg-white rounded-2xl border border-black/5 p-5">
          <h3 className="ff-display text-lg mb-2" style={{color:C.ink}}>🏷️ Promociones</h3>
          <Field label="Mensaje libre"><textarea value={c.promoText} onChange={e=>set({...c,promoText:e.target.value})} rows={2} placeholder="Ej: 2x1 de lunes a jueves · Mascota gratis" className="w-full border border-stone-300 rounded-xl px-3 py-2 ff-body text-sm resize-none" /></Field>
          <span className="ff-body text-xs font-semibold text-stone-500 uppercase tracking-wide">Descuentos por noches</span>
          <div className="space-y-2 mt-2">
            {c.promos.map((p,i)=>(
              <div key={i} className="flex items-center gap-2 ff-body text-sm">
                <span className="text-stone-500">Desde</span>
                <input type="number" value={p.min} onChange={e=>set({...c,promos:c.promos.map((x,j)=>j===i?{...x,min:+e.target.value}:x)})} className="w-14 border border-stone-300 rounded-lg px-2 py-1.5" />
                <span className="text-stone-500">noches</span>
                <input type="number" value={p.pct} onChange={e=>set({...c,promos:c.promos.map((x,j)=>j===i?{...x,pct:+e.target.value}:x)})} className="w-14 border border-stone-300 rounded-lg px-2 py-1.5" />

          <div className="mt-1 mb-3">

          <span className="ff-body text-xs font-semibold text-stone-500 uppercase tracking-wide">Galería (resto de las fotos)</span><p className="ff-body text-xs text-stone-400 mt-1 mb-1">Usá ◀ ▶ para ordenarlas. La nº1 se muestra primero.</p>
          {c.photos.length>0 && (
            <div className="grid grid-cols-3 gap-2 my-2">

                    <button disabled={i===0} onClick={()=>{ const a=[...c.photos]; const t=a[i-1]; a[i-1]=a[i]; a[i]=t; set({...c,photos:a}); }} className="w-6 h-6 rounded-full bg-black/55 text-white text-xs grid place-items-center disabled:opacity-30">◀</button>

        </div>

        <div className="bg-white rounded-2xl border border-black/5 p-5">
          <h3 className="ff-display text-lg mb-2" style={{color:C.ink}}>🎬 Videos</h3>
          <p className="ff-body text-sm text-stone-500 mb-1">Pegá el link de YouTube o Instagram del video (sin límite de peso).</p>
          <details className="mb-3">

              <p><b>YouTube (recomendado — se reproduce dentro de tu ficha):</b> entrá a youtube.com, tocá <b>Crear → Subir video</b> y elegí el archivo. En el paso de <b>Visibilidad</b>, si no querés que el video aparezca en las búsquedas de YouTube, elegí <b>“No listado”</b>: igual se va a ver embebido acá usando el link. Después abrí el video, tocá <b>Compartir</b>, copiá el enlace y pegalo arriba.</p>
              <p className="text-stone-500">Importante: <b>“Privado” NO sirve</b> (YouTube no permite mostrarlo fuera de tu cuenta). Para que no salga en búsquedas pero igual se vea en tu ficha, usá <b>“No listado”</b>.</p>
              <p><b>Instagram:</b> pegá el link de un reel de una cuenta <b>pública</b>. Solo se reproduce dentro de la ficha si la publicación es pública (las cuentas privadas no se pueden mostrar).</p>
            </div>
          </details>
          <div className="space-y-2">
            {(c.videos||[]).map((v,i)=>(
              <div key={i} className="flex items-center gap-2">
                <input value={v} onChange={e=>set({...c,videos:c.videos.map((x,j)=>j===i?e.target.value:x)})} placeholder="Link de YouTube/Instagram" className="flex-1 border border-stone-300 rounded-lg px-2 py-1.5 ff-body text-sm" />
                <button onClick={()=>set({...c,videos:c.videos.filter((_,j)=>j!==i)})} className="text-rose-500">🗑️</button>
              </div>
            ))}
          </div>
          <button onClick={()=>set({...c,videos:[...(c.videos||[]),""]})} className="mt-3 ff-body text-sm font-semibold" style={{color:C.clay}}>+ Agregar video</button>
        </div>
      </div>

      <div className="space-y-5 h-fit">
      <div className="bg-white rounded-2xl border border-black/5 p-5">
        <h3 className="ff-display text-lg mb-1" style={{color:C.ink}}>Disponibilidad y precios por cabaña</h3>
        <p className="ff-body text-xs text-stone-500 mb-3">Elegí una cabaña y cargá su precio y los días ocupados. Cada cabaña tiene su propio calendario.</p>
        {(c.units||[]).length===0 ? (
          <p className="ff-body text-sm text-stone-500 bg-stone-50 rounded-xl p-3">Primero agregá al menos una cabaña arriba.</p>
        ) : (()=>{ const k=Math.max(0,Math.min(calUnit,c.units.length-1)); const cu=c.units[k]; const setCU=(patch)=>set({...c,units:c.units.map((x,j)=>j===k?{...x,...patch}:x)}); const up=unitPrice(cu); return (
        <div>
          <div className="flex flex-wrap gap-2 mb-4">{c.units.map((u,ui)=>{const on=k===ui;return <button key={ui} onClick={()=>{setCalUnit(ui);setSelDay(null);}} className={"rounded-full px-3 py-1.5 ff-body text-sm border "+(on?"text-white":"text-stone-600 border-stone-300")} style={on?{background:C.moss,borderColor:C.moss}:{}}>{u.name||("Cabaña "+(ui+1))}</button>;})}</div>
          <div className="grid grid-cols-2 gap-3 mb-4">
            <Field label="Precio noche"><div className="flex items-center border border-stone-300 rounded-xl px-2"><span className="text-stone-400 text-sm">$</span><input type="number" value={cu.price==null?"":cu.price} onChange={e=>setCU({price:e.target.value===""?null:+e.target.value})} placeholder={String(c.price||0)} className="w-full py-2 ff-body text-sm outline-none" /></div></Field>
            <Field label="Precio finde"><div className="flex items-center border border-stone-300 rounded-xl px-2"><span className="text-stone-400 text-sm">$</span><input type="number" value={cu.weekendPrice==null?"":cu.weekendPrice} onChange={e=>setCU({weekendPrice:e.target.value===""?null:+e.target.value})} placeholder="igual" className="w-full py-2 ff-body text-sm outline-none" /></div></Field>
          </div>
          <div className="flex gap-2 mb-4">
            <button onClick={()=>{setMode("block");setSelDay(null);}} className={"flex-1 rounded-xl py-2 ff-body text-sm border "+(mode==="block"?"border-rose-300 text-rose-700 bg-rose-50":"border-stone-300 text-stone-600")}>🚫 Bloquear</button>
            <button onClick={()=>{setMode("price");setSelDay(null);}} className={"flex-1 rounded-xl py-2 ff-body text-sm border "+(mode==="price"?"border-amber-300 text-amber-700 bg-amber-50":"border-stone-300 text-stone-600")}>🏷️ Precio por día</button>
          </div>
          {mode==="block" ? (
            <div><p className="ff-body text-sm text-stone-500 mb-3">Tocá un día para ocuparlo o liberarlo. Los días en verde vienen de una reserva cargada y se cambian desde 📅 Reservas.</p><Calendar cursor={cursor} setCursor={setCursor} blocked={cu.blockedManual||cu.blocked||[]} locked={cu.resBlocked||[]} onDay={(day,info)=>{if(info.past)return; if(info.isRes){ alert("Ese día está tomado por una reserva. Editala o borrala desde la pestaña 📅 Reservas."); return; } toggleBlock(day);}} /></div>
          ) : (
            <div>
              <p className="ff-body text-sm text-stone-500 mb-3">Tocá un día para ponerle precio especial.</p>
              <Calendar cursor={cursor} setCursor={setCursor} blocked={cu.blockedManual||cu.blocked||[]} locked={cu.resBlocked||[]} selectedDay={selDay} priceOf={(d)=>nightlyPrice(up,d)} onDay={(day,info)=>{if(info.past)return;setSelDay(day);setPriceInput((cu.overrides&&cu.overrides[day]!=null)?String(cu.overrides[day]):"");}} />
              {selDay && (
                <div className="mt-4 bg-stone-50 rounded-xl p-3">
                  <div className="ff-body text-sm text-stone-700 mb-2">Precio para <strong>{selDay}</strong></div>
                  <div className="flex items-center gap-2">
                    <div className="flex items-center border border-stone-300 rounded-lg px-2 bg-white flex-1"><span className="text-stone-400 text-sm">$</span><input type="number" value={priceInput} onChange={e=>setPriceInput(e.target.value)} placeholder={String(nightlyPrice(up,selDay))} className="w-full py-2 ff-body text-sm outline-none" /></div>
                    <button onClick={()=>setOverride(priceInput)} className="text-white rounded-lg px-3 py-2 ff-body text-sm font-semibold" style={{background:C.moss}}>Aplicar</button>
                    <button onClick={()=>{setOverride("");setPriceInput("");}} className="border border-stone-300 rounded-lg px-3 py-2 ff-body text-sm text-stone-600">Quitar</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
        ); })()}
      </div>
    </div>
    </div>
  );
}

function Reservas({ profile, cabins, afterSync }) {
  const [res,setRes]=useState([]);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState("");
  const [tab,setTab]=useState("hoy");
  const [form,setForm]=useState(null);
  const [saving,setSaving]=useState(false);
  const [formMsg,setFormMsg]=useState("");
  const [gridFrom,setGridFrom]=useState(iso(TODAY));
  const [gridLen,setGridLen]=useState(14);
  const [gridVista,setGridVista]=useState("mes");
  const [mesCur,setMesCur]=useState(new Date(TODAY.getFullYear(),TODAY.getMonth(),1));
  const [mes,setMes]=useState(iso(TODAY).slice(0,7));
  const hoy = iso(TODAY);

  const traer = async () => {
    const { data, error } = await db.from("reservations").select("*").eq("rubro","hospedaje").order("start_date",{ascending:true});
    if(error){ setErr("No se pudieron leer las reservas. ¿Corriste el SQL de reservas en Supabase?"); return []; }
    setErr(""); setRes(data||[]); return data||[];
  };
  useEffect(()=>{ (async()=>{ setLoading(true); await traer(); setLoading(false); })(); },[]);

  // Una fila por cada cabaña de cada alojamiento del operador.
  const filas = [];
  (cabins||[]).forEach(c=>{
    const us = c.units||[];
    if(us.length) us.forEach((u,i)=> filas.push({ slug:c.slug, cab:c.name, name:u.name||("Cabaña "+(i+1)), cap:u.capacity||c.capacity, manual:(u.blockedManual||u.blocked||[]), c, u }));
    else filas.push({ slug:c.slug, cab:c.name, name:"", cap:c.capacity, manual:(c.blocked||[]), c, u:null });
  });
  const variosAloj = new Set(filas.map(f=>f.slug)).size > 1;
  const etiqueta = (f) => variosAloj ? (f.cab + (f.name?" · "+f.name:"")) : (f.name || f.cab);

  const activas = res.filter(r=>r.status!=="cancelada");
  const mapa = {}; const porDia = {};
  activas.forEach(r=> nightsBetween(r.start_date,r.end_date).forEach(d=>{ mapa[r.slug+"|"+uKey(r.unit)+"|"+d] = r; (porDia[d]=porDia[d]||[]).push(r); }));
  const reservaEn = (f,day) => mapa[f.slug+"|"+uKey(f.name)+"|"+day] || mapa[f.slug+"|*|"+day];

  const sugerirTotal = (f) => {
    const cab=(cabins||[]).find(c=>c.slug===f.slug); if(!cab) return 0;
    const u=(cab.units||[]).find(x=>(x.name||"")===f.unit);
    const p={ price:(u&&u.price!=null&&u.price!=="")?+u.price:cab.price, weekendPrice:(u&&u.weekendPrice!=null&&u.weekendPrice!=="")?+u.weekendPrice:cab.weekendPrice, overrides:(u&&u.overrides)||cab.overrides||{} };
    return nightsBetween(f.start_date,f.end_date).reduce((s,d)=>s+(Number(nightlyPrice(p,d))||0),0);
  };

  // Después de tocar una reserva: recargar y volver a escribir los días ocupados en la ficha.
  const sincronizar = async (slug) => {
    const todas = await traer();
    const cab = (cabins||[]).find(c=>c.slug===slug);
    if(cab && cab.id && (cab.units||[]).length){
      const units = recalcUnidades(cab, todas.filter(r=>r.slug===slug));
      await db.from("cabins").update({ units }).eq("id", cab.id);
      if(afterSync) afterSync();
    }
  };

  const abrirNueva = (pre={}) => { setFormMsg(""); setForm({ ...RES_EMPTY, slug:(filas[0]&&filas[0].slug)||"", unit:(filas[0]&&filas[0].name)||"", ...pre }); };

  const guardar = async () => {
    const f=form;
    if(!f.slug){ setFormMsg("Elegí el alojamiento."); return; }
    if(!String(f.guest_name||"").trim()){ setFormMsg("Poné el nombre del huésped."); return; }
    if(!f.start_date || !f.end_date){ setFormMsg("Cargá la entrada y la salida."); return; }
    if(nightsCount(f.start_date,f.end_date)<1){ setFormMsg("La salida tiene que ser posterior a la entrada."); return; }
    const noches = nightsBetween(f.start_date,f.end_date);
    const choque = activas.find(r=> r.id!==f.id && r.slug===f.slug && (!r.unit || !f.unit || r.unit===f.unit) && nightsBetween(r.start_date,r.end_date).some(d=>noches.includes(d)));
    if(choque && !confirm("Esa cabaña ya tiene la reserva de "+choque.guest_name+" del "+dmy(choque.start_date)+" al "+dmy(choque.end_date)+". ¿Guardar igual?")) return;
    setSaving(true);
    const row = { rubro:"hospedaje", operator:(profile&&profile.operator)||"", slug:f.slug, unit:f.unit||"", guest_name:f.guest_name, guest_phone:f.guest_phone||"", guest_email:f.guest_email||"", people:+f.people||1, start_date:f.start_date, end_date:f.end_date, status:f.status, total:+f.total||0, deposit:+f.deposit||0, channel:f.channel||"Directo", notes:f.notes||"" };
    if(f.id) row.id=f.id;
    const { error } = await db.from("reservations").upsert(row);
    setSaving(false);
    if(error){ setFormMsg("No se pudo guardar: "+error.message); return; }
    await sincronizar(f.slug);
    setForm(null);
  };

  const borrar = async (r) => {
    if(!confirm("¿Borrar la reserva de "+r.guest_name+"?")) return;
    await db.from("reservations").delete().eq("id",r.id);
    await sincronizar(r.slug);
  };

  if(loading) return <p className="ff-body text-stone-500 text-center py-16">Cargando reservas…</p>;

  const entran = activas.filter(r=>r.start_date===hoy);
  const salen  = activas.filter(r=>r.end_date===hoy);
  const ocupadas = filas.filter(f=>reservaEn(f,hoy));
  const libres   = filas.filter(f=>!reservaEn(f,hoy) && !(f.manual||[]).includes(hoy));
  const bloqueadas = filas.filter(f=>!reservaEn(f,hoy) && (f.manual||[]).includes(hoy));

  const dias = []; { let d=parseD(gridFrom); for(let i=0;i<gridLen;i++){ dias.push(iso(d)); d=addDay(d,1); } }

  const proximas = res.filter(r=> r.status!=="cancelada" ? ((r.end_date||r.start_date) >= hoy) : (r.start_date >= hoy))
                      .sort((a,b)=> a.start_date < b.start_date ? -1 : 1);
  const delMes = res.filter(r=> r.status!=="cancelada" && String(r.start_date||"").slice(0,7)===mes);
  const sum = (arr,k) => arr.reduce((s,x)=>s+(Number(x[k])||0),0);
  const totalMes = sum(delMes,"total"), senaMes = sum(delMes,"deposit");

  const Pill = ({ id, children }) => (
    <button onClick={()=>setTab(id)} className={"rounded-full px-4 py-2 ff-body text-sm border "+(tab===id?"text-white":"text-stone-600 border-stone-300 bg-white")} style={tab===id?{background:C.moss,borderColor:C.moss}:{}}>{children}</button>
  );
  const Estado = ({ s }) => { const e=EST[s]||EST.confirmada; return <span className="ff-body text-[11px] rounded-full px-2 py-0.5" style={{background:e.bg,color:e.fg}}>{e.l}</span>; };

  const Tarjeta = ({ r }) => {
    const f = filas.find(x=>x.slug===r.slug && x.name===(r.unit||""));
    const saldo = (Number(r.total)||0)-(Number(r.deposit)||0);
    return (
      <div className="border border-stone-200 rounded-xl p-3">
        <div className="flex items-start gap-2">
          <div className="min-w-0 flex-1">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="ff-display text-lg" style={{color:C.ink}}>{r.guest_name}</span>
              <Estado s={r.status} />
            </div>
            <p className="ff-body text-sm text-stone-500">{r.unit || (f?f.cab:"Toda la propiedad")}{variosAloj&&f?" · "+f.cab:""} · {r.people} {r.people===1?"huésped":"huéspedes"}</p>
            <p className="ff-body text-sm mt-1" style={{color:C.ink}}>{dmyLong(r.start_date)} → {dmyLong(r.end_date)} · {nightsCount(r.start_date,r.end_date)} noches</p>
            {(Number(r.total)||0)>0 && <p className="ff-body text-sm text-stone-500">{money(r.total)} · seña {money(r.deposit)} · <b style={{color:saldo>0?C.clay:C.moss}}>saldo {money(saldo)}</b></p>}
            {r.notes && <p className="ff-body text-xs text-stone-400 mt-1">{r.notes}</p>}
          </div>
          <div className="flex flex-col gap-1 shrink-0">
            {r.guest_phone && <a href={"https://wa.me/"+String(r.guest_phone).replace(/\D/g,"")} target="_blank" rel="noreferrer" className="rounded-lg px-2 py-1 ff-body text-xs border border-stone-300 text-stone-600">💬</a>}
            <button onClick={()=>{setFormMsg("");setForm({...r});}} className="rounded-lg px-2 py-1 ff-body text-xs border border-stone-300 text-stone-600">✎</button>
            <button onClick={()=>borrar(r)} className="rounded-lg px-2 py-1 ff-body text-xs border border-stone-300 text-rose-500">🗑️</button>
          </div>
        </div>
      </div>
    );
  };

  const cabSel = (cabins||[]).find(c=>c.slug===(form&&form.slug));
  const unidadesSel = cabSel ? (cabSel.units||[]).map((u,i)=>u.name||("Cabaña "+(i+1))) : [];

  return (
    <div>
      {err && <div className="bg-white rounded-2xl border border-rose-200 p-4 mb-5 ff-body text-sm text-rose-700">{err}</div>}

            </div>
            <button onClick={()=>setForm({...form,total:sugerirTotal(form)})} className="ff-body text-sm font-semibold mb-3" style={{color:C.clay}}>↻ Calcular el total con los precios cargados</button>
            <Field label="Por dónde reservó">
              <div className="flex flex-wrap gap-2">{CANALES.map(ch=>{ const on=form.channel===ch; return <button key={ch} onClick={()=>setForm({...form,channel:ch})} className={"rounded-full px-3 py-1.5 ff-body text-sm border "+(on?"text-white":"text-stone-600 border-stone-300")} style={on?{background:C.moss,borderColor:C.moss}:{}}>{ch}</button>; })}</div>

            <div className="flex gap-2">

              <button onClick={guardar} disabled={saving} className="flex-1 rounded-full px-4 py-2.5 ff-body text-sm font-semibold text-white disabled:opacity-50" style={{background:C.clay}}>{saving?"Guardando…":"Guardar reserva"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ProfileBar({ profile }) {
  const [logo, setLogo] = useState("");
  const [upLogo, setUpLogo] = useState(false);
  if(!profile) return null;
  const shown = logo || profile.logo || "";
  const onLogo = async (e) => {
    const f0=(e.target.files||[])[0]; if(!f0) return; setUpLogo(true);
    const f=await compressToWebp(f0, 512, 0.85);
    const path="logo-"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9.]/g,"_");
    const { error } = await db.storage.from("fotos").upload(path, f);
    if(!error){ const { data } = db.storage.from("fotos").getPublicUrl(path); const url=data.publicUrl; const oldL=logo||profile.logo; if(profile._id) await db.from("profiles").update({logo:url}).eq("id", profile._id); if(oldL) delFromStorage(oldL); setLogo(url); } else { alert("No se pudo subir el logo."); }
    setUpLogo(false); e.target.value="";
  };
  const RUBRO = { hospedaje:"Hospedaje", gastronomia:"Gastronomía", actividad:"Actividad", admin:"Admin" }[profile.role] || profile.role || "";
  const fmt = (s) => s ? s.split("-").reverse().join("/") : "—";
  let st = { label:"Pago sin registrar", bg:"#ececec", fg:"#777" };
  if(profile.next_due){ const t=new Date(); t.setHours(0,0,0,0); const d=new Date(profile.next_due+"T00:00:00"); const days=Math.round((d-t)/86400000);
    st = days<0 ? {label:"Pago vencido", bg:"#fde8e8", fg:"#b23b3b"} : days<=7 ? {label:"Vence en "+days+" días", bg:"#fdf0d8", fg:"#9a6b1e"} : {label:"Al día", bg:"#e7efe3", fg:C.moss}; }
  const initial = (profile.operator||profile._email||"?").trim().charAt(0).toUpperCase();
  const lim = profile.max_listings;
  return (
    <div className="bg-white rounded-2xl border border-black/5 p-4 mb-5 flex flex-wrap items-center gap-4">
      <label className="relative shrink-0 cursor-pointer" title="Subir / cambiar logo">
        <div className="w-12 h-12 rounded-full grid place-items-center text-white ff-display text-lg overflow-hidden" style={{background:C.moss}}>{shown ? <img src={shown} className="w-full h-full object-cover" /> : initial}</div>
        <span className="absolute -bottom-1 -right-1 w-5 h-5 rounded-full grid place-items-center text-[10px] text-white border-2 border-white" style={{background:C.clay}}>{upLogo?"…":"✎"}</span>
        <input type="file" accept="image/*" onChange={onLogo} disabled={upLogo} className="hidden" />
      </label>
      <div className="min-w-0">
        <div className="ff-display text-lg leading-tight" style={{color:C.ink}}>{profile.operator||"Tu cuenta"}</div>
        <div className="ff-body text-xs text-stone-500">{profile._email} · {RUBRO} · {lim!=null?(lim+" publicación"+(lim===1?"":"es")):"sin tope"}</div>
      </div>
      <div className="sm:ml-auto flex items-center gap-4 flex-wrap">
        <div><div className="ff-body text-[11px] text-stone-500">Último pago</div><div className="ff-body text-sm" style={{color:C.ink}}>{fmt(profile.last_paid)}</div></div>
        <div><div className="ff-body text-[11px] text-stone-500">Próximo pago</div><div className="ff-body text-sm" style={{color:C.ink}}>{fmt(profile.next_due)}</div></div>
        <span className="ff-body text-xs rounded-full px-2.5 py-1" style={{background:st.bg,color:st.fg}}>{st.label}</span>
      </div>
    </div>
  );
}

function App() {
  const [session,setSession]=useState(null);
  const [authReady,setAuthReady]=useState(false);
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [authErr,setAuthErr]=useState("");
  const [list,setList]=useState([]);
  const [loadingList,setLoadingList]=useState(false);
  const [editing,setEditing]=useState(null);
  const [saving,setSaving]=useState(false);
  const [soloEditor,setSoloEditor]=useState(false);
  const [toast,setToast]=useState("");
  const [profile,setProfile]=useState(null);
  const [views,setViews]=useState({});
  const [vista,setVista]=useState("alojamientos");

  useEffect(()=>{
    db.auth.getSession().then(({data})=>{ setSession(data.session); setAuthReady(true); });
    const { data: sub } = db.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  const load = async () => {
    setLoadingList(true);
    const { data:{ user } } = await db.auth.getUser();
    const { data: prof } = await db.from("profiles").select("role,operator,max_listings,last_paid,next_due,logo").eq("id",user.id).maybeSingle();
    setProfile(prof ? {...prof, _email:user.email, _id:user.id} : null);
    const isAdmin = prof && prof.role==="admin";
    if(prof && !isAdmin){
      const dest = { hospedaje:"panel.html", gastronomia:"gastro-panel.html", actividad:"act-panel.html" }[prof.role];
      if(dest && dest!=="panel.html"){ window.location.replace(dest); return; }
    }
    const res = isAdmin
      ? await db.from("cabins").select("*").order("created_at",{ascending:false})
      : await db.from("cabins").select("*").eq("operator",(prof&&prof.operator)||"___none___").order("created_at",{ascending:false});
    const rows = (!res.error && res.data) ? res.data.map(fromRow) : [];
    setList(rows);
    db.rpc("my_views").then(({data})=>{ const vm={}; (data||[]).forEach(r=>{ if(r.rubro==="hospedaje") vm[r.slug]=r.total; }); setViews(vm); });
    const lim = prof ? prof.max_listings : null;
    if(lim===1 && !isAdmin){ setSoloEditor(true); setEditing(rows[0] ? rows[0] : {...EMPTY, operator:(prof&&prof.operator)||""}); }
    else setSoloEditor(false);
    setLoadingList(false);
  };
  useEffect(()=>{ if(session) load(); },[session]);

  const flash = (m) => { setToast(m); setTimeout(()=>setToast(""),2500); };

  const login = async () => {
    setAuthErr("");
    const { error } = await db.auth.signInWithPassword({ email, password: pass });
    if(error) setAuthErr("No pudimos entrar. Revisá el email y la contraseña.");
  };
  const logout = async () => { await db.auth.signOut(); setList([]); setEditing(null); };

  const save = async () => {
    if(!editing.name){ flash("Poné un nombre"); return; }
    setSaving(true);
    const { data, error } = await db.from("cabins").upsert(toRow(editing)).select();
    setSaving(false);
    if(error){ flash("Error al guardar"); return; }
    flash("Guardado ✓");
    if(soloEditor){ if(data && data[0]) setEditing(fromRow(data[0])); }
    else { setEditing(null); load(); }
  };
  const remove = async (id) => {
    if(!confirm("¿Borrar este alojamiento?")) return;
    await db.from("cabins").delete().eq("id",id);
    load();
  };

  if(!authReady) return <div className="min-h-screen grid place-items-center ff-body" style={{background:C.paper,color:C.moss}}>Cargando…</div>;

  if(!session) return (
    <div className="min-h-screen grid place-items-center ff-body px-5" style={{background:C.paper}}>
      <div className="w-full max-w-sm bg-white rounded-2xl border border-black/5 p-7">
        <div className="text-center mb-5"><div className="text-3xl">⛰️</div><h1 className="ff-display text-2xl mt-1" style={{color:C.ink}}>Panel Visitando Tandil</h1><p className="ff-body text-sm text-stone-500">Entrá para gestionar los alojamientos</p></div>
        <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" className="w-full border border-stone-300 rounded-xl px-3 py-2.5 ff-body text-sm mb-2" />
        <input value={pass} onChange={e=>setPass(e.target.value)} type="password" placeholder="Contraseña" onKeyDown={e=>{if(e.key==="Enter")login();}} className="w-full border border-stone-300 rounded-xl px-3 py-2.5 ff-body text-sm mb-3" />
        {authErr && <p className="ff-body text-sm text-rose-600 mb-3">{authErr}</p>}
        <button onClick={login} className="w-full text-white rounded-xl py-3 ff-body font-semibold" style={{background:C.moss}}>Entrar</button>
      </div>
    </div>
  );

  const lim = profile ? profile.max_listings : null;
  const atLimit = lim!=null && list.length>=lim && !(profile&&profile.role==="admin");
  const verSitio = editing && editing.slug ? "cabana.html?slug="+editing.slug : null;

  return (
    <div className="min-h-screen ff-body" style={{background:C.paper}}>
      <header className="sticky top-0 z-30 border-b border-black/5" style={{background:C.paper}}>
        <div className="max-w-5xl mx-auto px-5 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2.5"><div className="grid place-items-center" style={{color:C.moss}}><svg viewBox="0 0 520 200" height="30" fill="none" stroke="currentColor" strokeWidth="13" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={{display:"block"}}><circle cx="64" cy="150" r="9" fill="currentColor" stroke="none"></circle><path d="M108,150 C150,148 154,142 186,116 C196,108 207,110 211,123 c -8,2 -10,12 1,13 c 9,1 9,-11 -1,-12 L248,128 L248,92 Q248,82 258,82 L306,82 Q316,82 316,92 L316,128 L316,141 C352,151 410,156 462,154 C470,153 475,151 480,150"></path></svg></div><div><div className="ff-display text-lg leading-none" style={{color:C.ink}}>Panel</div><div className="ff-body text-[11px] text-stone-500">Visitando Tandil</div></div></div>
          <div className="flex items-center gap-2">
            <a href="ayuda.html?rubro=hospedaje" target="_blank" rel="noreferrer" title="¿Cómo cargar? Ayuda" className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">❓ Ayuda</a>
            {vista==="reservas" ? (
              <button onClick={logout} className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">Salir</button>
            ) : (editing || soloEditor) ? (
              <>
                {verSitio && <a href={verSitio} target="_blank" rel="noreferrer" className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">👁️ Ver sitio</a>}
                {!soloEditor && <button onClick={()=>setEditing(null)} className="rounded-full px-4 py-2 ff-body text-sm border border-stone-300 text-stone-600">Cancelar</button>}
                <button onClick={save} disabled={saving} className="rounded-full px-4 py-2 ff-body text-sm font-semibold text-white disabled:opacity-50" style={{background:C.clay}}>{saving?"Guardando…":"Guardar"}</button>
                {soloEditor && <button onClick={logout} className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">Salir</button>}
              </>
            ) : (
              <>
                {!atLimit && <button onClick={()=>setEditing({...EMPTY, operator:(profile&&profile.operator)||""})} className="rounded-full px-4 py-2 ff-body text-sm font-semibold text-white" style={{background:C.clay}}>+ Nuevo</button>}
                <button onClick={logout} className="rounded-full px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">Salir</button>
              </>
            )}
          </div>
        </div>
        {toast && <div className="text-center ff-body text-xs py-1" style={{background:"#e7efe3",color:C.moss}}>{toast}</div>}
      </header>

      <div className="max-w-5xl mx-auto px-5 py-6">
        <ProfileBar profile={profile} />
        <div className="flex gap-2 mb-5">
          {[["alojamientos","🏡 Alojamientos"],["reservas","📅 Reservas"]].map(([k,l])=>(
            <button key={k} onClick={()=>setVista(k)} className={"rounded-full px-4 py-2 ff-body text-sm border "+(vista===k?"text-white":"text-stone-600 border-stone-300 bg-white")} style={vista===k?{background:C.moss,borderColor:C.moss}:{}}>{l}</button>
          ))}
        </div>
        {vista==="reservas" ? (
          <Reservas profile={profile} cabins={list} afterSync={load} />
        ) : (editing || soloEditor) ? (
          editing ? <Editor c={editing} set={setEditing} /> : <p className="ff-body text-stone-500 text-center py-16">Cargando…</p>
        ) : loadingList ? (
          <p className="ff-body text-stone-500 text-center py-16">Cargando alojamientos…</p>
        ) : list.length===0 ? (
          <div className="text-center py-16"><p className="ff-display text-xl mb-1" style={{color:C.ink}}>Todavía no hay alojamientos</p><p className="ff-body text-stone-500 mb-4">Cargá el primero con el botón “+ Nuevo”.</p></div>
        ) : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
            {list.map((c)=>(
              <div key={c.id} className="bg-white rounded-2xl border border-black/5 overflow-hidden">
                <div className="aspect-[16/10] bg-stone-200">{c.photos[0] && <img src={IMG(c.photos[0])} className="w-full h-full object-cover" />}</div>
                <div className="p-4">
                  <h3 className="ff-display text-lg" style={{color:C.ink}}>{c.name}</h3>
                  <p className="ff-body text-sm text-stone-500">{c.zone}</p>
                  {c.operator && <a href={"operador.html?op="+encodeURIComponent(c.operator)} target="_blank" rel="noreferrer" className="ff-body text-xs" style={{color:C.clay}}>👤 {c.operator}</a>}
                  <p className="ff-body text-sm mt-1" style={{color:C.ink}}><span className="font-bold">{money(c.price)}</span> / noche · hasta {c.capacity}</p>
                  <p className="ff-body text-xs text-stone-400 mt-1">👁 {views[c.slug]||0} visitas</p>
                  <div className="flex gap-2 mt-3">
                    <button onClick={()=>setEditing(c)} className="flex-1 rounded-lg py-2 ff-body text-sm font-semibold text-white" style={{background:C.moss}}>Editar</button>
                    <a href={c.operator ? "operador.html?op="+encodeURIComponent(c.operator)+"&rubro=hospedaje" : "cabana.html?slug="+c.slug} target="_blank" rel="noreferrer" className="rounded-lg px-3 py-2 ff-body text-sm border border-stone-300 text-stone-600">👁️ Ver</a>
                    <button onClick={()=>remove(c.id)} className="rounded-lg px-3 py-2 ff-body text-sm border border-stone-300 text-rose-500">🗑️</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      <footer className="py-8 text-center ff-body text-sm" style={{background:C.moss,color:"rgba(255,255,255,0.7)"}}>Panel Visitando Tandil · Creado por <a href="https://www.instagram.com/co.makers_/" target="_blank" rel="noopener noreferrer" style={{color:"inherit",textDecoration:"underline"}}>comaker</a></footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
(function(){
  function medir(){var p=document.querySelector('.pre');
    if(p) document.documentElement.style.setProperty('--preH', p.offsetHeight+'px');}
  window.addEventListener('load',medir);window.addEventListener('resize',medir);
  document.addEventListener('DOMContentLoaded',medir);setInterval(medir,1200);
})();
</script>
</body>
</html>
